// Rend la main au navigateur pour qu'il peigne (repli à 50 ms si les images ne sont pas peintes, onglet caché)
function pkYield() {
  return new Promise(resolve => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => setTimeout(fin, 0));
    setTimeout(fin, 50);
  });
}

// ---------- LECTURE D'UN PAQUET ----------
function pkNum(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }

// Un fichier refusé dit pourquoi, avec les mêmes textes que le Route Planner, le Datacard Generator et le Briefing Generator.
// Un vol illisible (sans groupName en chaîne, et en v1 sans aircraftType en chaîne) est ignoré et compté (skipped) ; sans théâtre ou sans aucun vol lisible, le paquet est refusé.
function pkNormalize(obj, filename) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj) || PK_FORMATS.indexOf(obj.format) < 0) {
    const f = (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj.format : undefined;
    const x = ((typeof f === 'string' && f !== '') || typeof f === 'number') ? String(f) : { pkKey: 'pk.fmt.unknown' };
    return { reason: { key: 'pk.err.format', args: [x, { pkKey: 'pk.fmt.pkg' }] } };
  }
  if (typeof obj.theatre !== 'string' || obj.theatre === '') return { reason: { key: 'pk.err.noTheatre', args: [] } };
  const list = Array.isArray(obj.flights) ? obj.flights : [];
  const v1 = obj.format === 'dcs-flight-package-v1';
  const flights = [];
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    if (!f || typeof f !== 'object' || typeof f.groupName !== 'string' || (v1 && typeof f.aircraftType !== 'string')) continue;
    const route = (f.route && f.route.points && typeof f.route.points === 'object') ? f.route.points : null;
    const units = (Array.isArray(f.units) ? f.units : []).filter(u => u && typeof u === 'object').map(u => ({
      name:     typeof u.name === 'string' ? u.name : '',
      type:     unitTypeOf(v1 ? f : null, u),      // v1 : le type du vol, pour les unités qui n'ont pas le leur
      liveryId: (typeof u.liveryId === 'string' && u.liveryId !== '') ? u.liveryId : null,
      radios:   (Array.isArray(u.radios) ? u.radios : [])
        .filter(r => r && pkNum(r.radioIndex) !== null && r.channels && typeof r.channels === 'object')
        .filter(r => !radioFreeCount(unitTypeOf(v1 ? f : null, u), r.radioIndex))      // un poste que la mission ne pré-règle pas (le poste HF des deux hélicoptères) : ignoré, rien n'est écrit ni dit
        .map(r => {
          const channels = {};
          for (const [c, fr] of Object.entries(r.channels)) if (pkNum(fr) !== null) channels[c] = fr;
          return { radioIndex: r.radioIndex, channels };
        }),
      payload:  (u.payload && typeof u.payload === 'object') ? u.payload : null,
    }));
    const types = [];
    units.forEach(u => { if (u.type !== '' && types.indexOf(u.type) < 0) types.push(u.type); });
    if (!units.length && v1 && f.aircraftType !== '') types.push(f.aircraftType);      // un vol v1 sans unité garde son type
    flights.push({
      groupName: f.groupName, types: types,
      coalition: typeof f.coalition === 'string' ? f.coalition : '',
      route: route, units: units,
      chk: { route: true, radios: true, loadout: true, livery: true },
    });
  }
  if (!flights.length) return { reason: { key: 'pk.err.noFlight', args: [] } };
  const sm = obj.sourceMission && typeof obj.sourceMission === 'object' ? obj.sourceMission : {};
  return { pk: {
    id: ++_PK_SEQ, filename: filename,
    theatre: obj.theatre,
    fingerprint: typeof sm.fingerprint === 'string' ? sm.fingerprint : '',
    flights: flights,
    skipped: list.length - flights.length,
  } };
}

// Une archive se reconnaît à ses deux premiers octets « PK » (ou à l'extension .zip) ; tout le reste est lu comme du JSON, quel que soit le nom
async function pkReadFile(file) {
  const name = file.name;
  const PK_READ = { reason: { key: 'pk.err.read', args: [] } };
  let head;
  try { head = new Uint8Array(await file.slice(0, 2).arrayBuffer()); } catch (e) { console.warn('[HQ] lecture du paquet :', e); return PK_READ; }
  let text;
  if ((head.length === 2 && head[0] === 0x50 && head[1] === 0x4B) || name.toLowerCase().endsWith('.zip')) {
    let entry, buf;
    try { buf = await file.arrayBuffer(); } catch (e) { console.warn('[HQ] lecture du paquet :', e); return PK_READ; }
    try { entry = (await JSZip.loadAsync(buf)).file('package.json'); }
    catch (e) { return { reason: { key: 'pk.err.zip', args: [] } }; }
    if (!entry) return { reason: { key: 'pk.err.zip', args: [] } };
    try { text = await entry.async('string'); }
    catch (e) { return { reason: { key: 'pk.err.zip', args: [] } }; }
  } else {
    try { text = await file.text(); } catch (e) { console.warn('[HQ] lecture du paquet :', e); return PK_READ; }
  }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { reason: { key: 'pk.err.parse', args: [] } }; }
  return pkNormalize(obj, name);
}

async function pkLoadFiles(files) {
  if (!_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  if (_PK_BUSY) return;
  _PK_REFUSED = [];
  let ok = 0, skipped = 0;
  for (const file of files) {
    let r;
    try { r = await pkReadFile(file); } catch (e) { console.warn('[HQ] paquet illisible :', e); r = { reason: { key: 'pk.err.parse', args: [] } }; }
    if (r.pk) { _PK_LIST.push(r.pk); ok++; skipped += r.pk.skipped; }
    else _PK_REFUSED.push({ name: file.name, reason: r.reason });
  }
  pkRender();
  let msg = tn('toast.pkLoaded', ok);
  if (_PK_REFUSED.length) msg += ' · ' + tf('pk.join', tn('toast.pkRefused', _PK_REFUSED.length), _PK_REFUSED.map(r => r.name).join(', '));
  if (skipped) msg += ' · ' + tn('pk.skip', skipped);
  const bad = _PK_REFUSED.length > 0;
  showToast((bad ? '⚠ ' : '') + msg, { type: bad ? 'err' : 'ok', ms: (bad || skipped) ? 6000 : 3000 });
}

// ---------- ÉTAT : recherche des vols, conflits, parties disponibles ----------
function pkComputeState() {
  const ctx = _HQ_MIZ_CONTEXT;
  const seq = [];
  for (const pk of _PK_LIST) {
    for (const fl of pk.flights) {
      const ms = ctx ? pkMatchGroups(ctx, fl.groupName, fl.coalition) : [];
      const tg = ms.length === 1 ? ms[0] : null;
      fl.multi = ms.length > 1 ? ms.length : 0;      // plusieurs groupes de même nom : rien n'est appliqué
      fl.found = !!tg;
      fl.gid = tg ? tg.group.groupId : null;
      fl.supBy = null;
      fl.avail = {
        route:   !!fl.route,
        radios:  fl.units.some(u => u.radios.length > 0),
        loadout: fl.units.some(u => !!u.payload),
        livery:  fl.units.some(u => !!u.liveryId),
      };
      seq.push({ pk, fl });
    }
  }
  // Le dernier chargé gagne : un vol est supplanté par le dernier vol qui vise le même groupe
  const last = new Map();
  for (const s of seq) if (s.fl.found) last.set(s.fl.gid, s);
  for (const s of seq) {
    if (!s.fl.found) continue;
    const w = last.get(s.fl.gid);
    if (w !== s) { s.fl.supBy = w.pk; }
  }
  return seq;
}

      html += '<button class="pk-x" type="button" data-pk-remove="' + pk.id + '"' + (busy ? ' disabled' : '') + ' aria-label="' + h(t('pk.remove')) + '">✕</button></div>';
      if (pk.skipped) html += '<div class="ui-avert">⚠ ' + h(tn('pk.skip', pk.skipped)) + '</div>';

        html += '<div class="ui-avert">⚠ ' + h(tf('pk.warnTheatre', pk.theatre || '?', ctx.theatre)) + '</div>';
      }

          (fl.types.length ? ' <span class="snap-flight-tag">' + h(fl.types.join(' + ')) + '</span> ' : ' ') +
          (!ctx ? '' : fl.found ? '<span class="pk-found">' + h(t('pk.found')) + '</span>' : fl.multi ? '' : '<span class="pk-absent">' + h(t('pk.absent')) + '</span>') +
          '</div>';
        if (fl.multi) html += '<div class="ui-avert">⚠ ' + h(tf('pk.w.multi', fl.groupName, fl.multi)) + '</div>';

          const on = !!ctx && fl.found && !fl.supBy && fl.avail[part];

// ---------- APPLICATION ----------
function pkTheatreOf(ctx) { return String(ctx.theatre || '').trim(); }

// Le point 1 du paquet part-il d'ailleurs que celui de la mission ? (type, airdromeId, helipadId, linkUnit, ou x/y à plus d'un mètre)
function pkStartsElsewhere(q, p) {
  for (const k of ['type', 'airdromeId', 'helipadId', 'linkUnit']) {
    if (JSON.stringify(q[k]) !== JSON.stringify(p[k])) return true;
  }
  for (const k of ['x', 'y']) {
    const a = Number(q[k]), b = Number(p[k]);
    if (!(Math.abs(a - b) <= 1)) return true;
  }
  return false;
}

// Plan d'écriture d'un vol trouvé : le « paquet » interne que buildPatchesFromPackage sait lire (identifiants de la mission du MC)
function pkPlanFlight(ctx, pk, fl, tg) {
  const warns = [];                       // { key, args }
  const done = { route: 0, chan: 0, radioUnits: 0, payload: 0, livery: 0 };
  const name = fl.groupName;
  const plan = { flight: { groupId: tg.group.groupId }, overrides: { radios: [], liveries: [] }, replacements: { payloads: [] } };

  // Les unités : par name exact, sinon par rang
  const used = new Set();
  const map = new Array(fl.units.length).fill(null);
  fl.units.forEach((u, i) => {
    const j = tg.units.findIndex((tu, k) => !used.has(k) && tu.name === u.name);
    if (j >= 0) { used.add(j); map[i] = tg.units[j]; }
  });
  fl.units.forEach((u, i) => {
    if (map[i]) return;
    const j = tg.units.findIndex((tu, k) => !used.has(k));
    if (j >= 0) { used.add(j); map[i] = tg.units[j]; }
    else warns.push({ key: 'pk.w.extraUnit', args: [name, u.name] });
  });

  if (fl.chk.route && fl.avail.route) {
    if (pk.theatre !== pkTheatreOf(ctx)) warns.push({ key: 'pk.w.theatreRoute', args: [name, pk.theatre || '?', pkTheatreOf(ctx)] });
    else if (!tg.group.pointsPos) warns.push({ key: 'pk.w.noRoute', args: [name] });
    else {
      // Le point 1 est celui de la mission : les points du paquet remplacent la route à partir du point 2
      const rp = _extractRouteAndPayloads(ctx.ast, tg.group.groupId);
      const pn = rp && rp.pointsNode;
      const e1 = pn && pn.kind === 'table' ? pn.entries.find(e => e.key && e.key.kind === 'int' && e.key.value === 1) : null;
      const pkgPts = fl.route;
      if (!e1) {
        // la route du groupe visé n'a pas de point : celle du paquet, en entier
        plan.replacements.route = { points: pkgPts };
        done.route = Object.keys(pkgPts).length;
        warns.push({ key: 'pk.w.routeEmpty', args: [name] });
      } else if (!luaTableReproducible(e1.value)) {
        warns.push({ key: 'pk.w.p1Fixed', args: [name] });
      } else {
        const p1 = astToValue(e1.value);
        const pts = { 1: p1 };
        for (const [k, v] of Object.entries(pkgPts)) if (k !== '1') pts[k] = v;
        if (pkgPts['1'] && typeof pkgPts['1'] === 'object' && pkStartsElsewhere(pkgPts['1'], p1)) {
          warns.push({ key: 'pk.w.departure', args: [name] });
        }
        for (const [k, v] of Object.entries(pkgPts)) {
          if (k === '1' || !v || typeof v !== 'object') continue;
          for (const f of ['linkUnit', 'helipadId']) {
            if (v[f] !== undefined && v[f] !== null) warns.push({ key: 'pk.w.pointRef', args: [name, k, f, v[f]] });
          }
        }
        plan.replacements.route = { points: pts };
        done.route = Object.keys(pts).length;
      }
    }
  }
  // Radios, emport et livrée ne s'écrivent sur une unité que si son type dans la mission est celui de l'unité du paquet ; sinon rien sur elle, et un avertissement.
  // (La route, qui est celle du groupe, s'applique comme avant.)
  const okType = new Array(fl.units.length).fill(true);
  fl.units.forEach((u, i) => {
    const tu = map[i];
    if (!tu || (tu.type || '') === u.type) return;
    const wants = (fl.chk.radios && fl.avail.radios && u.radios.length > 0) || (fl.chk.loadout && fl.avail.loadout && !!u.payload) || (fl.chk.livery && fl.avail.livery && !!u.liveryId);
    if (!wants) return;
    okType[i] = false;
    warns.push({ key: 'pk.w.type', args: [name, tu.name, tu.type || '?', u.type || '?'] });
  });
  if (fl.chk.radios && fl.avail.radios) {
    fl.units.forEach((u, i) => {
      const tu = map[i];
      if (!tu || !okType[i]) return;
      let wrote = false;
      for (const r of u.radios) {
        const tr = (tu.radios || []).find(x => x.index === r.radioIndex);
        if (!tr) { warns.push({ key: 'pk.w.radio', args: [name, pkRadioArg(tu.type, r.radioIndex), tu.name] }); continue; }
        for (const [c, fr] of Object.entries(r.channels)) {
          if (tr.channels && tr.channels[c]) {
            plan.overrides.radios.push({ unitId: tu.unitId, radioIndex: r.radioIndex, channel: c, frequency: fr });
            done.chan++; wrote = true;
          } else warns.push({ key: 'pk.w.chan', args: [name, pkChanArg(tu.type, r.radioIndex, c), pkRadioArg(tu.type, r.radioIndex), tu.name] });
        }
      }
      if (wrote) done.radioUnits++;
    });
  }
  if (fl.chk.loadout && fl.avail.loadout) {
    fl.units.forEach((u, i) => {
      const tu = map[i];
      if (!tu || !okType[i] || !u.payload) return;
      if (tu.payloadPos) { plan.replacements.payloads.push({ unitId: tu.unitId, payload: u.payload }); done.payload++; }
      else warns.push({ key: 'pk.w.payload', args: [name, tu.name] });
    });
  }
  if (fl.chk.livery && fl.avail.livery) {
    fl.units.forEach((u, i) => {
      const tu = map[i];
      if (!tu || !okType[i] || !u.liveryId) return;
      if (tu.liveryPos) { plan.overrides.liveries.push({ unitId: tu.unitId, liveryId: u.liveryId }); done.livery++; }
      else warns.push({ key: 'pk.w.livery', args: [name, tu.name] });
    });
  }
  return { plan, warns, done };
}

function pkDoneText(done) {
  const parts = [];
  if (done.route) parts.push(tn('pk.rep.route', done.route));
  if (done.chan) {
    const bits = [];
    if (done.radioUnits) bits.push(tn('pk.rep.units', done.radioUnits));
    if (done.chan) bits.push(tn('pk.rep.chan', done.chan));
    parts.push(tf('pk.rep.radios', bits.join(' ; ')));
  }
  if (done.payload) parts.push(tn('pk.rep.loadout', done.payload));
  if (done.livery) parts.push(tn('pk.rep.livery', done.livery));
  return parts.join(' · ');
}

// La fenêtre « Appliquer et télécharger le .miz » : le nom du .miz ouvert (sans .miz), puis _<horodatage>
function pkApplyAsk(opener) {
  if (_PK_BUSY || _mizLoading) return;
  if (!_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  fnAsk({
    titleKey: 'fn.miz.title', goKey: 'fn.miz.go', ext: '.miz',
    name: fnPart((_mizFilename || 'mission').replace(/\.miz$/i, ''), 'mission') + '_paquets_' + pkStamp(),
    opener: opener,
    run: name => pkApply(name)
  });
}

async function pkApply(name) {
  if (_PK_BUSY || _mizLoading) return;
  if (!_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  _PK_BUSY = true;
  pkRender();
  try {
    showToast(t('toast.pkApplying'), 120000);
    await pkYield();      // l'état occupé et le toast sont peints avant le premier vol
    const seq = pkComputeState();
    const total = seq.filter(s => s.fl.found && !s.fl.supBy).length;
    const base = _HQ_MIZ_CONTEXT;
    // Copie de travail : le contexte chargé n'est touché qu'après le dernier vol vérifié
    let work = { missionText: base.missionText, ast: base.ast, model: base.model, otherFilesMap: base.otherFilesMap, theatre: base.theatre };
    const lines = [];
    let applied = 0, absent = 0, warnN = 0, patchesN = 0, started = 0;
    for (const s of seq) {
      const { pk, fl } = s;
      const label = fl.groupName;
      if (!fl.found) {
        if (fl.multi) {
          warnN++;
          const n = fl.multi;
          lines.push({ cls: 'w', text: () => '⚠ ' + tf('pk.w.multi', label, n) });
        } else {
          absent++;
          lines.push({ cls: 'a', text: () => tf('pk.rep.absent', label, pk.filename) });
        }
        continue;
      }
      if (fl.supBy) {
        warnN++;
        const win = fl.supBy;
        lines.push({ cls: 'w', text: () => tf('pk.rep.conflict', label, pk.filename, win.filename) });
        continue;
      }
      if (started++ > 0) {
        showToast(tf('toast.pkApplyingN', started, total), 120000);
        await pkYield();  // et de nouveau entre deux vols
      }
      try {
        const tg = pkFindTarget(work, fl.groupName, fl.coalition);
        if (!tg) throw Object.assign(new Error('target group not found'), { pkErrors: [{ key: 'pk.e.targetGone', args: [] }] });
        const { plan, warns, done } = pkPlanFlight(work, pk, fl, tg);
        const built = buildPatchesFromPackage(plan, work);
        if (built.patches.length === 0) {
          lines.push({ cls: 'a', text: () => tf('pk.rep.nothing', label, pk.filename) });
        } else {
          const patchedSrc = applyPatches(work.missionText, built.patches);
          try { retokenizeSafety(patchedSrc); }
          catch (e) { console.warn('[HQ] relecture du texte écrit :', e); throw Object.assign(e, { pkErrors: [{ key: 'pk.e.retok', args: [] }] }); }
          verifyPatch(patchedSrc, plan);
          // Contexte réextrait après chaque vol
          const { tokens: rTk } = DCS_TOKENIZER.tokenize(patchedSrc);
          const rAst = DCS_PARSER.parse(rTk);
          const rModel = DCS_EXTRACTOR.extract(rAst, patchedSrc, _mizFilename || '', work.otherFilesMap, patchedSrc.split('\n'));
          work = { missionText: patchedSrc, ast: rAst, model: rModel, otherFilesMap: work.otherFilesMap, theatre: work.theatre };
          applied++; patchesN += built.patches.length;
          lines.push({ cls: 'ok', text: () => tf('pk.rep.ok', label, pk.filename, pkDoneText(done)) });
        }
        for (const w of warns) {
          warnN++;
          lines.push({ cls: 'w', text: () => '⚠ ' + tf.apply(null, [w.key].concat(w.args)) });
        }
        for (const w of built.warnings) {
          warnN++;
          lines.push({ cls: 'w', text: () => '⚠ ' + tf('pk.w.prefix', label, tf.apply(null, [w.key].concat(w.args))) });
        }
      } catch (err) {
        throw Object.assign(err, { pkFlight: label, pkFile: pk.filename });
      }
    }
    if (patchesN === 0) {
      _PK_REPORT = { lines, total: () => pkTotalText(applied, absent, warnN) };
      showToast(t('toast.pkNoChange'));
      return;
    }
    // Rien n'a échoué : l'archive est refaite (rebuildMizHQ) et le snapshot recalculé, puis seulement on télécharge et on change d'état
    const blob = await rebuildMizHQ(work.missionText);
    const snap = await buildMissionSnapshot(work.ast, work.model, work.missionText, _mizFilename || 'mission.miz', work.theatre);
    shareOrDownload(blob, name + '.miz', 'application/octet-stream', 'HQ', pkDownload);
    _HQ_MIZ_CONTEXT = { missionText: work.missionText, ast: work.ast, model: work.model, otherFilesMap: work.otherFilesMap, theatre: work.theatre };
    HQ_SNAPSHOT = snap;
    persistSnapshot();
    renderSnapshot(HQ_SNAPSHOT);
    _PK_REPORT = { lines, total: () => pkTotalText(applied, absent, warnN) };
    showToast(tn('pk.rep.applied', applied) + ' ✔', { type: 'ok' });
  } catch (err) {
    console.error('[HQ] application des paquets:', err);
    const fe = err || {};
    _PK_REPORT = { lines: [
      { cls: 'w', text: () => tf('pk.rep.fail', fe.pkFlight || '?', fe.pkFile || '?', pkErrText(fe)) },
      { cls: 'a', text: () => t('pk.rep.failTail') },
    ], total: null };
    showToast(tf('toast.pkFail', fe.pkFlight || '?'), { type: 'err' });
  } finally {
    _PK_BUSY = false;
    pkRender();
  }
}

function pkTotalText(applied, absent, warnN) {
  return tn('pk.rep.applied', applied) + ' · ' + tn('pk.rep.absentN', absent) + ' · ' + tn('pk.rep.warnN', warnN);
}

// ---------- SUPPRESSION DE VOLS ----------
// Les vols cochés sortent de `mission` (groupes retirés de leur tableau, suivants renumérotés) ; les liens Dynamic Spawn de `warehouses`
// qui les visent passent à 0. Le reste est recopié tel quel : les déclencheurs, les tâches et les scripts qui les nomment sont listés, pas modifiés.
const DEL_FLIGHT_CATS = ['plane', 'helicopter'];
const DEL_ALL_CATS = ['helicopter', 'plane', 'vehicle', 'static', 'ship'];

function delErr(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  return Object.assign(new Error(key + ' ' + args.join(' ')), { pkErrors: [{ key: key, args: args }] });
}
function delRoot(ast) { return ast.kind === 'assignment' ? ast.value : ast; }

// Les tableaux de groupes (pays par pays) des catégories demandées
function delEachList(ast, cats, fn) {
  const coal = _astGetKey(delRoot(ast), 'coalition');
  if (!coal) return;
  for (const ck of ['blue', 'red', 'neutrals']) {
    const side = _astGetKey(coal, ck);
    const countries = side ? _astGetKey(side, 'country') : null;
    if (!countries || countries.kind !== 'table') continue;
    for (const ce of countries.entries) {
      for (const cat of cats) {
        const catNode = _astGetKey(ce.value, cat);
        const gl = catNode ? _astGetKey(catNode, 'group') : null;
        if (gl && gl.kind === 'table') fn({ side: ck, cat: cat, list: gl });
      }
    }
  }
}
// Les groupId de chaque tableau de vols, dans l'ordre : sert à relire ce qui a été écrit
function delListIds(ast) {
  const out = [];
  delEachList(ast, DEL_FLIGHT_CATS, L => out.push(L.list.entries.map(e => dynNum(_astGetKey(e.value, 'groupId')))));
  return out;
}

// Un champ `group` d'un prédicat est une référence si le nom contient « group » ou finit par « _g » ; `unit` : « unit » ou « _u ».
// Les champs hérités de l'éditeur (c_time_after, c_random_less, le `unit` de c_group_dead) n'en sont pas.
function delPredRef(pred, field) {
  const p = String(pred || '');
  return field === 'group' ? (p.indexOf('group') >= 0 || /_g$/.test(p)) : (p.indexOf('unit') >= 0 || /_u$/.test(p));
}

function delSpan(a, b) { return { start: { offset: a }, end: { offset: b } }; }
// Sans recouvrement, par offset décroissant (applyPatches)
function delSortPatches(patches) {
  patches.sort((a, b) => b.pos.start.offset - a.pos.start.offset || b.pos.end.offset - a.pos.end.offset);
  for (let i = 1; i < patches.length; i++) {
    if (patches[i].pos.end.offset > patches[i - 1].pos.start.offset) throw delErr('pk.del.e.overlap');
  }
  return patches;
}

// Les écritures de `mission` : par tableau touché, les groupes supprimés sortent (ligne entière), les suivants prennent [1] … [n]
// (clé et commentaire « -- end of [k] ») ; un tableau vidé devient {}. Retourne aussi, par tableau, les groupId attendus après écriture.
function delMissionPatches(ast, text, gset, nameOf) {
  const patches = [], found = new Set(), expect = [];
  delEachList(ast, DEL_FLIGHT_CATS, L => {
    const es = L.list.entries;
    const ids = es.map(e => dynNum(_astGetKey(e.value, 'groupId')));
    const gone = ids.map(id => id !== null && gset.has(id));
    expect.push(ids.filter((id, i) => !gone[i]));
    if (!gone.some(x => x)) return;
    if (es.some((e, i) => !e.key || e.key.kind !== 'int' || e.key.value !== i + 1)) throw delErr('pk.del.e.keys');
    ids.forEach((id, i) => { if (gone[i]) found.add(id); });
    if (gone.every(x => x)) {
      // Un tableau vidé s'écrit {} sur la ligne de sa clé, comme DCS écrit une table vide (["tasks"] = {},)
      const s0 = L.list.pos.start.offset, back = /=\s*$/.exec(text.slice(Math.max(0, s0 - 200), s0));
      patches.push(back ? { pos: delSpan(s0 - back[0].length + 1, L.list.pos.end.offset), newValueStr: ' {}' } : { pos: L.list.pos, newValueStr: '{}' });
      return;
    }
    let k = 0;
    es.forEach((e, i) => {
      const start = e.keyPos.start.offset, end = e.valuePos.end.offset;
      if (gone[i]) {
        const nl = text.indexOf('\n', end), lineEnd = nl < 0 ? text.length : nl + 1;
        const ls = text.lastIndexOf('\n', start - 1) + 1;
        const pre = text.slice(ls, start), rest = text.slice(end, nl < 0 ? text.length : nl);
        if (/^[ \t]*$/.test(pre) && /^\s*[,;]?\s*(--[^\n]*)?$/.test(rest)) patches.push({ pos: delSpan(ls, lineEnd), newValueStr: '' });
        else {
          const m = /^\s*[,;]/.exec(text.slice(end, end + 40));
          patches.push({ pos: delSpan(start, end + (m ? m[0].length : 0)), newValueStr: '' });
        }
        return;
      }
      k++;
      if (k === e.key.value) return;
      patches.push({ pos: e.keyPos, newValueStr: '[' + k + ']' });
      const m = /^(\s*[,;]?\s*-- end of )\[(\d+)\]/.exec(text.slice(end, end + 80));
      if (m && Number(m[2]) === e.key.value) patches.push({ pos: delSpan(end + m[1].length, end + m[1].length + m[2].length + 2), newValueStr: '[' + k + ']' });
    });
  });
  for (const g of gset) if (!found.has(g)) throw delErr('pk.del.e.missing', nameOf(g));
  return { patches: delSortPatches(patches), expect: expect };
}

// Les liens Dynamic Spawn de `warehouses` : { sec, id, type, gid, node }
function delWhLinks(wroot) {
  const out = [];
  for (const sec of ['airports', 'warehouses']) {
    const sn = _astGetKey(wroot, sec);
    if (!sn || sn.kind !== 'table') continue;
    for (const we of sn.entries) {
      const w = we.value;
      if (!we.key || !w || w.kind !== 'table') continue;
      const ac = _astGetKey(w, 'aircrafts');
      for (const cat of ['planes', 'helicopters']) {
        const cn = ac ? _astGetKey(ac, cat) : null;
        if (!cn || cn.kind !== 'table') continue;
        for (const te of cn.entries) {
          if (!te.key) continue;
          const nd = _astGetKey(te.value, 'linkDynTempl');
          if (nd && nd.kind === 'number') out.push({ sec: sec, id: we.key.value, cat: cat, type: String(te.key.value), gid: nd.value, node: nd });
        }
      }
    }
  }
  return out;
}
function delWhParse(text) {
  const tk = DCS_TOKENIZER.tokenize(text);
  if (tk.errors && tk.errors.length) throw new Error('warehouses');
  const wa = DCS_PARSER.parse(tk.tokens);
  const wroot = wa.kind === 'assignment' ? wa.value : wa;
  if (!wroot || wroot.kind !== 'table') throw new Error('warehouses');
  return wroot;
}
// Le plan d'écriture de `warehouses` : chaque lien qui vise un groupe supprimé passe à 0, par édition ciblée
function delWhPlan(ctx, gset) {
  const plan = { text: '', all: [], links: [], patches: [], unreadable: false };
  const wf = ctx.otherFilesMap ? ctx.otherFilesMap['warehouses'] : null;
  if (!wf) return plan;
  try {
    plan.text = new TextDecoder('utf-8').decode(wf);
    plan.all = delWhLinks(delWhParse(plan.text));
  } catch (e) { plan.text = ''; plan.all = []; plan.unreadable = true; return plan; }
  plan.links = plan.all.filter(l => gset.has(l.gid));
  plan.patches = delSortPatches(plan.links.map(l => ({ pos: l.node.pos, newValueStr: '0' })));
  return plan;
}
function delWhName(l) {
  const airport = l.sec === 'airports';
  const w = _HQ_DYN ? _HQ_DYN.whs.find(x => x.id === l.id && (x.kind === 'airport') === airport) : null;
  return dynWhName(w || { kind: airport ? 'airport' : 'unit', id: l.id, name: null });
}

// Tâches : toute table qui porte un `id` (texte) et des `params`
function delWalkTasks(node, cb) {
  if (!node || node.kind !== 'table') return;
  const idN = _astGetKey(node, 'id'), pr = _astGetKey(node, 'params');
  if (idN && idN.kind === 'string' && pr && pr.kind === 'table') cb(idN.value, pr);
  for (const e of node.entries) delWalkTasks(e.value, cb);
}

// Ce qui vise encore les vols supprimés, sans y toucher : déclencheurs (trigrules), texte des a_do_script, tâches des autres groupes,
// zones de déclencheur mobiles, scripts de la mission (le nom du groupe et ceux de ses unités, entre guillemets)
function delRefs(ctx, gset) {
  const ast = ctx.ast, root = delRoot(ast);
  const info = new Map(), uset = new Map();   // groupId -> { name, units[] } ; unitId -> { gid, name }
  delEachList(ast, DEL_ALL_CATS, L => {
    for (const e of L.list.entries) {
      const g = e.value, gid = dynNum(_astGetKey(g, 'groupId'));
      if (gid === null || !gset.has(gid)) continue;
      const rec = { name: dynStr(_astGetKey(g, 'name')) || '', units: [] };
      info.set(gid, rec);
      const us = _astGetKey(g, 'units');
      if (us && us.kind === 'table') for (const ue of us.entries) {
        const uid = dynNum(_astGetKey(ue.value, 'unitId')), un = dynStr(_astGetKey(ue.value, 'name')) || '';
        if (uid !== null) uset.set(uid, { gid: gid, name: un });
        if (un !== '') rec.units.push(un);
      }
    }
  });
  const refs = new Map();
  gset.forEach(g => refs.set(g, { trig: [], trigScript: [], task: [], script: [], zone: [] }));
  // Les noms cherchés dans un texte : celui du groupe, puis ceux de ses unités, sans doublon ; un nom qui contient un guillemet,
  // une barre oblique inverse ou un retour à la ligne n'est pas cherché (écriture échappée dans le script)
  const searchable = nm => nm !== '' && !/["\\\n\r]/.test(nm);
  const namesOf = gid => {
    const rec = info.get(gid), out = [];
    if (searchable(rec.name)) out.push({ name: rec.name, unit: false });
    for (const un of rec.units) if (searchable(un) && !out.some(o => o.name === un)) out.push({ name: un, unit: true });
    return out;
  };
  const quoted = (txt, nm) => txt.indexOf('"' + nm + '"') >= 0 || txt.indexOf("'" + nm + "'") >= 0;
  // Déclencheurs : `trigrules` seulement (trig.conditions / trig.actions, la copie compilée, ne se lisent pas)
  const tr = _astGetKey(root, 'trigrules');
  if (tr && tr.kind === 'table') tr.entries.forEach((te, ti) => {
    const idx = (te.key && te.key.kind === 'int') ? te.key.value : ti + 1;
    const comment = dynStr(_astGetKey(te.value, 'comment')) || ('#' + idx);
    for (const sect of ['rules', 'actions']) {
      const sn = _astGetKey(te.value, sect);
      if (!sn || sn.kind !== 'table') continue;
      for (const xe of sn.entries) {
        const x = xe.value, pred = dynStr(_astGetKey(x, 'predicate'));
        if (pred === null) continue;
        const hit = new Set();
        if (delPredRef(pred, 'group')) { const v = dynNum(_astGetKey(x, 'group')); if (v !== null && gset.has(v)) hit.add(v); }
        if (delPredRef(pred, 'unit')) { const v = dynNum(_astGetKey(x, 'unit')); if (v !== null && uset.has(v)) hit.add(uset.get(v).gid); }
        hit.forEach(g => refs.get(g).trig.push({ comment: comment, pred: pred }));
        if (pred === 'a_do_script' || pred === 'c_do_script') {
          const txt = dynStr(_astGetKey(x, 'text'));
          if (txt) gset.forEach(g => {
            for (const o of namesOf(g)) {
              const r = refs.get(g).trigScript;
              if (quoted(txt, o.name) && !r.some(y => y.comment === comment && y.name === o.name)) r.push({ comment: comment, name: o.name, unit: o.unit });
            }
          });
        }
      }
    }
  });
  // Tâches des autres groupes, toutes catégories ; EPLRS porte un numéro de liaison de données, pas une référence ;
  // la route d'un groupe supprimé part avec lui
  delEachList(ast, DEL_ALL_CATS, L => {
    for (const e of L.list.entries) {
      const g = e.value, gid = dynNum(_astGetKey(g, 'groupId'));
      if (gid !== null && gset.has(gid)) continue;
      const route = _astGetKey(g, 'route');
      if (!route) continue;
      const owner = dynStr(_astGetKey(g, 'name')) || '';
      delWalkTasks(route, (id, pr) => {
        if (id === 'EPLRS') return;
        const hit = new Set();
        const a = dynNum(_astGetKey(pr, 'groupId')), b = dynNum(_astGetKey(pr, 'unitId'));
        if (a !== null && gset.has(a)) hit.add(a);
        if (b !== null && uset.has(b)) hit.add(uset.get(b).gid);
        hit.forEach(t => refs.get(t).task.push({ id: id, owner: owner }));
      });
    }
  });
  // Zones de déclencheur attachées à une unité d'un vol supprimé (linkUnit)
  const zones = _astGetKey(_astGetKey(root, 'triggers'), 'zones');
  if (zones && zones.kind === 'table') for (const ze of zones.entries) {
    const lu = dynNum(_astGetKey(ze.value, 'linkUnit'));
    if (lu !== null && uset.has(lu)) refs.get(uset.get(lu).gid).zone.push({ zone: dynStr(_astGetKey(ze.value, 'name')) || '', unit: uset.get(lu).name });
  }
  // Scripts de la mission : l10n/<langue>/*.lua ; un même nom court cité ne se liste qu'une fois, quel que soit le dossier de langue
  const files = ctx.otherFilesMap || {};
  const dec = new TextDecoder('utf-8');
  for (const fname of Object.keys(files).sort()) {
    if (!/^l10n\/[^/]+\/[^/]+\.lua$/i.test(fname)) continue;
    const txt = dec.decode(files[fname]), short = fname.split('/').pop();
    gset.forEach(g => {
      const r = refs.get(g).script;
      for (const o of namesOf(g)) {
        if (quoted(txt, o.name) && !r.some(y => y.file === short && y.name === o.name)) r.push({ file: short, name: o.name, unit: o.unit });
      }
    });
  }
  return refs;
}

// Ce que la fenêtre montre et ce que le compte rendu rappellera
function delAnalyze(ctx, ids) {
  const gset = new Set(ids);
  const refs = delRefs(ctx, gset);
  const wh = delWhPlan(ctx, gset);
  const flights = HQ_SNAPSHOT.flights.filter(f => gset.has(f.groupId)).map(f => {
    const r = refs.get(f.groupId);
    const dyn = wh.links.filter(l => l.gid === f.groupId).map(l => ({ name: delWhName(l), type: l.type }));
    dyn.sort((a, b) => dynCmp(a.name, b.name) || dynCmp(a.type, b.type));
    return { gid: f.groupId, name: f.groupName || '—', type: flightTypesLabel(f) || f.category || '', side: f.coalition || '', dyn: dyn,
      trig: r.trig, trigScript: r.trigScript, task: r.task, script: r.script, zone: r.zone };
  });
  let K = 0;
  for (const f of flights) K += f.trig.length + f.trigScript.length + f.task.length + f.script.length + f.zone.length;
  return { flights: flights, K: K, M: wh.links.length, badWh: wh.unreadable };
}
function delDynText(f) { return tf('pk.del.dyn', f.dyn.map(d => d.name + ' (' + d.type + ')').join(', ')); }
function delRefLines(f) {
  const out = [];
  for (const r of f.trig) out.push(tf('pk.del.trig', r.comment, r.pred));
  for (const r of f.trigScript) out.push(r.unit ? tf('pk.del.trigScriptUnit', r.name, r.comment) : tf('pk.del.trigScript', r.comment));
  for (const r of f.task) out.push(tf('pk.del.task', r.id, r.owner));
  for (const r of f.script) out.push(r.unit ? tf('pk.del.scriptUnit', r.name, r.file) : tf('pk.del.script', r.file));
  for (const r of f.zone) out.push(tf('pk.del.zone', r.zone, r.unit));
  return out;
}
function delBodyHtml(an) {
  const h = escapeHtml;
  let html = '';
  if (an.badWh) html += '<div class="ui-avert" data-del-error="1">⚠ ' + h(t('pk.del.wh.bad')) + '</div>';
  for (const f of an.flights) {
    html += '<div class="pk-flight" data-del-gid="' + h(String(f.gid)) + '"><div class="pk-flight-head">' + h(f.name) +
      ' <span class="snap-flight-tag">' + h(f.type) + '</span> <span class="snap-flight-tag">' + h(t('pk.flt.' + f.side, f.side)) + '</span></div>';
    if (f.dyn.length) html += '<div class="snap-meta" data-del-dyn="1">' + h(delDynText(f)) + '</div>';
    for (const line of delRefLines(f)) html += '<div class="ui-avert" data-del-ref="1">' + h(line) + '</div>';
    html += '</div>';
  }
  return html;
}

function pkDeleteAsk(opener) {
  if (_PK_BUSY || _mizLoading) return;
  if (!HQ_SNAPSHOT || !_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  const ids = HQ_SNAPSHOT.flights.filter(f => _PK_EXPORT_SEL.has(f.groupId)).map(f => f.groupId);
  if (ids.length === 0) return;
  let an;
  try { an = delAnalyze(_HQ_MIZ_CONTEXT, ids); }
  catch (err) {
    console.error('[HQ] suppression de groupes:', err);
    showToast(t('toast.pkDelFail'), { type: 'err' });
    return;
  }
  fnAsk({
    titleKey: 'fn.del.title', goKey: 'fn.del.go', ext: '.miz',
    name: fnPart((_mizFilename || 'mission').replace(/\.miz$/i, ''), 'mission') + '_' + pkStamp(),
    opener: opener,
    body: () => delBodyHtml(an),
    blocked: an.badWh,   // warehouses présent mais illisible : rien ne s'écrit
    run: name => pkDeleteApply(name, ids)
  });
}

// =============================================================
//  DYNAMIC SPAWN — écriture : un vol devient template (`mission`, dynSpawnTemplate) et se lie, par type d'appareil, aux aérodromes et FARP
//  (`warehouses`, linkDynTempl ; départ moteur tournant : allowHotStart). Éditions ciblées sur le texte ; tout le reste est recopié à l'octet.
// =============================================================
const DSX = { ctx: null, st: null, flights: [], wh: null, off: {}, was: {}, bound: false };

function dsxEntry(tbl, key) {
  if (!tbl || tbl.kind !== 'table') return null;
  return tbl.entries.find(e => e.key && String(e.key.value) === String(key)) || null;
}
// unitId -> nom de l'unité, toutes catégories (le nom d'un FARP ou d'un navire est celui de son unité)
function dsxUnitNames(ast) {
  const out = {};
  const coal = _astGetKey(delRoot(ast), 'coalition');
  for (const ck of ['blue', 'red', 'neutrals']) {
    const side = coal ? _astGetKey(coal, ck) : null, cs = side ? _astGetKey(side, 'country') : null;
    if (!cs || cs.kind !== 'table') continue;
    for (const ce of cs.entries) for (const cat of DEL_ALL_CATS) {
      const cn = _astGetKey(ce.value, cat), gl = cn ? _astGetKey(cn, 'group') : null;
      if (!gl || gl.kind !== 'table') continue;
      for (const ge of gl.entries) {
        const us = _astGetKey(ge.value, 'units');
        if (us && us.kind === 'table') for (const ue of us.entries) {
          const uid = dynNum(_astGetKey(ue.value, 'unitId')), un = dynStr(_astGetKey(ue.value, 'name'));
          if (uid !== null && un !== null) out[uid] = un;
        }
      }
    }
  }
  return out;
}

// Lit `warehouses` (lecture seule) : tous les entrepôts, avec leurs types d'appareils et les nœuds à écrire
function dsxScan(ctx) {
  const out = { state: 'ok', text: '', root: null, whs: [] };
  const wf = ctx.otherFilesMap ? ctx.otherFilesMap['warehouses'] : null;
  if (!wf) { out.state = 'absent'; return out; }
  try {
    out.text = new TextDecoder('utf-8').decode(wf);
    const back = new TextEncoder().encode(out.text);
    if (back.length !== wf.length || back.some((b, i) => b !== wf[i])) throw new Error('warehouses');
    out.root = delWhParse(out.text);
  } catch (e) { out.state = 'unreadable'; out.text = ''; out.root = null; return out; }
  const unitNames = dsxUnitNames(ctx.ast);
  const afNames = DYN_AIRDROMES[String(ctx.theatre || '').trim()] || {};
  for (const sec of ['airports', 'warehouses']) {
    const sn = _astGetKey(out.root, sec);
    if (!sn || sn.kind !== 'table') continue;
    for (const we of sn.entries) {
      const w = we.value;
      if (!we.key || !w || w.kind !== 'table') continue;
      const id = we.key.value, airport = sec === 'airports';
      const ds = _astGetKey(w, 'dynamicSpawn'), hn = _astGetKey(w, 'allowHotStart');
      const c = String(dynStr(_astGetKey(w, 'coalition')) || '').toLowerCase();
      const rec = { key: sec + '|' + id, sec: sec, id: id, kind: airport ? 'airport' : 'unit',
        name: airport ? (afNames[String(id)] || null) : (unitNames[id] || null),
        side: c === 'neutral' ? 'neutrals' : c, dyn: !!ds && ds.value === true,
        hot: !!hn && hn.value === true, hotNode: (hn && hn.kind === 'bool') ? hn : null, types: {}, anyLink: false };
      const ac = _astGetKey(w, 'aircrafts');
      for (const cat of ['planes', 'helicopters']) {
        const cn = ac ? _astGetKey(ac, cat) : null;
        if (!cn || cn.kind !== 'table') continue;
        for (const te of cn.entries) {
          if (!te.key || te.value.kind !== 'table') continue;
          const ln = _astGetKey(te.value, 'linkDynTempl');
          const nd = { tk: cat + '|' + te.key.value, type: String(te.key.value), tbl: te.value,
            linkNode: (ln && ln.kind === 'number') ? ln : null, gid: (ln && ln.kind === 'number') ? ln.value : 0, init: dsxEntry(te.value, 'initialAmount') };
          if (nd.gid) rec.anyLink = true;
          rec.types[nd.tk] = nd;
        }
      }
      out.whs.push(rec);
    }
  }
  return out;
}

// groupId -> { n, type } : toutes les unités du groupe, dans l'ordre du fichier (le snapshot ne garde que les unités Client ou Player)
function dsxGroupUnits(ast) {
  const out = {};
  delEachList(ast, DEL_FLIGHT_CATS, L => {
    for (const e of L.list.entries) {
      const gid = dynNum(_astGetKey(e.value, 'groupId')), us = _astGetKey(e.value, 'units');
      if (gid === null || !us || us.kind !== 'table') continue;
      out[gid] = { n: us.entries.length, type: us.entries.length ? (dynStr(_astGetKey(us.entries[0].value, 'type')) || '') : '' };
    }
  });
  return out;
}
function dsxFlightInfo(f, gu) {
  const g = gu && gu[f.groupId];
  const type = (g && g.type) || unitTypeOf(f, (f.units || [])[0]) || '';
  return { gid: f.groupId, name: f.groupName || '—', type: type, cat: f.category === 'helicopter' ? 'helicopters' : 'planes',
    tk: (f.category === 'helicopter' ? 'helicopters' : 'planes') + '|' + type, side: f.coalition || '', units: g ? g.n : (f.units || []).length };
}
function dsxTplName(gid) { const f = HQ_SNAPSHOT.flights.find(x => x.groupId === gid); return f ? (f.groupName || String(gid)) : String(gid); }
function dsxWhSort(a, b) { return ((a.kind === 'airport' ? 0 : 1) - (b.kind === 'airport' ? 0 : 1)) || dynCmp(dynWhName(a), dynWhName(b)); }

// Les patches d'insertion : une ligne, avec l'indentation et la fin de ligne du fichier
function dsxInsertFirst(text, g, fname) {
  const ks = g.entries[0].keyPos.start.offset, ls = text.lastIndexOf('\n', ks - 1) + 1, pre = text.slice(ls, ks), nl = text.indexOf('\n', ks);
  if (!/^[ \t]*$/.test(pre) || nl < 0) throw delErr('dyn.w.e.indentFlight', fname);
  const eol = text.charAt(nl - 1) === '\r' ? '\r\n' : '\n';
  return { pos: delSpan(ks, ks), newValueStr: '["dynSpawnTemplate"] = true,' + eol + pre };
}
function dsxInsertLink(text, nd, gid, wname) {
  const ie = nd.init;
  if (!ie) throw delErr('dyn.w.e.init', wname, nd.type);
  const ks = ie.keyPos.start.offset, end = ie.valuePos.end.offset, ls = text.lastIndexOf('\n', ks - 1) + 1, pre = text.slice(ls, ks), nl = text.indexOf('\n', end);
  if (!/^[ \t]*$/.test(pre) || nl < 0 || !/^\s*[,;]?\s*(--[^\n]*)?$/.test(text.slice(end, nl))) throw delErr('dyn.w.e.indentWh', wname);
  const eol = text.charAt(nl - 1) === '\r' ? '\r\n' : '\n';
  return { pos: delSpan(nl + 1, nl + 1), newValueStr: pre + '["linkDynTempl"] = ' + gid + ',' + eol };
}

// Quel vol montre la case « moteur tournant » d'un entrepôt : le premier qui coche son lien, à défaut le premier dont la liste le montre
// quand l'entrepôt porte déjà un lien. Une seule case par entrepôt.
function dsxOwners(DS) {
  const own = {}, tm = DS.flights.filter(f => DS.st.tmpl[f.gid]);
  if (DS.wh.state !== 'ok') return own;
  for (const f of tm) for (const w of DS.off[f.gid]) if (w.hotNode && DS.st.link[f.gid][w.key] && !(w.key in own)) own[w.key] = f.gid;
  for (const f of tm) for (const w of DS.off[f.gid]) if (w.hotNode && w.anyLink && !(w.key in own)) own[w.key] = f.gid;
  return own;
}
// Deux templates de même type cochés sur un même entrepôt : { f, w, others[] }
function dsxClashes(DS) {
  const claims = {};
  if (DS.wh.state !== 'ok') return [];
  for (const f of DS.flights) if (DS.st.tmpl[f.gid]) for (const w of DS.off[f.gid]) if (DS.st.link[f.gid][w.key]) (claims[w.key + '|' + f.tk] = claims[w.key + '|' + f.tk] || []).push({ f: f, w: w });
  const out = [];
  for (const k of Object.keys(claims)) if (claims[k].length > 1) out.push(claims[k]);
  return out;
}

// Le plan d'écriture : patches de `mission` et de `warehouses`, compteurs, lignes du compte rendu, valeurs attendues à la relecture
function dsxPlan(ctx, DS) {
  const st = DS.st, tids = dynTemplateIds();
  const plan = { mp: [], wp: [], N: 0, M: 0, K: 0, L: 0, H: 0, marks: [], links: [], hots: [], warns: [], clash: dsxClashes(DS), badUnmark: false,
    expT: {}, expLink: {}, expHot: {} };
  const win = new Map(DS.flights.map(f => [f.gid, f]));
  // mission
  const groups = {};
  delEachList(ctx.ast, DEL_FLIGHT_CATS, L => { for (const e of L.list.entries) { const g = dynNum(_astGetKey(e.value, 'groupId')); if (g !== null) groups[g] = e.value; } });
  for (const f of DS.flights) {
    const cur = !!tids[f.gid], want = !!st.tmpl[f.gid];
    plan.expT[f.gid] = want;
    if (cur === want) continue;
    const g = groups[f.gid];
    if (!g) throw delErr('dyn.w.e.missing', f.name);
    const kn = _astGetKey(g, 'dynSpawnTemplate');
    if (kn) plan.mp.push({ pos: kn.pos, newValueStr: want ? 'true' : 'false' });
    else plan.mp.push(dsxInsertFirst(ctx.missionText, g, f.name));
    plan.marks.push({ f: f, on: want });
    if (want) plan.N++;
    if (!want && DS.wh.state === 'unreadable') plan.badUnmark = true;
  }
  // warehouses
  if (DS.wh.state === 'ok') {
    const claims = {};
    for (const f of DS.flights) if (st.tmpl[f.gid]) for (const w of DS.off[f.gid]) if (st.link[f.gid][w.key]) claims[w.key + '|' + f.tk] = f;
    const text = DS.wh.text;
    for (const w of DS.wh.whs) {
      for (const tk of Object.keys(w.types)) {
        const nd = w.types[tk], nk = w.key + '|' + tk, cur = nd.gid;
        let fin = cur, why = '';
        if (claims[nk]) { fin = claims[nk].gid; }
        else if (cur && win.has(cur)) {
          const f = win.get(cur);
          if (tids[cur] && !st.tmpl[cur]) { fin = 0; why = 'unmark'; }
          else if (st.tmpl[cur] && f.tk === tk && w.dyn) { fin = 0; why = 'uncheck'; }
        }
        plan.expLink[nk] = fin;
        if (fin === cur) continue;
        if (nd.linkNode) plan.wp.push({ pos: nd.linkNode.pos, newValueStr: String(fin) });
        else plan.wp.push(dsxInsertLink(text, nd, fin, dynWhName(w)));
        const ch = { w: w, type: nd.type, from: cur, to: fin, why: why };
        plan.links.push(ch);
        if (fin === 0) plan.L++; else if (cur === 0) plan.M++; else plan.K++;
        if (fin !== 0) {
          const f = win.get(fin);
          if (f && f.side && w.side && f.side !== w.side) plan.warns.push({ k: 'side', f: f, w: w });
        }
      }
    }
    const own = dsxOwners(DS);
    for (const w of DS.wh.whs) {
      plan.expHot[w.key] = w.hot;
      if (!(w.key in own)) continue;
      const want = !!st.hot[w.key];
      if (want === w.hot) continue;
      plan.wp.push({ pos: w.hotNode.pos, newValueStr: want ? 'true' : 'false' });
      plan.expHot[w.key] = want;
      plan.hots.push({ w: w, on: want });
      plan.H++;
    }
  }
  // signalement : un template de plus d'un appareil (sans bloquer)
  const touched = new Set(plan.marks.filter(m => m.on).map(m => m.f.gid));
  for (const l of plan.links) if (l.to) touched.add(l.to);
  for (const f of DS.flights) if (st.tmpl[f.gid] && f.units > 1 && touched.has(f.gid)) plan.warns.unshift({ k: 'multi', f: f });
  plan.mp = delSortPatches(plan.mp);
  plan.wp = delSortPatches(plan.wp);
  plan.empty = !plan.mp.length && !plan.wp.length;
  return plan;
}

// ----- la relecture : deux arbres comparés valeur par valeur, sauf aux nœuds que l'écriture visait -----
function dsxEq(a, b, special, path, diffs) {
  if (diffs.length > 4) return;
  const sp = special.get(a);
  if (sp) { for (const d of sp(b, path)) diffs.push(d); return; }
  if (!a || !b || a.kind !== b.kind) { diffs.push(path.join('/')); return; }
  if (a.kind === 'table') {
    if (a.entries.length !== b.entries.length) { diffs.push(path.join('/') + ' (n)'); return; }
    for (let i = 0; i < a.entries.length; i++) {
      const x = a.entries[i], y = b.entries[i];
      const kx = x.key ? x.key.kind + ':' + x.key.value : '', ky = y.key ? y.key.kind + ':' + y.key.value : '';
      if (kx !== ky) { diffs.push(path.join('/') + ' (clé)'); return; }
      dsxEq(x.value, y.value, special, path.concat(kx), diffs);
    }
    return;
  }
  if (a.value !== b.value) diffs.push(path.join('/'));
}
// Une table dont une clé est visée : le reste égal, entrée par entrée ; check(valeur de la clé dans le nouveau, position dans le nouveau) -> écart ou ''
function dsxEqWithout(a, b, special, path, key, check) {
  const fa = a.entries.filter(e => !(e.key && e.key.value === key)), fb = b.entries.filter(e => !(e.key && e.key.value === key));
  const diffs = [];
  if (fa.length !== fb.length) return [path.join('/') + ' (n)'];
  for (let i = 0; i < fa.length; i++) {
    const kx = fa[i].key ? fa[i].key.kind + ':' + fa[i].key.value : '', ky = fb[i].key ? fb[i].key.kind + ':' + fb[i].key.value : '';
    if (kx !== ky) return [path.join('/') + ' (clé)'];
    dsxEq(fa[i].value, fb[i].value, special, path.concat(kx), diffs);
  }
  const n = b.entries.filter(e => e.key && e.key.value === key);
  const bad = check(n.length === 1 ? n[0] : null, b);
  if (bad) diffs.push(path.join('/') + ' ' + bad);
  return diffs;
}

function dsxVerify(base, DS, plan, mAst, wText, wRootNew, work) {
  const diffs = [];
  // mission : les marques attendues, puis tout le reste égal
  const special = new Map();
  const oldGroups = {};
  delEachList(base.ast, DEL_FLIGHT_CATS, L => { for (const e of L.list.entries) { const g = dynNum(_astGetKey(e.value, 'groupId')); if (g !== null) oldGroups[g] = e.value; } });
  const tids = dynTemplateIds();
  for (const f of DS.flights) {
    if (!!tids[f.gid] === !!DS.st.tmpl[f.gid]) continue;
    const want = !!DS.st.tmpl[f.gid];
    special.set(oldGroups[f.gid], (nb, path) => dsxEqWithout(oldGroups[f.gid], nb, special, path, 'dynSpawnTemplate', (ent, tbl) => {
      if (!ent || ent.value.kind !== 'bool' || ent.value.value !== want) return 'dynSpawnTemplate';
      if (!dsxEntry(oldGroups[f.gid], 'dynSpawnTemplate') && tbl.entries[0] !== ent) return 'dynSpawnTemplate (rang)';
      return '';
    }));
  }
  dsxEq(delRoot(base.ast), delRoot(mAst), special, ['mission'], diffs);
  if (diffs.length) throw delErr('dyn.w.e.mission', diffs.slice(0, 3).join(' ; '));
  const want = {};
  for (const g of Object.keys(tids)) want[g] = true;
  for (const f of DS.flights) { if (DS.st.tmpl[f.gid]) want[f.gid] = true; else delete want[f.gid]; }
  const got = {};
  delEachList(mAst, DEL_FLIGHT_CATS, L => { for (const e of L.list.entries) { const g = dynNum(_astGetKey(e.value, 'groupId')); const k = _astGetKey(e.value, 'dynSpawnTemplate'); if (g !== null && k && k.value === true) got[g] = true; } });
  if (JSON.stringify(Object.keys(want).sort()) !== JSON.stringify(Object.keys(got).sort())) throw delErr('dyn.w.e.template');
  // warehouses
  if (wRootNew) {
    const sp2 = new Map();
    for (const w of DS.wh.whs) {
      if (w.hotNode && plan.expHot[w.key] !== w.hot) sp2.set(w.hotNode, (nb, path) => (nb && nb.kind === 'bool' && nb.value === plan.expHot[w.key]) ? [] : [path.join('/')]);
      for (const tk of Object.keys(w.types)) {
        const nd = w.types[tk], fin = plan.expLink[w.key + '|' + tk];
        if (fin === undefined || fin === nd.gid) continue;
        sp2.set(nd.tbl, (nb, path) => dsxEqWithout(nd.tbl, nb, sp2, path, 'linkDynTempl', (ent, tbl) => {
          if (!ent || ent.value.kind !== 'number' || ent.value.value !== fin) return 'linkDynTempl';
          if (!nd.linkNode) { const i = tbl.entries.indexOf(ent); if (i < 1 || !tbl.entries[i - 1].key || tbl.entries[i - 1].key.value !== 'initialAmount') return 'linkDynTempl (rang)'; }
          return '';
        }));
      }
    }
    const d2 = [];
    dsxEq(DS.wh.root, wRootNew, sp2, ['warehouses'], d2);
    if (d2.length) throw delErr('dyn.w.e.wh', d2.slice(0, 3).join(' ; '));
    // les liens relus par le lecteur de HQ
    const after = {};
    for (const l of delWhLinks(wRootNew)) after[l.sec + '|' + l.id + '|' + l.cat + '|' + l.type] = l.gid;
    for (const w of DS.wh.whs) for (const tk of Object.keys(w.types)) {
      const nd = w.types[tk], fin = plan.expLink[w.key + '|' + tk];
      const exp = fin === undefined ? nd.gid : fin, k = w.key + '|' + tk;
      if ((after[k] || 0) !== exp) throw delErr('dyn.w.e.links', dynWhName(w), nd.type);
    }
  }
  const keep = pkClientGroups(base).map(g => g.group.groupId);
  if (JSON.stringify(pkClientGroups(work).map(g => g.group.groupId)) !== JSON.stringify(keep)) throw delErr('dyn.w.e.clients');
}

// ----- la fenêtre -----
let _dsxWarnKey = '';       // une seule alerte console par échec du plan, pas une par rendu de la fenêtre
function dsxSafePlan() {
  try { return { plan: dsxPlan(DSX.ctx, DSX), err: null }; }
  catch (e) {
    const k = String(e && e.stack || e);
    if (k !== _dsxWarnKey) { _dsxWarnKey = k; console.warn('[HQ] plan Dynamic Spawn :', e); }
    return { plan: null, err: e };
  }
}
function dsxBody() {

  if (sp.err) html += '<div class="ui-avert" data-dsx-error="1">⚠ ' + h(pkErrText(sp.err)) + '</div>';
  const clash = dsxClashes(DSX);
  for (const f of DSX.flights) {
    html += '<div class="pk-flight" data-dsx-gid="' + h(String(f.gid)) + '"><div class="pk-flight-head">' + h(f.name) +
      ' <span class="snap-flight-tag">' + h(f.type) + '</span> <span class="snap-flight-tag">' + h(t('pk.flt.' + f.side, f.side)) + '</span></div>';
    html += '<label class="pk-chk"><input type="checkbox" data-dsx-tmpl="' + h(String(f.gid)) + '"' + (st.tmpl[f.gid] ? ' checked' : '') + '>' + h(t('dyn.w.template')) + '</label>';
    if (st.tmpl[f.gid]) {
      if (DSX.wh.state === 'ok') {
        const all = DSX.wh.whs;
        const off = all.filter(w => !w.dyn), offT = off.filter(w => f.tk in w.types), noType = all.filter(w => w.dyn && !(f.tk in w.types));
        if (off.length) {
          let who = offT.map(dynWhName).sort(dynCmp).join(', ');
          const rest = off.length - offT.length;
          if (rest) who += (who ? tf('dyn.w.offMore', String(rest)) : tf('dyn.w.offOnly', String(rest)));
          html += '<div class="snap-meta dsx-off" data-dsx-off="1">' + h(tf('dyn.w.off', who)) + '</div>';
        }
        if (noType.length) html += '<div class="snap-meta dsx-off" data-dsx-off="1">' + h(tf('dyn.w.notype', f.type, noType.map(dynWhName).sort(dynCmp).join(', '))) + '</div>';
        if (!DSX.off[f.gid].length) html += '<div class="ui-avert">' + h(t('dyn.w.none')) + '</div>';
        for (const w of DSX.off[f.gid]) {
          const cur = w.types[f.tk].gid, on = !!st.link[f.gid][w.key];
          html += '<div class="pk-parts dsx-wh" data-dsx-wh="' + h(w.key) + '"><label class="pk-chk"><input type="checkbox" data-dsx-link="' + h(f.gid + '#' + w.key) + '"' + (on ? ' checked' : '') + '>' +
            h(dynWhName(w)) + ' <span class="snap-flight-tag">' + h(t('pk.flt.' + w.side, w.side)) + '</span></label>';
          if (own[w.key] === f.gid) html += '<label class="pk-chk dsx-hot"><input type="checkbox" data-dsx-hot="' + h(w.key) + '"' + (st.hot[w.key] ? ' checked' : '') + '>' + h(t('dyn.w.hot')) + '</label>';
          if (cur && cur !== f.gid) html += '<span class="snap-meta dsx-lib" data-dsx-lib="1">' + h(tf(on ? 'dyn.w.replaces' : 'dyn.w.linked', dsxTplName(cur))) + '</span>';
          html += '</div>';
          for (const grp of clash) if (grp.length > 1 && grp.some(x => x.f === f && x.w === w)) html += '<div class="ui-avert" data-dsx-clash="1">' + h(tf('dyn.w.clash', dynWhName(w), f.type)) + '</div>';

    } else if (DSX.was[f.gid] && DSX.was[f.gid].length) {

      if (DSX.wh.state === 'unreadable') html += '<div class="ui-avert" data-dsx-error="1">⚠ ' + h(t('dyn.w.unmarkBad')) + '</div>';
    } else if (DSX.wasT[f.gid] && DSX.wh.state === 'unreadable') {

}
function dsxBlocked() {
  const sp = dsxSafePlan();

}
function dsxRefresh() {
  const el = FN.bodyEl, keep = el ? el.scrollTop : 0, a = document.activeElement;
  let sel = null;
  if (a && a.getAttribute) for (const at of ['data-dsx-tmpl', 'data-dsx-link', 'data-dsx-hot']) if (a.hasAttribute(at)) sel = '[' + at + '="' + a.getAttribute(at).replace(/"/g, '\\"') + '"]';
  FN.blocked = dsxBlocked();

  if (FN.bodyEl) {

}
function dsxAsk(opener) {
  if (_PK_BUSY || _mizLoading || !HQ_SNAPSHOT || !_HQ_MIZ_CONTEXT || !_HQ_DYN) return;
  const ids = HQ_SNAPSHOT.flights.filter(f => _PK_EXPORT_SEL.has(f.groupId)).map(f => f.groupId);
  if (!ids.length) return;
  const ctx = _HQ_MIZ_CONTEXT;
  DSX.ctx = ctx;
  DSX.wh = dsxScan(ctx);
  DSX.flights = HQ_SNAPSHOT.flights.filter(f => _PK_EXPORT_SEL.has(f.groupId)).map(f => dsxFlightInfo(f, dsxGroupUnits(ctx.ast)));
  const tids = dynTemplateIds();
  DSX.st = { tmpl: {}, link: {}, hot: {} };
  DSX.off = {}; DSX.was = {}; DSX.wasT = {};
  for (const w of DSX.wh.whs) DSX.st.hot[w.key] = w.hot;
  for (const f of DSX.flights) {
    DSX.st.tmpl[f.gid] = !!tids[f.gid];
    DSX.wasT[f.gid] = !!tids[f.gid];
    DSX.st.link[f.gid] = {};
    const rank = w => { const c = w.types[f.tk].gid; return c === f.gid ? 0 : (c ? 1 : 2); };
    DSX.off[f.gid] = DSX.wh.whs.filter(w => w.dyn && f.tk in w.types).sort((x, y) => rank(x) - rank(y) || dsxWhSort(x, y));
    for (const w of DSX.off[f.gid]) if (w.types[f.tk].gid === f.gid) DSX.st.link[f.gid][w.key] = true;
    // tous les liens qui visent ce vol, quel que soit le type : ce que « démarquer » remet à zéro
    const was = [];
    for (const w of DSX.wh.whs) for (const tk of Object.keys(w.types)) if (w.types[tk].gid === f.gid) was.push({ name: dynWhName(w), type: w.types[tk].type, w: w });
    was.sort((a, b) => dynCmp(a.name, b.name) || dynCmp(a.type, b.type));
    if (was.length) DSX.was[f.gid] = was;
  }
  if (!DSX.bound) {
    DSX.bound = true;
    document.getElementById('fn-modal').addEventListener('change', e => {
      const c = e.target;
      if (!c || !c.hasAttribute || FN.titleKey !== 'fn.dyn.title' || !FN.bodyEl || !FN.bodyEl.contains(c)) return;
      if (c.hasAttribute('data-dsx-tmpl')) DSX.st.tmpl[Number(c.getAttribute('data-dsx-tmpl'))] = c.checked;
      else if (c.hasAttribute('data-dsx-hot')) DSX.st.hot[c.getAttribute('data-dsx-hot')] = c.checked;
      else if (c.hasAttribute('data-dsx-link')) { const p = c.getAttribute('data-dsx-link').split('#'); DSX.st.link[Number(p[0])][p[1]] = c.checked; }
      else return;
      dsxRefresh();
    });
  }
  fnAsk({
    titleKey: 'fn.dyn.title', goKey: 'fn.dyn.go', ext: '.miz',
    name: fnPart((_mizFilename || 'mission').replace(/\.miz$/i, ''), 'mission') + '_' + pkStamp(),
    opener: opener, wide: true,
    head: () => t('dyn.w.prereq'),
    body: dsxBody,
    blocked: dsxBlocked(),

}

// ----- l'écriture -----
async function dsxApply(name) {
  if (_PK_BUSY || _mizLoading) return;
  const base = _HQ_MIZ_CONTEXT;
  if (!base || !HQ_SNAPSHOT || base !== DSX.ctx) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  _PK_BUSY = true;
  pkRender();
  try {
    showToast(t('toast.dsxWriting'), 120000);
    await pkYield();
    const plan = dsxPlan(base, DSX);
    if (plan.clash.length) throw delErr('dyn.w.e.clash');
    if (plan.badUnmark) throw delErr('dyn.w.unmarkBad');
    if (plan.empty) throw delErr('dyn.w.nochange');
    // mission : éditions ciblées, puis relecture
    const missionText = applyPatches(base.missionText, plan.mp);
    let mAst;
    try {
      retokenizeSafety(missionText);
      mAst = DCS_PARSER.parse(DCS_TOKENIZER.tokenize(missionText).tokens);
    } catch (e) { console.warn('[HQ] relecture du texte écrit :', e); throw delErr('dyn.w.e.reparse'); }
    // warehouses
    let otherFilesMap = base.otherFilesMap, wText = DSX.wh.text, wRootNew = null;
    if (plan.wp.length) {
      wText = applyPatches(DSX.wh.text, plan.wp);
      try { wRootNew = delWhParse(wText); } catch (e) { console.warn('[HQ] relecture du fichier warehouses :', e); throw delErr('dyn.w.e.whparse'); }
      otherFilesMap = Object.assign({}, base.otherFilesMap);
      otherFilesMap['warehouses'] = new TextEncoder().encode(wText);
    }
    const model = DCS_EXTRACTOR.extract(mAst, missionText, _mizFilename || '', otherFilesMap, missionText.split('\n'));
    const work = { missionText: missionText, ast: mAst, model: model, otherFilesMap: otherFilesMap, theatre: base.theatre };
    dsxVerify(base, DSX, plan, mAst, wText, wRootNew, work);
    const dyn = dynBuild(mAst, otherFilesMap, base.theatre);
    const blob = await rebuildMizHQ(missionText, otherFilesMap);
    const snap = await buildMissionSnapshot(mAst, model, missionText, _mizFilename || 'mission.miz', base.theatre);
    // Rien n'a échoué : on remet le fichier, puis seulement on change d'état
    shareOrDownload(blob, name + '.miz', 'application/octet-stream', 'HQ', pkDownload);
    _HQ_MIZ_CONTEXT = work;
    _HQ_DYN = dyn;
    HQ_SNAPSHOT = snap;
    persistSnapshot();
    _PK_EXPORT_SEL.clear();
    renderSnapshot(HQ_SNAPSHOT);
    // Le compte rendu : les cinq compteurs, une ligne par changement, puis les signalements
    const nm = f => f.name, S = s => t('pk.flt.' + s, s);
    const lines = [{ cls: 'ok', text: () => [tn('dyn.w.rep.n', plan.N), tn('dyn.w.rep.m', plan.M), tn('dyn.w.rep.k', plan.K), tn('dyn.w.rep.l', plan.L), tn('dyn.w.rep.h', plan.H)].join(' · ') }];
    for (const m of plan.marks) lines.push({ cls: 'a', text: () => tf(m.on ? 'dyn.w.rep.mark' : 'dyn.w.rep.unmark', nm(m.f), m.f.type) });
    for (const l of plan.links) {
      const wn = () => dynWhName(l.w);
      if (l.to === 0) lines.push({ cls: 'a', text: () => tf('dyn.w.rep.unlink', dsxTplNameOf(l.from), wn(), l.type) });
      else if (l.from === 0) lines.push({ cls: 'a', text: () => tf('dyn.w.rep.link', dsxTplNameOf(l.to), wn(), l.type) });
      else lines.push({ cls: 'a', text: () => tf('dyn.w.rep.repl', dsxTplNameOf(l.to), wn(), l.type, dsxTplNameOf(l.from)) });
    }
    for (const x of plan.hots) lines.push({ cls: 'a', text: () => tf(x.on ? 'dyn.w.rep.hotOn' : 'dyn.w.rep.hotOff', dynWhName(x.w)) });
    for (const x of plan.warns) {
      if (x.k === 'multi') lines.push({ cls: 'w', text: () => tf('dyn.w.warn.multi', nm(x.f), x.f.units) });
      else lines.push({ cls: 'w', text: () => tf('dyn.w.warn.side', nm(x.f), dynWhName(x.w), S(x.f.side), S(x.w.side)) });
    }
    _PK_REPORT = { lines: lines, total: null };
    showToast(tn('dyn.w.rep.n', plan.N) + ' ✔', { type: 'ok' });
  } catch (err) {
    console.error('[HQ] Dynamic Spawn écrit:', err);
    const fe = err || {};
    _PK_REPORT = { lines: [
      { cls: 'w', text: () => tf('dyn.w.fail', pkErrText(fe)) },
      { cls: 'a', text: () => t('pk.rep.failTail') },
    ], total: null };
    showToast(t('toast.dsxFail'), { type: 'err' });
  } finally {
    _PK_BUSY = false;
    pkRender();
    delFocusReport();
  }
}

async function pkDeleteApply(name, ids) {
  if (_PK_BUSY || _mizLoading) return;
  const base = _HQ_MIZ_CONTEXT;
  if (!base || !HQ_SNAPSHOT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }
  _PK_BUSY = true;
  pkRender();
  try {
    showToast(t('toast.pkDeleting'), 120000);
    await pkYield();
    const gset = new Set(ids);
    const an = delAnalyze(base, ids);
    if (an.badWh) throw delErr('pk.del.wh.bad');
    // mission : édition ciblée, puis relecture
    const nameOf = g => { const f = HQ_SNAPSHOT.flights.find(x => x.groupId === g); return f ? (f.groupName || String(g)) : String(g); };
    const mp = delMissionPatches(base.ast, base.missionText, gset, nameOf);
    const missionText = applyPatches(base.missionText, mp.patches);
    let ast;
    try {
      retokenizeSafety(missionText);
      ast = DCS_PARSER.parse(DCS_TOKENIZER.tokenize(missionText).tokens);
    } catch (e) { console.warn('[HQ] relecture du texte écrit :', e); throw delErr('pk.del.e.reparse'); }
    if (JSON.stringify(delListIds(ast)) !== JSON.stringify(mp.expect)) throw delErr('pk.del.e.groups');
    // warehouses : les liens visés passent à 0 ; le reste du fichier est égal à l'octet
    let otherFilesMap = base.otherFilesMap;
    const wh = delWhPlan(base, gset);
    if (wh.patches.length) {
      const wtext = applyPatches(wh.text, wh.patches);
      const wbytes = new TextEncoder().encode(wh.text);
      const orig = base.otherFilesMap['warehouses'];
      if (wbytes.length !== orig.length || wbytes.some((b, i) => b !== orig[i])) throw delErr('pk.del.e.wh');
      let after;
      try { after = delWhLinks(delWhParse(wtext)); } catch (e) { throw delErr('pk.del.e.wh'); }
      const want = wh.all.map(l => [l.sec, l.id, l.type, gset.has(l.gid) ? 0 : l.gid]);
      if (JSON.stringify(after.map(l => [l.sec, l.id, l.type, l.gid])) !== JSON.stringify(want)) throw delErr('pk.del.e.wh');
      otherFilesMap = Object.assign({}, base.otherFilesMap);
      otherFilesMap['warehouses'] = new TextEncoder().encode(wtext);
    }
    const model = DCS_EXTRACTOR.extract(ast, missionText, _mizFilename || '', otherFilesMap, missionText.split('\n'));
    const work = { missionText: missionText, ast: ast, model: model, otherFilesMap: otherFilesMap, theatre: base.theatre };
    const keep = pkClientGroups(base).map(g => g.group.groupId).filter(g => !gset.has(g));
    if (JSON.stringify(pkClientGroups(work).map(g => g.group.groupId)) !== JSON.stringify(keep)) throw delErr('pk.del.e.clients');
    const dyn = dynBuild(ast, otherFilesMap, base.theatre);
    const blob = await rebuildMizHQ(missionText, otherFilesMap);
    const snap = await buildMissionSnapshot(ast, model, missionText, _mizFilename || 'mission.miz', base.theatre);
    // Rien n'a échoué : on remet le fichier, puis seulement on change d'état
    shareOrDownload(blob, name + '.miz', 'application/octet-stream', 'HQ', pkDownload);
    _HQ_MIZ_CONTEXT = work;
    _HQ_DYN = dyn;
    HQ_SNAPSHOT = snap;
    persistSnapshot();
    _PK_EXPORT_SEL.clear();
    renderSnapshot(HQ_SNAPSHOT);
    // Le compte rendu : les trois compteurs, une ligne par vol supprimé (avec ses liens remis à zéro), puis les références laissées
    const lines = [{ cls: 'ok', text: () => tn('pk.del.rep.flights', an.flights.length) + ' · ' + tn('pk.del.rep.links', an.M) + ' · ' + tn('pk.del.rep.refs', an.K) }];
    for (const f of an.flights) {
      lines.push({ cls: 'a', text: () => f.dyn.length ? tf('pk.del.rep.flightDyn', f.name, f.type, delDynText(f)) : tf('pk.del.rep.flight', f.name, f.type) });
    }
    for (const f of an.flights) {
      for (let i = 0; i < delRefLines(f).length; i++) {
        lines.push({ cls: 'w', text: () => '⚠ ' + tf('pk.join', f.name, delRefLines(f)[i]) });
      }
    }
    _PK_REPORT = { lines: lines, total: null };
    showToast(tn('pk.del.rep.flights', an.flights.length) + ' ✔', { type: 'ok' });
  } catch (err) {
    console.error('[HQ] suppression de groupes:', err);
    const fe = err || {};
    _PK_REPORT = { lines: [
      { cls: 'w', text: () => tf('pk.del.fail', pkErrText(fe)) },
      { cls: 'a', text: () => t('pk.rep.failTail') },
    ], total: null };
    showToast(t('toast.pkDelFail'), { type: 'err' });
  } finally {
    _PK_BUSY = false;
    pkRender();
    delFocusReport();
  }
}
