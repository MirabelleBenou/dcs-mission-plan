const KEY_WING_BEFORE = 'wing_config_before_example_v1';
const WING_ABSENT = '__absent__';

function flushWingPersist() {
  if (!_wingPersistTimer) return;
  clearTimeout(_wingPersistTimer);
  _wingPersistTimer = null;
  try { localStorage.setItem(KEY_WING, JSON.stringify(wingConfig)); } catch (e) {}
}

function wingConfigIsExample(raw) {
  return raw === JSON.stringify(EXAMPLE_WING_CONFIGS.fr) || raw === JSON.stringify(EXAMPLE_WING_CONFIGS.en);
}

function refreshRestoreButton() {
  const b = document.getElementById('wing-restore-btn');
  if (!b) return;
  let has = false;
  try { has = localStorage.getItem(KEY_WING_BEFORE) !== null; } catch (e) {}
  b.hidden = !has;
}

function loadWingExample() {
  flushWingPersist();                                           // ce qui attend d'être écrit passe d'abord
  const lang = CURRENT_LANG === 'en' ? 'en' : 'fr';             // la langue de l'interface au moment du clic
  const next = JSON.stringify(EXAMPLE_WING_CONFIGS[lang]);
  try {
    if (localStorage.getItem(KEY_WING_BEFORE) === null) {       // une sauvegarde déjà posée reste telle quelle
      const cur = localStorage.getItem(KEY_WING);
      if (cur === null) localStorage.setItem(KEY_WING_BEFORE, WING_ABSENT);             // profil neuf : rien n'était écrit
      else if (!wingConfigIsExample(cur)) localStorage.setItem(KEY_WING_BEFORE, cur);   // jamais la démo elle-même
    }
    localStorage.setItem(KEY_WING, next);                       // aussitôt : la suite la relit sur l'évènement storage
  } catch (e) {
    showToast(t('toast.wingStorageFull'), { type: 'err' });
    return;
  }
  wingConfig = structuredClone(EXAMPLE_WING_CONFIGS[lang]);
  renderWingEditor();
  refreshRestoreButton();
  const sec = document.getElementById('wing-restore-btn');
  if (sec && sec.closest('details')) sec.closest('details').open = true;
  showToastAction(t('toast.exampleLoaded') + ' ·', t('example.restore'), restoreWingConfig, 12000);
}

function restoreWingConfig() {
  clearTimeout(_wingPersistTimer);
  _wingPersistTimer = null;
  let saved = null;
  try { saved = localStorage.getItem(KEY_WING_BEFORE); } catch (e) {}
  if (saved === null) { refreshRestoreButton(); return; }
  try {
    if (saved === WING_ABSENT) localStorage.removeItem(KEY_WING);   // profil neuf : la clé disparaît, comme avant l'exemple
    else localStorage.setItem(KEY_WING, saved);                     // la chaîne d'avant, à l'octet
    localStorage.removeItem(KEY_WING_BEFORE);
  } catch (e) { return; }
  wingConfig = loadWingConfig();
  renderWingEditor();
  refreshRestoreButton();
  showToast(t('toast.configRestored'), { type: 'ok' });
}

async function resetWingConfig() {
  if (!await askConfirm({ title: t('editor.wing.resetConfirm.title'), text: t('editor.wing.resetConfirm.text'), verb: t('ui.verb.reset'), danger: true })) return;
  wingConfig = structuredClone(DEFAULT_WING_CONFIG);
  localStorage.removeItem(KEY_WING);
  renderWingEditor();
  showToast(t('toast.wingReset'), { type: 'ok' });
}

// ── Toolbar events ─────────────────────────────────────────────
function initToolbarEvents() {
  document.getElementById('theme-select').addEventListener('change', e => {
    applyTheme(e.target.value);
  });
  document.getElementById('btn-lang').addEventListener('click', () => {
    setLang(CURRENT_LANG === 'fr' ? 'en' : 'fr');
  });
  document.getElementById('btn-example').addEventListener('click', loadWingExample);
  const btnRestore = document.getElementById('wing-restore-btn');
  if (btnRestore) btnRestore.addEventListener('click', restoreWingConfig);
}


// =============================================================
//  P2 — DCS ENGINE (copié verbatim depuis Comm Plan Editor)
// =============================================================
const DCS_TOKENIZER = (() => {
  const T = { IDENT:'IDENT',LBRACE:'LBRACE',RBRACE:'RBRACE',LBRACKET:'LBRACKET',RBRACKET:'RBRACKET',EQ:'EQ',COMMA:'COMMA',SEMICOLON:'SEMICOLON',NUMBER:'NUMBER',STRING:'STRING',BOOL:'BOOL',NIL:'NIL',COMMENT:'COMMENT',EOF:'EOF' };
  function tokenize(src) {
    const tokens=[],errors=[];let offset=0,line=0,col=0;const len=src.length;
    function advance(){if(offset<len){if(src[offset]==='\n'){line++;col=0;}else{col++;}offset++;}}
    function skipWS(){while(offset<len&&' \t\r\n'.includes(src[offset]))advance();}
    function pos(){return{offset,line,col};}
    function readComment(s){let v='--';while(offset<len&&src[offset]!=='\n'){v+=src[offset];advance();}tokens.push({type:T.COMMENT,value:v,start:s,end:pos()});}
    function readNumber(s,f){let r=f;while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}if(offset<len&&src[offset]==='.'){r+='.';advance();while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}if(offset<len&&(src[offset]==='e'||src[offset]==='E')){r+=src[offset];advance();if(offset<len&&(src[offset]==='+'||src[offset]==='-')){r+=src[offset];advance();}while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}tokens.push({type:T.NUMBER,value:parseFloat(r),raw:r,start:s,end:pos()});}
    function readString(s,q){let v='';while(offset<len){const c=src[offset];if(c===q){advance();break;}if(c==='\\'){advance();const e=src[offset];if(e==='"')v+='"';else if(e==="'")v+="'";else if(e==='\\')v+='\\';else if(e==='n')v+='\n';else if(e==='t')v+='\t';else if(e==='r')v+='\r';else if(/[0-9]/.test(e)){let d=e;while(d.length<3&&offset+1<len&&/[0-9]/.test(src[offset+1])){advance();d+=src[offset];}v+=String.fromCharCode(parseInt(d,10));}else v+=e;advance();}else{v+=c;advance();}}tokens.push({type:T.STRING,value:v,start:s,end:pos()});}
    function readIdent(s,f){let r=f;while(offset<len&&/[a-zA-Z0-9_]/.test(src[offset])){r+=src[offset];advance();}if(r==='true')tokens.push({type:T.BOOL,value:true,raw:r,start:s,end:pos()});else if(r==='false')tokens.push({type:T.BOOL,value:false,raw:r,start:s,end:pos()});else if(r==='nil')tokens.push({type:T.NIL,value:null,raw:r,start:s,end:pos()});else tokens.push({type:T.IDENT,value:r,start:s,end:pos()});}
    while(offset<len){skipWS();if(offset>=len)break;const s=pos(),ch=src[offset];if(ch==='-'&&offset+1<len&&src[offset+1]==='-'){advance();advance();readComment(s);continue;}if(/[0-9]/.test(ch)){advance();readNumber(s,ch);continue;}if(ch==='-'&&offset+1<len&&/[0-9]/.test(src[offset+1])){advance();readNumber(s,'-');continue;}if(ch==='"'||ch==="'"){advance();readString(s,ch);continue;}if(/[a-zA-Z_]/.test(ch)){advance();readIdent(s,ch);continue;}switch(ch){case'{':advance();tokens.push({type:T.LBRACE,value:'{',start:s,end:pos()});break;case'}':advance();tokens.push({type:T.RBRACE,value:'}',start:s,end:pos()});break;case'[':advance();tokens.push({type:T.LBRACKET,value:'[',start:s,end:pos()});break;case']':advance();tokens.push({type:T.RBRACKET,value:']',start:s,end:pos()});break;case'=':advance();tokens.push({type:T.EQ,value:'=',start:s,end:pos()});break;case',':advance();tokens.push({type:T.COMMA,value:',',start:s,end:pos()});break;case';':advance();tokens.push({type:T.SEMICOLON,value:';',start:s,end:pos()});break;default:errors.push({message:'Token inattendu: '+JSON.stringify(ch),line:s.line,col:s.col,offset:s.offset});advance();tokens.push({type:'ERROR',value:ch,start:s,end:pos()});}}
    tokens.push({type:T.EOF,value:null,start:pos(),end:pos()});
    return{tokens,errors};
  }
  return{tokenize,T};
})();

// ═══════════════════════════════════════════════════════════════
// DCS_PARSER — Étape C : AST avec positions sources
//
// Chaque nœud porte pos = { start:{line,col,offset}, end:{line,col,offset} }
// (tous 0-based, end exclusif).
//
// Feuilles (number, string, bool, nil, ident) :
//   pos encadre la valeur brute — GUILLEMETS INCLUS pour les strings.
//   → lua.substring(pos.start.offset, pos.end.offset) redonne la valeur brute.
//
// Tables :
//   pos.start → '{', pos.end → après '}'.
//
// Paires (entries) :
//   entry.keyPos   → de '[' jusqu'après ']' (ou identifiant nu)
//   entry.valuePos → délégué à node.pos de la valeur
//
// Assignation racine :
//   pos couvre depuis 'mission' jusqu'après '}'.
// ═══════════════════════════════════════════════════════════════
const DCS_PARSER = (() => {

  class ParseError extends Error {
    constructor(msg, token) {
      super(msg);
      this.tokenLine   = token ? token.start.line + 1 : '?';
      this.tokenCol    = token ? token.start.col      : '?';
      this.tokenOffset = token ? token.start.offset   : '?';
    }
    toString() { return `ParseError L${this.tokenLine}:${this.tokenCol} — ${this.message}`; }
  }

  function parse(tokens) {
    const tks = tokens.filter(t => t.type !== 'COMMENT');
    let p = 0;

    function peek()    { return tks[p]; }
    function consume() { return tks[p++]; }

    function expect(type) {
      const tk = peek();
      if (!tk || tk.type !== type)
        throw new ParseError(
          `Attendu ${type}, obtenu ${tk ? tk.type + '(' + JSON.stringify(tk.value) + ')' : 'EOF'}`,
          tk
        );
      return consume();
    }

    function skipSep() {
      while (peek() && (peek().type === 'COMMA' || peek().type === 'SEMICOLON')) consume();
    }

    // Construire un objet pos à partir de deux tokens de borne
    function makePos(startTk, endTk) {
      return {
        start: { line: startTk.start.line, col: startTk.start.col, offset: startTk.start.offset },
        end:   { line: endTk.end.line,     col: endTk.end.col,     offset: endTk.end.offset     }
      };
    }

    function parseValue() {
      const tk = peek();
      if (!tk || tk.type === 'EOF') throw new ParseError('Valeur attendue, EOF atteint', tk);

      if (tk.type === 'NUMBER') { consume(); return { kind:'number', value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'STRING') { consume(); return { kind:'string', value:tk.value,                pos:makePos(tk,tk) }; }
      if (tk.type === 'BOOL')   { consume(); return { kind:'bool',   value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'NIL')    { consume(); return { kind:'nil',                                   pos:makePos(tk,tk) }; }
      if (tk.type === 'LBRACE') { return parseTable(); }
      if (tk.type === 'IDENT')  { consume(); return { kind:'ident',  value:tk.value,               pos:makePos(tk,tk) }; }

      throw new ParseError(`Token inattendu comme valeur: ${tk.type}(${JSON.stringify(tk.value)})`, tk);
    }

    function parseTable() {
      const lbrace = expect('LBRACE');
      const entries = [];
      while (true) {
        skipSep();
        const tk = peek();
        if (!tk || tk.type === 'RBRACE' || tk.type === 'EOF') break;
        entries.push(parseEntry());
        skipSep();
      }
      const rbrace = expect('RBRACE');
      return { kind:'table', entries, pos: makePos(lbrace, rbrace) };
    }

    function parseEntry() {
      const tk = peek();

      // [N] = v  ou  ["clé"] = v
      if (tk.type === 'LBRACKET') {
        const lbrack = consume();
        const kt = peek();
        let key;
        if      (kt.type === 'NUMBER') { consume(); key = { kind:'int',    value:kt.value }; }
        else if (kt.type === 'STRING') { consume(); key = { kind:'string', value:kt.value }; }
        else throw new ParseError(`Clé invalide dans []: attendu NUMBER ou STRING, obtenu ${kt.type}`, kt);
        const rbrack = expect('RBRACKET');
        const keyPos = makePos(lbrack, rbrack);
        expect('EQ');
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // ident = v  (racine ou clé nue rare)
      if (tk.type === 'IDENT' && tks[p + 1] && tks[p + 1].type === 'EQ') {
        const it = consume();
        const key    = { kind:'ident', value:it.value };
        const keyPos = makePos(it, it);
        consume(); // EQ
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // Valeur sans clé (liste ordonnée)
      const value = parseValue();
      return { key:null, keyPos:null, value, valuePos: value.pos };
    }

    // Point d'entrée : "mission = { … }"
    const first = peek();
    let root;
    if (first.type === 'IDENT') {
      const nt = consume();
      expect('EQ');
      const value = parseValue();
      root = {
        kind: 'assignment', name: nt.value, value,
        pos:  { start: { line:nt.start.line, col:nt.start.col, offset:nt.start.offset },
                end:   value.pos.end }
      };
    } else if (first.type === 'LBRACE') {
      root = parseValue();
    } else {
      throw new ParseError(`Structure racine inattendue: ${first.type}`, first);
    }

    const eof = peek();
    if (eof.type !== 'EOF')
      throw new ParseError(`Contenu inattendu après table racine: ${eof.type}`, eof);

    return root;
  }

  return { parse, ParseError };
})();

const DCS_EXTRACTOR = (() => {

  // ── Utilitaires AST ──────────────────────────────────────────────────────
  function scalarVal(node) {
    if (!node) return undefined;
    if (node.kind==='number'||node.kind==='string'||node.kind==='bool'||node.kind==='ident') return node.value;
    if (node.kind==='nil') return null;
  }

  function get(tableNode, key) {
    if (!tableNode || tableNode.kind !== 'table') return undefined;
    for (const e of tableNode.entries) {
      if (!e.key) continue;
      if (typeof key === 'string' && (e.key.kind==='ident'||e.key.kind==='string') && e.key.value===key) return e.value;
      if (typeof key === 'number' && e.key.kind==='int' && e.key.value===key) return e.value;
    }
  }

  function posStr(pos) {
    if (!pos) return 'null';
    return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
  }

  // Normaliser une signature pour comparaison : tableau trié de {radioIndex,channelNumber}
  function sigKey(syncPositions) {
    return JSON.stringify(
      syncPositions
        .map(s => ({ r: s.radioIndex, c: s.channelNumber }))
        .sort((a,b) => a.r !== b.r ? a.r - b.r : a.c - b.c)
    );
  }

  // ── Extraction Radio[N] ──────────────────────────────────────────────────
  function extractRadio(radioIndexEntry) {
    const idx   = radioIndexEntry.key ? radioIndexEntry.key.value : null;
    const rNode = radioIndexEntry.value;
    if (!rNode || rNode.kind !== 'table') return null;

    const chansNode = get(rNode, 'channels');
    const modsNode  = get(rNode, 'modulations');
    const namesNode = get(rNode, 'channelsNames');

    const channels = {};
    if (chansNode && chansNode.kind==='table' && chansNode.entries.length > 0) {
      for (const ce of chansNode.entries) {
        if (!ce.key || ce.key.kind !== 'int') continue;
        const num = ce.key.value;
        channels[num] = { number: num, frequency: ce.value.value, frequencyPos: ce.value.pos };
      }
    }

    let modulations = null;
    if (modsNode && modsNode.kind==='table' && modsNode.entries.length > 0) {
      modulations = {};
      for (const me of modsNode.entries) {
        if (!me.key || me.key.kind !== 'int') continue;
        modulations[me.key.value] = { value: me.value.value, pos: me.value.pos };
      }
    }

    let channelsNames = null;
    if (namesNode && namesNode.kind==='table' && namesNode.entries.length > 0) {
      channelsNames = {};
      for (const ne of namesNode.entries) {
        if (!ne.key || ne.key.kind !== 'int') continue;
        channelsNames[ne.key.value] = { value: ne.value.value, pos: ne.value.pos };
      }
    }

    return {
      index: idx,
      channels,
      channelsNames,
      modulations,
      blockPos:             rNode.pos,
      channelsBlockPos:     chansNode ? chansNode.pos : null,
      channelsNamesBlockPos:namesNode ? namesNode.pos : null,
      modulationsBlockPos:  modsNode  ? modsNode.pos  : null,
    };
  }

  // ── Calcul des positions de synchronisation pour un slot ─────────────────
  // Retourne [{ radioIndex, channelNumber, frequency, modulation, frequencyPos, modulationPos }]
  function computeSyncPositions(radios, groupFrequency) {
    if (!radios || groupFrequency === null || groupFrequency === undefined) return [];
    const gfreq = groupFrequency;
    const result = [];
    for (const radio of radios) {
      for (const [numStr, ch] of Object.entries(radio.channels)) {
        if (Math.abs(ch.frequency - gfreq) < 1e-9) {
          const chnum = Number(numStr);
          const modEntry = radio.modulations ? radio.modulations[chnum] : null;
          result.push({
            radioIndex:     radio.index,
            channelNumber:  chnum,
            frequency:      ch.frequency,
            frequencyPos:   ch.frequencyPos,
            modulation:     modEntry ? modEntry.value : null,
            modulationPos:  modEntry ? modEntry.pos   : null,
          });
        }
      }
    }
    // Tri canonique : par (radioIndex ASC, channelNumber ASC)
    result.sort((a,b) => a.radioIndex !== b.radioIndex ? a.radioIndex - b.radioIndex : a.channelNumber - b.channelNumber);
    return result;
  }

  // ── Extraction unité ─────────────────────────────────────────────────────
  function extractUnit(unitNode) {
    const radioTableNode = get(unitNode, 'Radio');
    let radios       = null;
    let radioBlockPos= null;

    if (radioTableNode && radioTableNode.kind==='table') {
      radioBlockPos = radioTableNode.pos;
      radios = [];
      for (const re of radioTableNode.entries) {
        const r = extractRadio(re);
        if (r) radios.push(r);
      }
      radios.sort((a,b) => a.index - b.index);
    }

    const callsignNode = get(unitNode, 'callsign');
    let callsign = null;
    if (callsignNode) {
      if (callsignNode.kind === 'table') {
        callsign = {};
        for (const ce of callsignNode.entries) {
          if (!ce.key) continue;
          callsign[ce.key.value] = scalarVal(ce.value);
        }
      } else { callsign = scalarVal(callsignNode); }
    }

    const liveryNode = get(unitNode, 'livery_id');
    return {
      unitId:       scalarVal(get(unitNode,'unitId')),
      name:         scalarVal(get(unitNode,'name')),
      type:         scalarVal(get(unitNode,'type')),
      skill:        scalarVal(get(unitNode,'skill')),
      callsign,
      livery_id:    liveryNode ? liveryNode.value : undefined,
      liveryPos:    liveryNode ? liveryNode.pos   : null,   // P3 — patch livrée
      payloadPos:   (() => { const pn = get(unitNode, 'payload'); return pn ? pn.pos : null; })(),  // P4 — patch payload
      radios,
      radioBlockPos,
      syncPositions: null, // calculé en second passage
    };
  }

  // ── Extraction groupe ─────────────────────────────────────────────────────
  
function extractGroup(groupNode, coalition, category) {
  const g = extractGroup_ORIG(groupNode, coalition, category);
  if (!g) return g;
  // P4.2 — pointsPos : position du nœud route.points pour patch de remplacement.
  // extractGroup_ORIG renvoie { group, clientUnits } : la position se pose sur le groupe (repli sur l'objet renvoyé).
  const routeNode = get(groupNode, 'route');
  const pointsNode = routeNode ? get(routeNode, 'points') : null;
  (g.group || g).pointsPos = pointsNode ? pointsNode.pos : null;
  return g;
}

function extractGroup_ORIG(groupNode, coalitionKey, category) {
    const freqNode = get(groupNode,'frequency');
    const modNode  = get(groupNode,'modulation');
    const frequency = freqNode ? {
      value:         freqNode.value,
      modulation:    modNode ? modNode.value : null,
      valuePos:      freqNode.pos,
      modulationPos: modNode ? modNode.pos : null,
    } : null;

    const group = {
      groupId:                 scalarVal(get(groupNode,'groupId')),
      name:                    scalarVal(get(groupNode,'name')),
      task:                    scalarVal(get(groupNode,'task')),
      coalition:               coalitionKey,
      category,
      frequency,
      hasFrequencyAtGroupLevel: !!freqNode,
      groupBlockPos:           groupNode.pos,
    };

    const unitsNode = get(groupNode,'units');
    const clientUnits = [];
    if (unitsNode && unitsNode.kind==='table') {
      for (const ue of unitsNode.entries) {
        const skillNode = get(ue.value,'skill');
        if (skillNode && (skillNode.value==='Client' || skillNode.value==='Player')) clientUnits.push(extractUnit(ue.value));
      }
    }
    return { group, clientUnits };
  }

  // ── Second passage : calcul syncPositions + typeConventions ──────────────
  function computeSyncAndConventions(clientGroups) {
    // 1. Calcul syncPositions par slot
    for (const slot of clientGroups) {
      const gfreq = slot.group.frequency ? slot.group.frequency.value : null;
      slot.unit.syncPositions = slot.unit.radios
        ? computeSyncPositions(slot.unit.radios, gfreq)
        : null;
    }

    // 2. typeConventions : regrouper les slots avec Radio par type
    //    Slots sans Radio exclus du calcul
    const typeMap = {}; // type → [ sigKey, ... ]
    for (const slot of clientGroups) {
      if (!slot.unit.radios) continue; // sans Radio : exclure
      const tp = slot.unit.type;
      const sk = sigKey(slot.unit.syncPositions || []);
      if (!typeMap[tp]) typeMap[tp] = [];
      typeMap[tp].push({ sk, sig: slot.unit.syncPositions || [] });
    }

    const typeConventions = {};
    for (const [tp, entries] of Object.entries(typeMap)) {
      const keys = entries.map(e => e.sk);
      const distinct = [...new Set(keys)];
      const isUniform = distinct.length === 1;

      if (isUniform) {
        // Signature canonique : la liste de {radioIndex,channelNumber} du premier slot
        const canonical = entries[0].sig.map(s => ({
          radioIndex:    s.radioIndex,
          channelNumber: s.channelNumber,
        }));
        typeConventions[tp] = {
          syncSignature: canonical,
          isUniform: true,
          slotCount: entries.length,
        };
      } else {
        // Non uniforme : lister les variants
        const variantMap = {};
        for (const e of entries) {
          if (!variantMap[e.sk]) {
            variantMap[e.sk] = {
              count: 0,
              signature: e.sig.map(s => ({ radioIndex:s.radioIndex, channelNumber:s.channelNumber })),
            };
          }
          variantMap[e.sk].count++;
        }
        typeConventions[tp] = {
          syncSignature: null,
          isUniform: false,
          slotCount: entries.length,
          variants: Object.values(variantMap),
        };
      }
    }

    return typeConventions;
  }

  // ── Diagnostics ───────────────────────────────────────────────────────────
  function buildDiagnostics(clientGroups) {
    const diagnostics = [];

    for (const slot of clientGroups) {
      const { group, unit } = slot;

      // GROUP_FREQ_MISSING
      if (!group.hasFrequencyAtGroupLevel) {
        diagnostics.push({
          severity: 'warning',
          code:     'GROUP_FREQ_MISSING',
          message:  `Groupe "${group.name}" (groupId ${group.groupId}) — pas de ["frequency"] au niveau groupe.`,
        });
        continue;
      }

      // RADIO_BLOCK_MISSING
      if (!unit.radios) {
        diagnostics.push({
          severity: 'info',
          code:     'RADIO_BLOCK_MISSING',
          message:  `Unité "${unit.name}" (${unit.type}, groupId ${group.groupId}) — pas de bloc ["Radio"].`,
        });
        continue;
      }

      // EMPTY_RADIO_CHANNELS
      for (const r of unit.radios) {
        if (Object.keys(r.channels).length === 0) {
          diagnostics.push({
            severity: 'info',
            code:     'EMPTY_RADIO_CHANNELS',
            message:  `Unité "${unit.name}" (${unit.type}) — Radio[${r.index}].channels vide.`,
          });
        }
      }

      const sync  = unit.syncPositions || [];
      const gfreq = group.frequency.value;
      const modVal = group.frequency.modulation;
      const modStr = modVal === 0 ? 'AM' : modVal === 1 ? 'FM' : String(modVal);

      if (sync.length > 0) {
        // GROUP_FREQ_SYNC_DETECTED
        const lines = [
          `Groupe "${group.name}" (groupId ${group.groupId}), unité "${unit.name}" (${unit.type}) :`,
          `  group.frequency  @ ${posStr(group.frequency.valuePos)} = ${gfreq}`,
          `  group.modulation @ ${posStr(group.frequency.modulationPos)} = ${modVal} (${modStr})`,
        ];
        for (const sp of sync) {
          lines.push(`  ↔ Radio[${sp.radioIndex}].channels[${sp.channelNumber}] @ ${posStr(sp.frequencyPos)} = ${sp.frequency}`);
        }
        lines.push(`  (${sync.length} canal${sync.length > 1 ? 'x' : ''} synchronisé${sync.length > 1 ? 's' : ''})`);
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_SYNC_DETECTED',
          message:  lines.join('\n'),
        });
      } else {
        // GROUP_FREQ_NOT_IN_CHANNELS
        const radioSummary = unit.radios
          .map(r => `Radio[${r.index}] (${Object.keys(r.channels).length} canaux)`)
          .join(', ');
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_NOT_IN_CHANNELS',
          message:  [
            `Groupe "${group.name}", unité "${unit.name}" (${unit.type}) :`,
            `  group.frequency = ${gfreq} (n'est présente dans aucun canal radio)`,
            `  ${radioSummary} — aucun match`,
          ].join('\n'),
        });
      }
    }

    return diagnostics;
  }

  // ── Point d'entrée principal ──────────────────────────────────────────────
  function extract(ast, src, mizFilename, otherFilesMap, precomputedLines) {
    const missionTable = ast.kind==='assignment' ? ast.value : ast;
    const lines        = precomputedLines || src.split('\n');
    const clientGroups = [];

    const coalNode = get(missionTable,'coalition');
    if (coalNode) {
      for (const coalKey of ['blue','red','neutrals']) {
        const coalSide   = get(coalNode, coalKey);     if (!coalSide)   continue;
        const countryTbl = get(coalSide, 'country');   if (!countryTbl || countryTbl.kind!=='table') continue;

        for (const ce of countryTbl.entries) {
          for (const category of ['helicopter','plane']) {
            const catNode   = get(ce.value, category); if (!catNode)   continue;
            const groupList = get(catNode,  'group');  if (!groupList || groupList.kind!=='table') continue;

            for (const ge of groupList.entries) {
              const { group, clientUnits } = extractGroup(ge.value, coalKey, category);
              for (const unit of clientUnits) {
                clientGroups.push({ coalition: coalKey, category, group, unit });
              }
            }
          }
        }
      }
    }

    // Second passage : sync positions + type conventions
    const typeConventions = computeSyncAndConventions(clientGroups);

    // Diagnostics
    const diagnostics = buildDiagnostics(clientGroups);

    // otherFiles : map filename → { size, data:Uint8Array }
    // Les données brutes sont dans otherFilesMap (passé depuis le harness)
    const otherFilesSummary = otherFilesMap
      ? Object.fromEntries(
          Object.entries(otherFilesMap).map(([name, data]) => [name, { size: data.length }])
        )
      : null;

    return {
      source: {
        _text:  src,    // usage interne — non sérialisé
        _lines: lines,
        summary: { textLength: src.length, lineCount: lines.length },
        miz: {
          filename:   mizFilename,
          otherFiles: otherFilesSummary, // { filename: { size } }
          _otherFilesData: otherFilesMap, // Uint8Arrays bruts pour v1.0.0
        },
      },
      clientGroups,
      typeConventions,
      diagnostics,
    };
  }

  // ── Sérialisation display (omit champs _, tronquer pos) ──────────────────
  function serialize(model, limit) {
    const slots = limit != null ? model.clientGroups.slice(0, limit) : model.clientGroups;
    function shortenPos(pos) {
      if (!pos) return null;
      return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
    }
    function process(obj, depth) {
      if (depth > 12 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return shortenPos(obj);
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) {
        if (k.startsWith('_')) continue;
        out[k] = process(v, depth+1);
      }
      return out;
    }
    return JSON.stringify(slots.map(s => process(s, 0)), null, 2);
  }

  function serializeTypeConventions(model) {
    function process(obj, depth) {
      if (depth > 6 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return `L${obj.start.line+1}:${obj.start.col}@${obj.start.offset}`;
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) { if (!k.startsWith('_')) out[k] = process(v, depth+1); }
      return out;
    }
    return JSON.stringify(process(model.typeConventions, 0), null, 2);
  }

  return { extract, serialize, serializeTypeConventions, posStr };
})();

// =============================================================
//  P2.2 — FINGERPRINT (sha256 avec repli cyrb53)
// =============================================================
async function computeFingerprint(text) {
  const enc = new TextEncoder();
  const data = enc.encode(text);
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', data);
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
      return 'sha256:' + hex;
    } catch(e) { /* repli cyrb53 */ }
  }
  // Repli cyrb53 — déterministe, non-crypto, préfixe distinct
  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  return 'cyrb53:' + cyrb53(text).toString(16);
}

const DCS_CLOUD_PRESETS = {
  'Preset1':  'FEW070',   'Preset2':  'FEW080',   'Preset3':  'SCT080',
  'Preset4':  'SCT100',   'Preset5':  'SCT120',   'Preset6':  'SCT140',

// =============================================================
//  P2.3 — CONVERSION MÉTÉO → METAR
// =============================================================
function mizWeatherToMetar(wx, dateObj, startTime, theatre) {
  const month  = String(dateObj.Month  || 1).padStart(2,'0');
  const day    = String(dateObj.Day    || 1).padStart(2,'0');
  const hh     = String(Math.floor((startTime || 0) / 3600)).padStart(2,'0');
  const mm     = String(Math.floor(((startTime || 0) % 3600) / 60)).padStart(2,'0');
  const dtg    = day + hh + mm + 'Z';
  const icao   = (theatre === 'Syria' ? 'OS' : 'ZZZZ') + 'XX';  // placeholder
  // Vent — DCS stocke la direction "vers où ça souffle", METAR veut "venant de"
  const windSpeed  = wx.wind && wx.wind.atGround ? (wx.wind.atGround.speed || 0) : 0;
  const windDirDCS = wx.wind && wx.wind.atGround ? (wx.wind.atGround.dir   || 0) : 0;
  const windDir    = Math.round(((windDirDCS + 180) % 360) / 10) * 10;
  const windKt     = Math.round(windSpeed * 1.944);
  let windPart;
  if (windKt < 1) {
    windPart = '00000KT';
  } else {
    windPart = String(windDir).padStart(3,'0') + String(windKt).padStart(2,'0') + 'KT';
  }
  // Visibilité
  const vis = wx.visibility ? (wx.visibility.distance || 9999) : 9999;
  const cavok = vis >= 9999 && !(wx.enable_fog) && !(wx.clouds && wx.clouds.preset);
  let visPart = cavok ? 'CAVOK' : (vis >= 9999 ? '9999' : String(Math.round(vis / 100) * 100).padStart(4,'0'));
  // Nuages
  let cloudPart = '';
  if (!cavok) {
    const preset = wx.clouds && wx.clouds.preset;
    if (preset && DCS_CLOUD_PRESETS[preset]) {
      cloudPart = DCS_CLOUD_PRESETS[preset];
    } else if (wx.clouds && wx.clouds.density > 0) {
      const baseFt = Math.round((wx.clouds.base || 0) / 0.3048 / 100) * 100;
      const baseStr = String(Math.round(baseFt / 100)).padStart(3,'0');
      const cover = wx.clouds.density >= 8 ? 'OVC' : wx.clouds.density >= 5 ? 'BKN' : wx.clouds.density >= 3 ? 'SCT' : 'FEW';
      cloudPart = cover + baseStr;
    } else {
      cloudPart = 'NSC';
    }
  }
  // Fog
  let fogPart = '';
  if (wx.enable_fog && wx.fog && wx.fog.visibility > 0) {
    fogPart = wx.fog.visibility < 1000 ? 'FG' : 'BR';
    visPart = String(wx.fog.visibility).padStart(4,'0');
  }
  // Dust
  let dustPart = '';
  if (wx.enable_dust && wx.dust_density > 0) {
    dustPart = wx.dust_density > 2000 ? 'SS' : 'DU';
  }
  // Temp
  const temp = Math.round(wx.season && wx.season.temperature !== undefined ? wx.season.temperature : 15);
  const tempStr = (temp < 0 ? 'M' + String(-temp).padStart(2,'0') : String(temp).padStart(2,'0')) + '/XX';
  // QNH
  const qnh = Math.round((wx.qnh || 760) * 1.333);
  const qnhStr = 'Q' + String(qnh).padStart(4,'0');
  // Assemblage
  const parts = [icao, dtg, windPart];
  if (!cavok) {
    parts.push(visPart);
    if (fogPart) parts.push(fogPart);
    if (dustPart) parts.push(dustPart);
    if (cloudPart) parts.push(cloudPart);
  } else {
    parts.push('CAVOK');
  }
  parts.push(tempStr, qnhStr);
  return parts.join(' ');
}

function dynNum(n) { return (n && n.kind === 'number') ? n.value : null; }
function dynStr(n) { return (n && n.kind === 'string') ? n.value : null; }
function dynCmp(a, b) {
  const x = pkNorm(a), y = pkNorm(b);
  return x < y ? -1 : x > y ? 1 : (a < b ? -1 : a > b ? 1 : 0);
}

function dynBuild(ast, otherFilesMap, theatre) {
  const dyn = { warn: null, templates: [], whs: [] };
  const groups = {};     // groupId -> { template, name }   (groupes de toutes les catégories : un lien vers un groupe sol, statique ou navire est « pas un template »)
  const unitNames = {};  // unitId -> nom de l'unité (toutes catégories : FARP, navires…)
  // 1. les templates (`mission`) : leur propre try, pour que les marques survivent à une erreur de lecture des entrepôts
  try {
    const mt = ast.kind === 'assignment' ? ast.value : ast;
    const coal = _astGetKey(mt, 'coalition');
    for (const ck of ['blue', 'red', 'neutrals']) {
      const side = coal ? _astGetKey(coal, ck) : null;
      const countries = side ? _astGetKey(side, 'country') : null;
      if (!countries || countries.kind !== 'table') continue;
      for (const ce of countries.entries) {
        for (const cat of ['helicopter', 'plane', 'vehicle', 'static', 'ship']) {
          const catNode = _astGetKey(ce.value, cat);
          const gl = catNode ? _astGetKey(catNode, 'group') : null;
          if (!gl || gl.kind !== 'table') continue;
          for (const ge of gl.entries) {
            const g = ge.value;
            const us = _astGetKey(g, 'units');
            const ul = (us && us.kind === 'table') ? us.entries : [];
            for (const ue of ul) {
              const uid = dynNum(_astGetKey(ue.value, 'unitId')), un = dynStr(_astGetKey(ue.value, 'name'));
              if (uid !== null && un !== null) unitNames[uid] = un;
            }
            const gid = dynNum(_astGetKey(g, 'groupId'));
            if (gid === null) continue;
            const flight = cat === 'plane' || cat === 'helicopter';
            const tmN = flight ? _astGetKey(g, 'dynSpawnTemplate') : null;
            const isT = !!tmN && tmN.value === true;
            const gname = dynStr(_astGetKey(g, 'name')) || '';
            groups[gid] = { template: isT, name: gname };
            if (isT) dyn.templates.push({
              groupId: gid, name: gname, coalition: ck, category: cat,
              type: ul.length ? (dynStr(_astGetKey(ul[0].value, 'type')) || '') : '',
            });
          }
        }
      }
    }
  } catch (e) {
    console.warn('[HQ] Dynamic Spawn : mission illisible:', e);
    dyn.warn = 'unreadable'; dyn.templates = [];
    return dyn;
  }
  // 2. les entrepôts (`warehouses`) : une erreur ici ne vide que les entrepôts et pose l'avertissement
  try {
    const wf = otherFilesMap ? otherFilesMap['warehouses'] : null;
    if (!wf) { dyn.warn = 'absent'; return dyn; }
    let wroot;
    try {
      const tk = DCS_TOKENIZER.tokenize(new TextDecoder('utf-8').decode(wf));
      if (tk.errors && tk.errors.length) throw new Error('warehouses');
      const wa = DCS_PARSER.parse(tk.tokens);
      wroot = wa.kind === 'assignment' ? wa.value : wa;
      if (!wroot || wroot.kind !== 'table') throw new Error('warehouses');
    } catch (e) { dyn.warn = 'unreadable'; return dyn; }
    const afNames = DYN_AIRDROMES[String(theatre || '').trim()] || {};
    for (const sec of ['airports', 'warehouses']) {
      const sn = _astGetKey(wroot, sec);
      if (!sn || sn.kind !== 'table') continue;
      for (const we of sn.entries) {
        const w = we.value;
        if (!we.key || !w || w.kind !== 'table') continue;
        const id = we.key.value;
        const dsN = _astGetKey(w, 'dynamicSpawn');
        const links = [];
        const ac = _astGetKey(w, 'aircrafts');
        for (const cat of ['planes', 'helicopters']) {
          const cn = ac ? _astGetKey(ac, cat) : null;
          if (!cn || cn.kind !== 'table') continue;
          for (const te of cn.entries) {
            if (!te.key) continue;
            const l = dynNum(_astGetKey(te.value, 'linkDynTempl'));
            if (l) links.push({ type: String(te.key.value), groupId: l, gname: groups[l] ? groups[l].name : '', status: groups[l] ? (groups[l].template ? 'ok' : 'notTemplate') : 'absent' });
          }
        }
        const dynSp = !!dsN && dsN.value === true;
        if (!dynSp && !links.length) continue;
        links.sort((a, b) => dynCmp(a.type, b.type));
        const c = String(dynStr(_astGetKey(w, 'coalition')) || '').toLowerCase();
        const hn = _astGetKey(w, 'allowHotStart');
        const airport = sec === 'airports';
        dyn.whs.push({
          kind: airport ? 'airport' : 'unit', id: id,
          name: airport ? (afNames[String(id)] || null) : (unitNames[id] || null),
          side: c === 'neutral' ? 'neutrals' : c,
          hot: !!hn && hn.value === true,
          links: links,
        });
      }
    }
  } catch (e) {
    console.warn('[HQ] Dynamic Spawn : warehouses illisible:', e);
    dyn.warn = 'unreadable'; dyn.whs = [];
  }
  return dyn;
}

// Les marques « Template » : tant que les templates sont lus, sauf sans fichier warehouses (rien n'est alors affiché)
function dynMarks() {
  return !!(_HQ_DYN && _HQ_MIZ_CONTEXT && _HQ_DYN.templates.length && (!_HQ_DYN.warn || _HQ_DYN.warn === 'unreadable'));
}
function dynActive() {
  return !!(_HQ_DYN && _HQ_MIZ_CONTEXT && !_HQ_DYN.warn && (_HQ_DYN.templates.length || _HQ_DYN.whs.length));
}
function dynWhName(w) { return w.name || tf(w.kind === 'airport' ? 'dyn.airfield' : 'dyn.warehouse', String(w.id)); }
function dynTemplateIds() {
  const m = {};
  for (const tp of _HQ_DYN.templates) m[tp.groupId] = tp;
  return m;
}
// Les aérodromes, FARP et navires dont un lien vise ce template, par ordre alphabétique
function dynWhere(gid) {
  const names = [];
  for (const w of _HQ_DYN.whs) if (w.links.some(l => l.groupId === gid)) names.push(dynWhName(w));
  return names.sort(dynCmp);
}
function dynWhereHtml(gid) {
  const names = dynWhere(gid);
  return '<div class="snap-meta dyn-where">' + escapeHtml(names.length ? tf('dyn.servedBy', names.join(' · ')) : t('dyn.noLink')) + '</div>';
}

// Le panneau (sous la météo) ; à défaut, l'avertissement discret quand `warehouses` manque ou ne se lit pas
function dynPanelHtml() {
  if (!_HQ_DYN || !_HQ_MIZ_CONTEXT) return '';
  const h = escapeHtml;
  if (_HQ_DYN.warn) return _HQ_DYN.templates.length ? '<div class="ui-avert" id="dyn-warn">' + h(t('dyn.warn.' + _HQ_DYN.warn)) + '</div>' : '';
  if (!dynActive()) return '';
  // Les aérodromes d'abord, puis les FARP et navires, chacun par ordre alphabétique
  const linked = _HQ_DYN.whs.filter(w => w.links.length).map(w => ({ w: w, name: dynWhName(w) }))
    .sort((a, b) => ((a.w.kind === 'airport' ? 0 : 1) - (b.w.kind === 'airport' ? 0 : 1)) || dynCmp(a.name, b.name));
  const free = _HQ_DYN.whs.filter(w => !w.links.length).map(dynWhName).sort(dynCmp);
  let html = '<details class="dyn-panel" id="dyn-panel"' + (_DYN_OPEN ? ' open' : '') + '><summary class="snap-header ui-fold-head" aria-expanded="' + _DYN_OPEN + '">' + h(t('dyn.title')) + '</summary>';
  for (const r of linked) {
    html += '<div class="dyn-row" data-dyn-wh="' + h(String(r.w.id)) + '"><div class="snap-flight-header"><span class="dyn-name">' + h(r.name) + '</span>';
    html += ' <span class="snap-flight-tag">' + h(t('pk.flt.' + r.w.side, r.w.side)) + '</span>';
    if (r.w.hot) html += ' <span class="snap-meta">· ' + h(t('dyn.hot')) + '</span>';
    html += '</div><div class="dyn-links">';
    const parts = [];
    for (const l of r.w.links) {
      let txt = h(l.type + ' → ' + (l.status === 'absent' ? String(l.groupId) : l.gname));
      if (l.status !== 'ok') txt += ' <span class="ui-avert">⚠ ' + h(t(l.status === 'absent' ? 'dyn.groupGone' : 'dyn.notTemplate')) + '</span>';
      parts.push('<span class="dyn-link">' + txt + '</span>');
    }
    html += parts.join(' · ');
    html += '</div></div>';
  }
  if (free.length) html += '<div class="snap-meta" id="dyn-free">' + h(tf('dyn.unlinked', free.join(', '))) + '</div>';
  if (!linked.length && !free.length) html += '<div class="snap-meta">' + h(t('dyn.nothing')) + '</div>';
  return html + '</details>';
}

// =============================================================
//  P2.1 — PIPELINE DE CHARGEMENT .MIZ
// =============================================================
let _mizLoading = false;   // un chargement de .miz est en cours
function handleFile(file) {
  if (_PK_BUSY) return;   // pas de nouveau .miz pendant l'application des paquets
  if (!file || !file.name.toLowerCase().endsWith('.miz')) {
    showToast(t('toast.mizNotMiz'), { type: 'err' });
    return;
  }
  loadMiz(file);
}

async function loadMiz(file) {
  if (_PK_BUSY || _mizLoading) return;
  _mizLoading = true;
  showToast(t('toast.mizLoading'));
  try {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const missionEntry = zip.file('mission');
    if (!missionEntry) throw new Error('Fichier "mission" introuvable dans le .miz');
    const missionText = await missionEntry.async('string');
    // Lire theatre
    const theatreEntry = zip.file('theatre');
    const theatre = theatreEntry ? (await theatreEntry.async('string')).trim() : 'Unknown';
    // P3 — charger otherFiles (rezip sans corruption)
    const otherFilesMap = {};
    for (const name of Object.keys(zip.files)) {
      if (!zip.files[name].dir && name !== 'mission') {
        otherFilesMap[name] = await zip.file(name).async('uint8array');
      }
    }
    // Parse
    const { tokens } = DCS_TOKENIZER.tokenize(missionText);
    const ast          = DCS_PARSER.parse(tokens);
    // Extraction via DCS_EXTRACTOR HQ (avec liveryPos P3)
    const model = DCS_EXTRACTOR.extract(ast, missionText, file.name, otherFilesMap, missionText.split('\n'));
    // Dynamic Spawn (lecture seule ; ne change ni le snapshot ni le .miz)
    const dyn = dynBuild(ast, otherFilesMap, theatre);
    // Construire le Mission JSON
    const snapshot = await buildMissionSnapshot(ast, model, missionText, file.name, theatre);
    try {
      // Tout a réussi : le nom, le contexte complet (pipeline de patch) et le snapshot changent ensemble
      _mizFilename = file.name;
      _HQ_MIZ_CONTEXT = { missionText, ast, model, otherFilesMap, theatre };
      _HQ_DYN = dyn;
      HQ_SNAPSHOT = snapshot;
      persistSnapshot();
      _PK_EXPORT_SEL.clear();
      _PK_REPORT = null;
      _MIZ_LOAD_FP = snapshot.sourceMission.fingerprint || '';
      pkResetFilters();
      renderSnapshot(snapshot);
      pkRender();
      showToast(t('toast.mizLoaded'), { type: 'ok' });
      console.log('[HQ P3] Snapshot:', snapshot);
    } catch(err) {
      console.warn('[HQ P3] enregistrement ou rendu du .miz :', err);
      showToast(t('msg.failed'), { type: 'err' });
    }
  } catch(err) {
    console.error('[HQ P3] loadMiz error:', err);
    showToast(t('msg.notMiz'), { type: 'err' });
  } finally {
    _mizLoading = false;
  }
}

// =============================================================
//  P4.2 — HELPERS EXTRACTION ROUTE + PAYLOAD DEPUIS AST
// =============================================================

// _astGetKey : accès à une clé dans un nœud table AST
function _astGetKey(node, key) {
  if (!node || node.kind !== 'table') return null;
  const e = node.entries.find(e => e.key && String(e.key.value) === String(key));
  return e ? e.value : null;
}

// _extractFromAst : extrait route.pointsPos, payload par groupId + unitId depuis l'AST
// Retourne: { pointsNode, pointsPos, unitPayloads: {unitId: {payloadNode, payloadPos}} }
function _extractRouteAndPayloads(ast, targetGroupId) {
  const missionTable = ast.kind === 'assignment' ? ast.value : ast;
  const coalition = _astGetKey(missionTable, 'coalition');
  if (!coalition) return null;
  for (const coalEntry of coalition.entries) {
    const coalNode = coalEntry.value;
    const country = _astGetKey(coalNode, 'country');
    if (!country) continue;
    for (const countryEntry of country.entries) {
      const c = countryEntry.value;
      if (!c) continue;
      for (const catKey of ['helicopter', 'plane']) {
        const cat = _astGetKey(c, catKey);
        const grpList = cat ? _astGetKey(cat, 'group') : null;
        if (!grpList) continue;
        for (const ge of grpList.entries) {
          const g = ge.value;
          const gidNode = _astGetKey(g, 'groupId');
          if (!gidNode || gidNode.value !== targetGroupId) continue;
          // Trouvé
          const route = _astGetKey(g, 'route');
          const pointsNode = route ? _astGetKey(route, 'points') : null;
          const unitPayloads = {};
          const units = _astGetKey(g, 'units');
          if (units) {
            for (const ue of units.entries) {
              const u = ue.value;
              const uid = _astGetKey(u, 'unitId');
              const payloadNode = _astGetKey(u, 'payload');
              if (uid && payloadNode) {
                unitPayloads[uid.value] = { payloadNode, payloadPos: payloadNode.pos };
              }
            }
          }
          return {
            pointsNode,
            pointsPos: pointsNode ? pointsNode.pos : null,
            unitPayloads,
          };
        }
      }
    }
  }
  return null;
}

// =============================================================
//  P2.2 — CONSTRUCTION DU MISSION JSON
// =============================================================
async function buildMissionSnapshot(ast, model, missionText, filename, theatre) {
  // Helper AST pour lire au top level
  function getMissionValue(keyPath) {
    const missionTable = ast.kind === 'assignment' ? ast.value : ast;
    let node = missionTable;
    for (const k of keyPath) {
      if (!node || node.kind !== 'table') return undefined;
      const entry = node.entries.find(e => e.key && e.key.value === k);
      if (!entry) return undefined;
      node = entry.value;
    }
    return node;
  }
  function scalarOf(node) {
    if (!node) return undefined;
    if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident') return node.value;
    return undefined;
  }
  function tableToObj(node) {
    if (!node || node.kind !== 'table') return {};
    const obj = {};
    for (const e of node.entries) {
      if (e.key) obj[e.key.value] = e.value && (e.value.kind === 'table') ? tableToObj(e.value) : scalarOf(e.value);
    }
    return obj;
  }
  // Date et start_time
  const dateNode = getMissionValue(['date']);
  const dateObj  = dateNode ? tableToObj(dateNode) : { Year:2020, Month:1, Day:1 };
  const startTimeNode = getMissionValue(['start_time']);
  const startTime = startTimeNode ? scalarOf(startTimeNode) : 0;
  const missionDate = (dateObj.Year || 2020) + '-' +
    String(dateObj.Month || 1).padStart(2,'0') + '-' +
    String(dateObj.Day   || 1).padStart(2,'0');
  // Fingerprint
  const fingerprint = await computeFingerprint(missionText);
  // Weather
  const wxNode = getMissionValue(['weather']);
  const wxRaw  = wxNode ? tableToObj(wxNode) : {};
  const metar  = mizWeatherToMetar(wxRaw, dateObj, startTime, theatre);
  const weather = {
    raw:  wxRaw,
    metar: metar,
    windDir:   wxRaw.wind && wxRaw.wind.atGround ? Math.round(((wxRaw.wind.atGround.dir + 180) % 360)) : 0,
    windKt:    wxRaw.wind && wxRaw.wind.atGround ? Math.round(wxRaw.wind.atGround.speed * 1.944) : 0,
    qnhHpa:    Math.round((wxRaw.qnh || 760) * 1.333),
    tempC:     wxRaw.season ? (wxRaw.season.temperature || 15) : 15,
    visM:      wxRaw.visibility ? (wxRaw.visibility.distance || 9999) : 9999,
  };
  // Vols clients — regroupement par groupId (FIX 3 : contrat slot.unit)
  // Helper : lire la valeur d'une clé dans un nœud AST table
  function _astGet(node, key) {
    if (!node || node.kind !== 'table') return null;
    const entry = node.entries.find(e => e.key && String(e.key.value) === String(key));
    return entry ? entry.value : null;
  }
  function _astScalar(node) {
    if (!node) return undefined;
    if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident') return node.value;
    return undefined;
  }
  // Parcours AST léger pour compter les waypoints par groupId
  function _routeCounts(ast) {
    const counts = {};
    const missionNode = ast.kind === 'assignment' ? ast.value : ast;
    const coalitionNode = _astGet(missionNode, 'coalition');
    if (!coalitionNode) return counts;
    for (const coalEntry of coalitionNode.entries) {
      const coalNode = coalEntry.value;
      if (!coalNode || coalNode.kind !== 'table') continue;
      for (const countryEntry of ((_astGet(coalNode, 'country') || {}).entries || [])) {
        const countryNode = countryEntry.value;
        if (!countryNode || countryNode.kind !== 'table') continue;
        for (const catKey of ['helicopter', 'plane']) {
          const catNode = _astGet(countryNode, catKey);
          const groupListNode = catNode ? _astGet(catNode, 'group') : null;
          if (!groupListNode || groupListNode.kind !== 'table') continue;
          for (const grpEntry of groupListNode.entries) {
            const grpNode = grpEntry.value;
            if (!grpNode || grpNode.kind !== 'table') continue;
            const gidNode = _astGet(grpNode, 'groupId');
            const routeNode = _astGet(grpNode, 'route');
            const pointsNode = routeNode ? _astGet(routeNode, 'points') : null;
            const gid = _astScalar(gidNode);
            if (gid !== undefined) counts[gid] = pointsNode ? pointsNode.entries.length : 0;
          }
        }
      }
    }
    return counts;
  }
  const routeCounts = _routeCounts(ast);

  // Regroupement des slots par groupId (1 slot = 1 unité cliente)
  const groupMap = {};
  for (const slot of (model.clientGroups || [])) {
    const g = slot.group;
    const u = slot.unit;
    if (!u) continue;
    const gid = g.groupId;
    if (!groupMap[gid]) {
      groupMap[gid] = {
        group: g,
        units: [],
      };
    }
    // Callsign lisible
    let cs = '';
    if (typeof u.callsign === 'object' && u.callsign) {
      cs = u.callsign.name || u.callsign[1] || u.name || '';
    } else {
      cs = u.callsign || u.name || '';
    }
    // Radios — canaux {num: freq}
    const radios = (u.radios || []).map(r => ({
      radioIndex: r.index,
      channels:   r.channels ? Object.fromEntries(
        Object.entries(r.channels).map(([k, ch]) => [k, typeof ch === 'object' ? ch.frequency : ch])
      ) : {},
    }));
    groupMap[gid].units.push({
      unitId:   u.unitId,
      name:     u.name || '',
      type:     u.type || '',
      callsign: cs,
      liveryId: u.livery_id || '',
      radios:   radios,
      payload:  { summary: '' },
    });
  }

  const flights = Object.values(groupMap).map(gd => {
    const g = gd.group;
    const units = gd.units;
    // P4.2 — Extraire route.points et payloads complets depuis l'AST
    const rpData = _extractRouteAndPayloads(ast, g.groupId);
    const routePoints = (rpData && rpData.pointsNode) ? astToValue(rpData.pointsNode) : null;
    const unitsFull = units.map(u => {
      const payData = rpData && rpData.unitPayloads && rpData.unitPayloads[u.unitId];
      const payloadFull = payData ? astToValue(payData.payloadNode) : null;
      return Object.assign({}, u, {
        payload: payloadFull || { summary: '' },
      });
    });
    return {
      groupId:        g.groupId,
      groupName:      g.name || '',
      coalition:      g.coalition || '',
      category:       g.category || '',
      groupFrequency: g.frequency ? { value: g.frequency.value, modulation: g.frequency.modulation } : null,
      route:          { pointCount: routeCounts[g.groupId] || 0, points: routePoints },
      units:          unitsFull,
    };
  });
  return {
    schema: 'dcs-mission-snapshot-v2',
    sourceMission: {
      filename:    filename,
      theatre:     theatre,
      missionDate: missionDate,
      startTime:   startTime,
      fingerprint: fingerprint,
    },
    weather: weather,
    flights: flights,
  };
}

// =============================================================
//  P4.1 — SÉRIALISEUR LUA + astToValue
// =============================================================

// astToValue : nœud AST → valeur JS pure (P4)
function astToValue(node) {
  if (!node) return undefined;
  if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident')
    return node.value;
  if (node.kind === 'nil') return null;
  if (node.kind === 'table') {
    const obj = {};
    for (const e of node.entries) {
      if (!e.key) continue;
      const v = astToValue(e.value);
      if (v !== undefined) obj[e.key.value] = v;
    }
    return obj;
  }
  return undefined;
}

// formatLuaNumber : nombre fini → String(n), exposant compris (le plus court qui redonne le même double ;
// Lua et le tokeniseur d'HQ lisent « 2.7755575615629e-17 » et « 1e+21 »)
function formatLuaNumber(n) {
  return String(n);
}

// luaEscape : texte → contenu d'une chaîne Lua entre guillemets
//   \\  "  \n  \r  et tout caractère sous U+0020 en \ddd (décimal, 3 chiffres) ; le reste tel quel (UTF-8)
function luaEscape(str) {
  let out = '';
  for (const ch of String(str)) {
    const c = ch.codePointAt(0);
    if (ch === '\\') out += '\\\\';
    else if (ch === '"') out += '\\"';
    else if (ch === '\n') out += '\\n';
    else if (ch === '\r') out += '\\r';
    else if (c < 32) out += '\\' + String(c).padStart(3, '0');
    else out += ch;
  }
  return out;
}

// luaKey : clé uniquement de chiffres → [n] ; toute autre → ["…"] échappée
function luaKey(k) {
  const ks = String(k);
  return /^\d+$/.test(ks) ? '[' + ks + ']' : '["' + luaEscape(ks) + '"]';
}

// serializeLua : valeur JS → texte Lua DCS-valide (P4)
function serializeLua(val, indent) {
  indent = (indent === undefined) ? 0 : indent;
  const tab  = '\t'.repeat(indent);
  const tab1 = '\t'.repeat(indent + 1);
  if (val === null || val === undefined) return null;
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (typeof val === 'number') return isFinite(val) ? formatLuaNumber(val) : null;
  if (typeof val === 'string') return '"' + luaEscape(val) + '"';
  if (typeof val !== 'object') return null;
  const entries = Object.entries(val);
  if (entries.length === 0) return '{}';
  let out = '{\n';
  for (const [k, v] of entries) {
    const vs = serializeLua(v, indent + 1);
    if (vs === null) continue;
    const ks = luaKey(k);
    out += tab1 + ks + ' = ' + vs + ', -- end of ' + ks + '\n';
  }
  out += tab + '}';
  return out;
}

// luaTableReproducible : true si serializeLua(astToValue(node)) redonne la même table, en valeur.
// Faux dès qu'à une profondeur quelconque : une entrée sans clé, une clé texte faite uniquement de chiffres,
// une clé ni texte ni nombre (ou un nombre qui n'est pas un entier ≥ 0), une clé en double, ou une valeur
// que astToValue ne sait pas rendre (identifiant nu, nil).
function luaTableReproducible(node) {
  if (!node) return false;
  if (node.kind === 'table') {
    const seen = new Set();
    for (const e of node.entries) {
      if (!e.key) return false;
      let ks;
      if (e.key.kind === 'string') {
        ks = String(e.key.value);
        if (/^\d+$/.test(ks) || ks === '__proto__') return false;
      } else if (e.key.kind === 'int') {
        ks = String(e.key.value);
        if (typeof e.key.value !== 'number' || !/^\d+$/.test(ks)) return false;
      } else {
        return false;
      }
      if (seen.has(ks)) return false;
      seen.add(ks);
      if (!luaTableReproducible(e.value)) return false;
    }
    return true;
  }
  return node.kind === 'number' || node.kind === 'string' || node.kind === 'bool';
}

// deepEqValues : comparaison structurelle de valeurs (P4 round-trip + verifyPatch)
function deepEqValues(a, b) {
  if (a === null && b === null) return true;
  if (typeof a !== typeof b) return false;
  if (typeof a === 'number') return Math.abs(a - b) / (Math.abs(a) + 1e-10) < 1e-9;
  if (typeof a !== 'object') return a === b;
  if (a === null || b === null) return a === b;
  const ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
  if (JSON.stringify(ka) !== JSON.stringify(kb)) return false;
  return ka.every(k => deepEqValues(a[k], b[k]));
}

// =============================================================
//  P3 — PATCH PIPELINE (applyPatches verbatim CPE + pipeline HQ)
// =============================================================

// État .miz courant (peuplé par loadMiz P3)
let _HQ_MIZ_CONTEXT = null;  // { missionText, ast, model, otherFilesMap, theatre }

// P3.1 — Fonctions verbatim CPE (injectées via placeholders)
function applyPatches(srcText, patches) {
  let result = srcText;
  for (const p of patches) {
    result = result.substring(0, p.pos.start.offset) + p.newValueStr + result.substring(p.pos.end.offset);
  }
  return result;
}
function retokenizeSafety(patchedSrc) {
  const t0 = performance.now();
  const { tokens, errors } = DCS_TOKENIZER.tokenize(patchedSrc);
  const elapsed = Math.round(performance.now() - t0);
  if (errors.length > 0) {
    throw new Error('Retokenize failed: ' + errors[0].message + ' L' + (errors[0].line+1) + ':C' + (errors[0].col+1));
  }
  console.log('[Save] Retokenize OK : 0 erreurs, ' + tokens.length.toLocaleString() + ' tokens, ' + elapsed + ' ms');
}
async function rebuildMiz(patchedSrc, model) {
  const newZip = new JSZip();
  newZip.file('mission', patchedSrc);
  const otherFiles = model.source.miz._otherFilesData;
  if (otherFiles) {
    Object.entries(otherFiles).forEach(function([name, data]) { newZip.file(name, data); });
  }
  return newZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

// Adapter rebuildMiz pour HQ (otherFiles vient de _HQ_MIZ_CONTEXT)
async function rebuildMizHQ(patchedSrc, otherFilesOverride) {
  if (!_HQ_MIZ_CONTEXT) throw new Error('Pas de contexte .miz chargé');
  const newZip = new JSZip();
  newZip.file('mission', patchedSrc);
  const otherFiles = otherFilesOverride || _HQ_MIZ_CONTEXT.otherFilesMap;
  if (otherFiles) {
    Object.entries(otherFiles).forEach(function([name, data]) { newZip.file(name, data, { createFolders: false }); });
  }
  return newZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

// P3.2 — Helpers de recherche dans le modèle (ctx : contexte .miz ; par défaut le contexte chargé)
function findGroupById(groupId, ctx) {
  ctx = ctx || _HQ_MIZ_CONTEXT;
  if (!ctx) return null;
  const cg = ctx.model.clientGroups || [];
  return cg.find(slot => slot.group.groupId === groupId) || null;
}

function findUnitById(unitId, ctx) {
  ctx = ctx || _HQ_MIZ_CONTEXT;
  if (!ctx) return null;
  const cg = ctx.model.clientGroups || [];
  for (const slot of cg) {
    if (slot.unit && slot.unit.unitId === unitId) return { unit: slot.unit, group: slot.group };
  }
  return null;
}

// Les groupes Client d'un contexte, dans l'ordre du .miz : { group, units[] }
function pkClientGroups(ctx) {
  const out = [];
  const byId = new Map();
  for (const slot of (ctx.model.clientGroups || [])) {
    if (!slot.unit) continue;
    const gid = slot.group.groupId;
    let g = byId.get(gid);
    if (!g) { g = { group: slot.group, units: [] }; byId.set(gid, g); out.push(g); }
    g.units.push(slot.unit);
  }
  return out;
}

// Le groupe visé : les groupes Client dont le nom rogné égale celui du paquet et — quand le paquet en porte une — de même coalition ;
// jamais le groupId, ni le type. pkMatchGroups les rend tous ; pkFindTarget le groupe seulement s'il est le seul (plusieurs : rien n'est deviné).
function pkMatchGroups(ctx, groupName, coalition) {
  const k = pkNameKey(groupName);
  return pkClientGroups(ctx).filter(g => pkNameKey(g.group.name) === k && (!coalition || g.group.coalition === coalition));
}
function pkFindTarget(ctx, groupName, coalition) {
  const m = pkMatchGroups(ctx, groupName, coalition);
  return m.length === 1 ? m[0] : null;
}

// P3.3 — Construire les patches d'un vol (pkg : { flight:{groupId}, overrides, replacements }) sur un contexte
// Les avertissements sont des { key, args } (textes par t())
function buildPatchesFromPackage(pkg, ctx) {
  ctx = ctx || _HQ_MIZ_CONTEXT;
  if (!ctx) throw new Error('Aucun .miz chargé');
  const warnings = [];
  const patches = [];
  const seenOffsets = new Set();

  const fl = pkg.flight;
  const ov = pkg.overrides || {};

  const slot = findGroupById(fl.groupId, ctx);
  if (!slot) {
    warnings.push({ key: 'pk.w.groupGone', args: [fl.groupId] });
    return { patches: [], warnings };
  }

  // overrides.radios[]
  for (const rOv of (ov.radios || [])) {
    const found = findUnitById(rOv.unitId, ctx);
    if (!found) { warnings.push({ key: 'pk.w.unitGone', args: [rOv.unitId] }); continue; }
    const u = found.unit;
    const radio = (u.radios || []).find(r => r.index === rOv.radioIndex);
    if (!radio) { warnings.push({ key: 'pk.w.radioGone', args: [pkRadioArg(u.type, rOv.radioIndex), rOv.unitId] }); continue; }
    const ch = radio.channels && radio.channels[rOv.channel];
    if (!ch) { warnings.push({ key: 'pk.w.chanGone', args: [pkChanArg(u.type, rOv.radioIndex, rOv.channel), pkRadioArg(u.type, rOv.radioIndex), rOv.unitId] }); continue; }
    const fPos = ch.frequencyPos;
    if (!fPos) { warnings.push({ key: 'pk.w.noFreqPos', args: [pkChanArg(u.type, rOv.radioIndex, rOv.channel), pkRadioArg(u.type, rOv.radioIndex)] }); continue; }
    if (seenOffsets.has(fPos.start.offset)) {
      warnings.push({ key: 'pk.w.dup', args: [fPos.start.offset] });
      continue;
    }
    seenOffsets.add(fPos.start.offset);
    patches.push({ pos: fPos, newValueStr: formatLuaNumber(rOv.frequency) });
  }

  // overrides.liveries[]
  for (const lOv of (ov.liveries || [])) {
    const found = findUnitById(lOv.unitId, ctx);
    if (!found) { warnings.push({ key: 'pk.w.unitGone', args: [lOv.unitId] }); continue; }
    const u = found.unit;
    if (!u.liveryPos) { warnings.push({ key: 'pk.w.noLiveryPos', args: [lOv.unitId] }); continue; }
    const lPos = u.liveryPos;
    if (seenOffsets.has(lPos.start.offset)) {
      warnings.push({ key: 'pk.w.dup', args: [lPos.start.offset] });
      continue;
    }
    seenOffsets.add(lPos.start.offset);
    patches.push({ pos: lPos, newValueStr: serializeLua(String(lOv.liveryId)) });
  }

  // P4.3 — replacements.route et replacements.payloads[]
  const repl = pkg.replacements || {};

  // replacements.route → remplacer source[pointsPos] par serializeLua(route.points)
  if (repl.route && repl.route.points !== undefined) {
    const pPos = slot.group.pointsPos;
    if (!pPos) {
      warnings.push({ key: 'pk.w.noPointsPos', args: [] });
    } else if (seenOffsets.has(pPos.start.offset)) {
      warnings.push({ key: 'pk.w.dup', args: [pPos.start.offset] });
    } else {
      const lua = serializeLua(repl.route.points);
      if (lua === null) {
        warnings.push({ key: 'pk.w.serialize', args: [] });
      } else {
        seenOffsets.add(pPos.start.offset);
        patches.push({ pos: pPos, newValueStr: lua });
      }
    }
  }

  // replacements.payloads[] → par unité
  for (const pOv of (repl.payloads || [])) {
    const found = findUnitById(pOv.unitId, ctx);
    if (!found) { warnings.push({ key: 'pk.w.unitGone', args: [pOv.unitId] }); continue; }
    const u = found.unit;
    if (!u.payloadPos) { warnings.push({ key: 'pk.w.noPayloadPos', args: [pOv.unitId] }); continue; }
    const pp = u.payloadPos;
    if (seenOffsets.has(pp.start.offset)) {
      warnings.push({ key: 'pk.w.dup', args: [pp.start.offset] });
      continue;
    }
    const lua = serializeLua(pOv.payload);
    if (lua === null) { warnings.push({ key: 'pk.w.serialize', args: [] }); continue; }
    seenOffsets.add(pp.start.offset);
    patches.push({ pos: pp, newValueStr: lua });
  }

  // Tri offset décroissant (obligatoire pour splice sans décalage)
  patches.sort(function(a, b) { return b.pos.start.offset - a.pos.start.offset; });

  return { patches, warnings };
}

// P3.3 — Auto-vérif post-patch (re-extraction du texte écrit → chaque valeur écrite est relue et comparée en valeur)
// En cas d'écart : Error portant pkErrors = [{ key, args }] (textes par t())
function verifyPatch(patchedSrc, pkg) {
  const ov = pkg.overrides || {};
  const errors = [];
  let vAst, vModel;
  try {
    const { tokens: vTk } = DCS_TOKENIZER.tokenize(patchedSrc);
    vAst = DCS_PARSER.parse(vTk);
    vModel = DCS_EXTRACTOR.extract(vAst, patchedSrc, _mizFilename || '', {}, patchedSrc.split('\n'));
  } catch (e) {
    console.warn('[HQ] relecture du texte écrit :', e);
    throw Object.assign(new Error('Vérif post-patch'), { pkErrors: [{ key: 'pk.e.reparse', args: [] }] });
  }

  // Vérifier chaque radio patchée
  for (const rOv of (ov.radios || [])) {
    const slot = (vModel.clientGroups || []).find(s => s.unit && s.unit.unitId === rOv.unitId);
    if (!slot) { errors.push({ key: 'pk.e.unitGone', args: [rOv.unitId] }); continue; }
    const u = slot.unit;
    const radio = (u.radios || []).find(r => r.index === rOv.radioIndex);
    const ch = radio && radio.channels && radio.channels[rOv.channel];
    if (!ch) { errors.push({ key: 'pk.e.chanGone', args: [pkChanArg(u.type, rOv.radioIndex, rOv.channel), pkRadioArg(u.type, rOv.radioIndex)] }); continue; }
    if (!deepEqValues(Number(ch.frequency), Number(rOv.frequency))) {
      errors.push({ key: 'pk.e.chanVal', args: [pkChanArg(u.type, rOv.radioIndex, rOv.channel), pkRadioArg(u.type, rOv.radioIndex), rOv.frequency, ch.frequency] });
    }
  }

  // Vérifier chaque livrée patchée
  for (const lOv of (ov.liveries || [])) {
    const slot = (vModel.clientGroups || []).find(s => s.unit && s.unit.unitId === lOv.unitId);
    if (!slot) { errors.push({ key: 'pk.e.unitGone', args: [lOv.unitId] }); continue; }
    if (slot.unit.livery_id !== lOv.liveryId) {
      errors.push({ key: 'pk.e.livery', args: [lOv.liveryId, slot.unit.livery_id || ''] });
    }
  }

  // P4.3 — Vérifier replacements.route + replacements.payloads, en valeur
  const repl = pkg.replacements || {};
  const rpCheck = _extractRouteAndPayloads(vAst, pkg.flight.groupId);
  if (repl.route && repl.route.points !== undefined) {
    if (rpCheck && rpCheck.pointsNode) {
      if (!deepEqValues(repl.route.points, astToValue(rpCheck.pointsNode))) errors.push({ key: 'pk.e.route', args: [] });
    } else {
      errors.push({ key: 'pk.e.routeGone', args: [] });
    }
  }
  for (const pOv of (repl.payloads || [])) {
    if (!rpCheck || !rpCheck.unitPayloads[pOv.unitId]) {
      errors.push({ key: 'pk.e.payloadGone', args: [pOv.unitId] });
      continue;
    }
    if (!deepEqValues(pOv.payload, astToValue(rpCheck.unitPayloads[pOv.unitId].payloadNode))) {
      errors.push({ key: 'pk.e.payload', args: [pOv.unitId] });
    }
  }

  if (errors.length > 0) {
    throw Object.assign(new Error('Auto-vérif post-patch échouée: ' + errors.map(e => e.key + '(' + e.args.map(pkArgText).join(',') + ')').join('; ')), { pkErrors: errors });
  }
  const totalChecked = (ov.radios||[]).length + (ov.liveries||[]).length +
    (repl.route ? 1 : 0) + (repl.payloads||[]).length;
  console.log('[HQ P4] Auto-vérif OK — ' + totalChecked + ' champ(s) validé(s)');
}

// Un nom de vol se compare rogné des deux côtés ; la casse compte.
function pkNameKey(s) { return String(s === undefined || s === null ? '' : s).trim(); }
// Le type d'une unité d'un vol lu (mission partagée ou paquet, v1 ou v2) : le sien, sinon, en v1, celui du vol (aircraftType) ; '' si aucun.
function unitTypeOf(f, u) { return u && typeof u.type === 'string' && u.type !== '' ? u.type : (f && typeof f.aircraftType === 'string' ? f.aircraftType : ''); }
// Les types d'un vol, distincts, dans l'ordre de ses unités ; leur texte : « Mi-24P + Mi-8MT » (vide si aucune unité n'a de type).
function flightTypes(f) {
  const out = [], us = (f && Array.isArray(f.units) ? f.units : []).filter(u => u && typeof u === 'object');
  us.forEach(u => { const x = unitTypeOf(f, u); if (x !== '' && out.indexOf(x) < 0) out.push(x); });
  if (!us.length && f && typeof f.aircraftType === 'string' && f.aircraftType !== '') out.push(f.aircraftType);      // un vol v1 sans unité garde son aircraftType
  return out;
}

// Nom du poste pour un type et un numéro de poste ; '' si le type ou le poste est inconnu.
function radioPosteName(type, radioIndex) {
  const map = Object.prototype.hasOwnProperty.call(RADIO_POSTES, type) ? RADIO_POSTES[type] : null;
  return map && Object.prototype.hasOwnProperty.call(map, radioIndex) ? map[radioIndex] : '';
}

// Numéro de canal tel que le cockpit le montre, depuis le numéro du .miz ; une entrée qui n'est pas un entier >= 1 est rendue telle quelle.
function radioCockpitChannel(type, radioIndex, mizChannel) {
  const s = String(mizChannel);
  const n = Number(s);
  if (!/^\s*\d+\s*$/.test(s) || !(n >= 1)) return s;
  const fm = Object.prototype.hasOwnProperty.call(RADIO_FIRST_CHANNEL, type) ? RADIO_FIRST_CHANNEL[type] : null;
  const first = fm && Object.prototype.hasOwnProperty.call(fm, radioIndex) ? fm[radioIndex] : 1;
  return String(n - 1 + first);
}

// Types proches d'un nom, dans l'ordre de la table (hélicoptères, puis avions) ; [] si le nom est dans la table.
// 1. même nom réduit ; 2. sinon le plus long début commun des noms réduits, au moins 3 caractères (tous les types qui l'atteignent).
function gameAircraftClose(name) {
  if (gameAircraftIsType(name)) return [];
  const all = GAME_AIRCRAFT_TYPES.helicopters.concat(GAME_AIRCRAFT_TYPES.planes);
  const r = gameAircraftReduce(name);
  const same = all.filter(ty => gameAircraftReduce(ty) === r);
  if (same.length) return same;
  let best = 0;
  const lens = all.map(ty => {
    const q = gameAircraftReduce(ty);
    let n = 0;
    while (n < r.length && n < q.length && r.charAt(n) === q.charAt(n)) n++;
    if (n > best) best = n;
    return n;
  });
  if (best < 3) return [];
  return all.filter((ty, i) => lens[i] === best);
}
/* ===== FIN DES TYPES D'APPAREILS DU JEU ===== */
// Poste et canal comme au cockpit : un argument pkRadio (type, poste) ou pkChan (type, poste, canal du .miz) se lit à l'affichage
// (nom du poste, à défaut « Poste n » ; numéro de canal du cockpit) ; le reste des messages garde le numéro du .miz
function pkRadioLabel(type, n) { return radioPosteName(type, n) || tf('snap.radio.name', n); }
function pkArgText(a) {
  if (a && typeof a === 'object' && typeof a.pkKey === 'string') return t(a.pkKey);
  if (a && typeof a === 'object' && Array.isArray(a.pkRadio)) return pkRadioLabel(a.pkRadio[0], a.pkRadio[1]);
  if (a && typeof a === 'object' && Array.isArray(a.pkChan)) return radioCockpitChannel(a.pkChan[0], a.pkChan[1], a.pkChan[2]);
  return String(a);
}
function pkRadioArg(type, n) { return { pkRadio: [type || '', n] }; }
function pkChanArg(type, n, c) { return { pkChan: [type || '', n, c] }; }

// tf : t() avec {0} {1}… ; tn : pluriel (clé.one / clé.many ; français < 2, anglais = 1), {0} = n
function tf(key) {
  const args = arguments;
  // une seule passe : un {1} venu d'une valeur (nom du .miz) n'est pas remplacé
  return t(key).replace(/\{(\d+)\}/g, (m, i) => (Number(i) + 1 < args.length ? pkArgText(args[Number(i) + 1]) : m));
}
function tn(key, n) {
  const one = CURRENT_LANG === 'fr' ? n < 2 : n === 1;
  const args = [key + (one ? '.one' : '.many')].concat(Array.prototype.slice.call(arguments, 1));
  return tf.apply(null, args);
}

function pkStamp(d) {
  d = d || new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function pkCleanName(s) { return String(s).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 40); }

function pkDownload(blob, fname) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------- EXPORT ----------
function pkBuildExport(groupIds) {
  const snap = HQ_SNAPSHOT, ctx = _HQ_MIZ_CONTEXT;
  const omit = { routes: [], payloads: [] };
  const flights = [];
  for (const fl of snap.flights) {
    if (!groupIds.has(fl.groupId)) continue;
    const rp = _extractRouteAndPayloads(ctx.ast, fl.groupId);
    let route = null;
    if (rp && rp.pointsNode) {
      if (luaTableReproducible(rp.pointsNode)) route = { points: astToValue(rp.pointsNode) };
      else omit.routes.push(fl.groupName);
    }
    const slots = (ctx.model.clientGroups || []).filter(s => s.group.groupId === fl.groupId);
    const units = fl.units.map(u => {
      const slot = slots.find(s => s.unit.unitId === u.unitId);
      const rawCs = slot && slot.unit.callsign !== null && slot.unit.callsign !== undefined ? slot.unit.callsign : u.callsign;
      let payload = null;
      const pn = rp && rp.unitPayloads[u.unitId];
      if (pn) {
        if (luaTableReproducible(pn.payloadNode)) payload = astToValue(pn.payloadNode);
        else omit.payloads.push(fl.groupName + ' / ' + (u.name || u.unitId));
      }
      return {
        name:     u.name || '',
        type:     unitTypeOf(fl, u),
        callsign: rawCs,
        liveryId: u.liveryId ? u.liveryId : null,
        radios:   (u.radios || []).map(r => ({ radioIndex: r.radioIndex, channels: Object.assign({}, r.channels) })),
        payload:  payload,
      };
    });
    flights.push({
      groupName:      fl.groupName,
      coalition:      fl.coalition,
      groupFrequency: fl.groupFrequency ? { value: fl.groupFrequency.value, modulation: fl.groupFrequency.modulation } : null,
      route:          route,
      units:          units,
    });
  }
  const pkg = {
    format:        PK_FORMAT,
    createdAt:     new Date().toISOString(),
    createdBy:     'HQ',
    theatre:       snap.sourceMission.theatre,
    sourceMission: { filename: snap.sourceMission.filename, fingerprint: snap.sourceMission.fingerprint },
    flights:       flights,
  };
  return { pkg, omit };
}

  if (!HQ_SNAPSHOT || !_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded'), { type: 'err' }); return; }

// Textes d'erreur : traduits à l'affichage, jamais au moment où l'erreur survient
function pkReasonText(r) { return r.key ? tf.apply(null, [r.key].concat(r.args)) : String(r.raw); }
function pkErrText(err) {
