* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; cursor: pointer; }

body {
  font-family: var(--f-typewriter);
  background: var(--olive-deep);
  color: var(--paper);
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

/* ======== TOOLBAR ======== */
.toolbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: linear-gradient(180deg, var(--olive-dark) 0%, var(--olive-deep) 100%);
  border-bottom: 2px solid var(--amber-dark);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  z-index: 1000;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
  padding-left: max(14px, env(safe-area-inset-left));
  padding-right: max(14px, env(safe-area-inset-right));
}
.tb-brand { display: flex; flex-direction: column; line-height: 1.1; gap: 1px; flex-shrink: 0; }
.tb-brand-main {
  font-family: var(--f-stencil);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
}
.tb-brand-sub {
  font-family: var(--f-ui);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--khaki-light);
  text-transform: uppercase;
  white-space: nowrap;
}
.tb-sep { width: 1px; height: 28px; background: var(--khaki); opacity: .4; flex-shrink: 0; }
.tb-select {
  font-family: var(--f-ui);
  font-weight: 500;
  letter-spacing: 1px;
  font-size: 12px;
  text-transform: uppercase;
  background-color: var(--olive-dark);
  color: var(--amber);
  border: 1px solid var(--amber-dark);
  padding: 0 28px 0 10px;
  height: 36px;
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23c0892a' stroke-width='2'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 10px 6px;
  transition: all .15s;
  white-space: nowrap;
}
.tb-select:hover, .tb-select:focus-visible {
  background-color: var(--olive);
  border-color: var(--amber);
  outline: none;
}
.tb-select option { background-color: var(--olive-dark); color: var(--paper); }

/* ---------- Listes de la barre au thème de l'interface (lot mp-ui-listes) ----------
   Le <select> reste dans la page, masqué ; un bouton de mêmes classes prend sa place (voir initToolbarMenus). */
select[data-tbm-src] { display: none !important; }
.tbm-trigger { display: inline-block; text-align: left; white-space: nowrap; }
.tbm-lbl { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: 4px 0; margin: -3.25px 0 -2.75px; pointer-events: none; }
.tbm-lbl::after { content: attr(data-w); display: block; height: 0; overflow: hidden; visibility: hidden; white-space: pre; }
@supports (width: calc-size(max-content, round(up, size, 1px))) { .tbm-lbl::after { width: calc-size(max-content, round(up, size, 1px)); } }
.tbm-trigger-open { border-color: var(--amber) !important; }
.tbm-panel {
  position: fixed; z-index: 5000; min-width: 180px; max-width: min(340px, calc(100vw - 16px));
  max-height: min(62vh, 440px); overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, var(--olive-dark) 0%, var(--olive-deep) 100%);
  border: 1px solid var(--amber-dark); border-top: 3px solid var(--amber);
  box-shadow: 0 12px 28px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.35);
  padding: 4px 0; margin: 0; list-style: none; scrollbar-width: thin; scrollbar-color: var(--amber-dark) transparent;
  transform-origin: top left; animation: tbm-in .12s ease-out;
}
@keyframes tbm-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.tbm-head {
  font-family: var(--f-ui); font-weight: 500; font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--khaki-light); padding: 8px 14px 6px; border-bottom: 1px solid rgba(168,154,114,.25); margin-bottom: 2px;
}
.tbm-opt {
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px 0 18px;
  font-family: var(--f-ui); font-weight: 500; font-size: 13px; letter-spacing: 1.3px; text-transform: uppercase;
  color: var(--paper); cursor: pointer; white-space: nowrap; user-select: none;
}
.tbm-opt + .tbm-opt { border-top: 1px solid rgba(168,154,114,.14); }
.tbm-opt .tbm-mark { width: 7px; height: 7px; flex: none; transform: rotate(45deg); border: 1px solid var(--khaki); }
.tbm-opt.active, .tbm-opt:hover { background: var(--olive); color: var(--amber); }
.tbm-opt.active .tbm-mark, .tbm-opt:hover .tbm-mark { border-color: var(--amber); }
.tbm-opt[aria-selected="true"] { color: var(--amber); }
.tbm-opt[aria-selected="true"]::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; background: var(--amber); }
.tbm-opt[aria-selected="true"] .tbm-mark { background: var(--amber); border-color: var(--amber); }
.tbm-opt[aria-disabled="true"] { color: var(--khaki); cursor: not-allowed; background: none; }
.tbm-opt[aria-disabled="true"] .tbm-mark { border-style: dashed; border-color: var(--khaki); background: none; }
.tbm-opt[aria-disabled="true"] .tbm-note { color: var(--khaki); font-size: 10px; letter-spacing: 1px; margin-left: auto; padding-left: 14px; }
@media (prefers-reduced-motion: reduce) { .tbm-panel { animation: none; } }
@media print { .tbm-panel { display: none; } }
.tb-lang-btn {
  background: transparent;
  border: 1px solid var(--khaki);
  color: var(--paper);
  height: 36px;
  min-width: 40px;
  padding: 0 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all .15s;
}
.tb-lang-btn:hover, .tb-lang-btn:focus-visible {
  background: var(--olive);
  border-color: var(--amber);
  outline: none;
}
.tb-spacer { flex: 1; }
.tb-version {
  font-size: 11px;
  opacity: .45;
  color: var(--amber);
  letter-spacing: .5px;
  user-select: none;
  white-space: nowrap;
}

/* ======== MAIN LAYOUT ======== */
.app {
  position: fixed;
  top: 56px; bottom: 0; left: 0; right: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--olive-deep);
}

/* ======== EDITOR ======== */
.editor {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px 16px 80px 16px;
  color: var(--paper);
}
.editor::-webkit-scrollbar { width: 8px; }
.editor::-webkit-scrollbar-track { background: var(--olive-deep); }
.editor::-webkit-scrollbar-thumb { background: var(--khaki); border: 2px solid var(--olive-deep); }

/* ======== ED SECTION ======== */
.ed-section {
  contain: layout;
  margin-bottom: 14px;
  border: 1px solid var(--khaki);
  background: rgba(20,24,12,.5);
}
.ed-section > summary {
  cursor: pointer;
  padding: 12px 14px;
  background: linear-gradient(90deg, var(--olive) 0%, var(--olive-dark) 100%);
  font-family: var(--f-stencil);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--amber);
  list-style: none;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--amber-dark);
  user-select: none;
  min-height: 48px;
}
.ed-section > summary::-webkit-details-marker { display: none; }
.ed-section > summary::after {
  content: '◄';
  font-size: 10px;
  color: var(--paper);
  transition: transform .2s;
}
.ed-section[open] > summary::after { transform: rotate(-90deg); }
.ed-section > summary:hover { color: var(--paper-light); }
.ed-content {
  padding: 14px;
  display: flex; flex-direction: column; gap: 14px;
}

/* FIELDS */
.ed-field { display: flex; flex-direction: column; gap: 5px; }
.ed-field label {
  font-family: var(--f-ui);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--amber);
  display: flex; align-items: center; gap: 6px;
}
.ed-field label::before { content: '►'; color: var(--rust); font-size: 8px; }
.ed-field input[type=text] {
  background: rgba(216,201,165,.92);
  border: 1px solid var(--khaki);
  border-left: 3px solid var(--amber-dark);
  font-family: var(--f-typewriter);
  font-size: 13px;
  color: var(--ink);
  padding: 10px 11px;
  min-height: 44px;
  transition: all .15s;
  width: 100%;
}
.ed-field input:focus {
  outline: none;
  border-left-color: var(--red-stamp);
  background: var(--paper-light);
  box-shadow: 0 0 0 1px var(--amber);
}
.ed-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* BUTTONS */
.ed-btn-icon {
  background: var(--rust);
  border: 1px solid var(--red-faded);
  color: var(--paper-light);
  font-family: var(--f-ui);
  font-weight: 700;
  cursor: pointer;
  padding: 0 12px;
  transition: background .15s;
  font-size: 18px;
  line-height: 1;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ed-btn-icon:hover { background: var(--red-stamp); }
.ed-btn-icon.danger { background: var(--rust); }
.ed-btn-add {
  background: transparent;
  border: 1px dashed var(--amber);
  color: var(--amber);
  font-family: var(--f-ui);
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 12px;
  min-height: 44px;
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
  transition: all .15s;
}
.ed-btn-add:hover { background: var(--olive); color: var(--paper-light); }
.ed-btn-add-sm { padding: 6px 10px; min-height: 36px; font-size: 10px; }

/* IMAGE ZONE */
.ed-img-zone {
  border: 1px dashed var(--khaki);
  background: rgba(0,0,0,.2);
  padding: 14px;
  text-align: center;
  cursor: pointer;
  font-family: var(--f-ui);
  font-weight: 600;
  font-size: 11px;
  color: var(--khaki-light);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  transition: all .15s;
  position: relative;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ed-img-zone:hover, .ed-img-zone:focus-within {
  border-color: var(--amber);
  color: var(--amber);
}
.ed-img-zone.has-img {
  border-style: solid;
  border-color: var(--green-radar);
  color: var(--paper);
  padding: 0;
  min-height: 0;
}
.ed-img-zone.has-img img {
  width: 100%; height: auto; display: block;
  max-height: 280px; object-fit: contain;
  background: rgba(0,0,0,.15);
}
.ed-img-zone .img-rm {
  position: absolute; top: 6px; right: 6px;
  background: var(--rust); color: var(--paper-light);
  border: 1px solid var(--red-faded);
  width: 32px; height: 32px; cursor: pointer;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-ui); font-size: 18px; line-height: 1; padding: 0;
}
.ed-img-zone .img-info {
  position: absolute; bottom: 6px; left: 6px;
  background: rgba(0,0,0,.7); color: var(--paper);
  font-family: var(--f-typewriter); font-size: 9px;
  letter-spacing: 1px; padding: 2px 6px;
}
.ed-img-zone input[type=file] { display: none; }

/* WING SPECIFIC */
.wing-fieldset {
  border: 1px solid var(--khaki);
  border-radius: 4px; padding: 12px; margin: 0 0 14px 0;
}
.wing-legend {
  font-family: var(--f-stencil); font-size: 11px;
  letter-spacing: .08em; color: var(--khaki-light);
  padding: 0 6px; text-transform: uppercase;
}
.wing-hint {
  font-family: var(--f-typewriter); font-size: 10px;
  color: var(--khaki); font-weight: normal; font-style: italic;
}
.wing-logo-zone { min-height: 80px; }

/* Squadron cards */
.wing-sq-card {
  border: 1px solid var(--khaki); border-radius: 4px;
  padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,.15);
}
.wing-sq-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--f-stencil); font-size: 12px;
  color: var(--khaki-light); letter-spacing: .06em;
}
.wing-sq-toggle { flex: 1; cursor: pointer; user-select: none; }
.wing-sq-toggle::before { content: '► '; font-size: 9px; opacity: .7; }
.wing-sq-card.open .wing-sq-toggle::before { content: '▼ '; }
.wing-sq-body { display: none; }
.wing-sq-card.open .wing-sq-body {
  display: flex; flex-direction: column; gap: 8px;
}

/* Aircraft tags */
.wing-aircraft-tags {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
}
.wing-ac-tag {
  background: var(--olive); color: var(--paper-light);
  font-family: var(--f-typewriter); font-size: 11px;
  padding: 2px 6px; border-radius: 3px;
  display: flex; align-items: center; gap: 4px;
}
.wing-ac-tag button {
  background: none; border: none; color: var(--paper-light);
  cursor: pointer; padding: 0; font-size: 12px; line-height: 1; opacity: .7;
}
.wing-ac-tag button:hover { opacity: 1; }
.wing-ac-add-row { display: flex; gap: 6px; margin-top: 4px; }
.wing-ac-add-row input { flex: 1; }
.wing-ac-add-row button { white-space: nowrap; }

/* Action buttons */
.wing-actions {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px 0;
}
.wing-action-btn {
  flex: 1; min-width: 120px;
  font-family: var(--f-stencil); font-size: 12px;
  letter-spacing: .05em; padding: 9px 10px;
  border-radius: 3px; border: 1px solid var(--khaki);
  background: rgba(0,0,0,.2); color: var(--paper-light);
  cursor: pointer; text-align: center;
  display: flex; align-items: center; justify-content: center;
  gap: 5px; transition: background .15s;
}
.wing-action-btn:hover { background: var(--olive); }
.wing-action-import input[type=file] { display: none; }
.wing-action-reset { border-color: var(--red-stamp); color: var(--red-stamp); }
.wing-action-reset:hover { background: var(--red-stamp); color: var(--paper-light); }

/* Size counter */
.wing-size-counter {
  font-family: var(--f-typewriter); font-size: 11px;
  color: var(--khaki); text-align: right;
  padding: 4px 2px 0; opacity: .75;
}
.wing-size-counter.warn { color: #e8b840; opacity: 1; }
.wing-id-warning {
  border-color: #e8b840 !important;
  box-shadow: 0 0 0 2px rgba(232,184,64,.25) !important;
}
.wing-logo-loading { opacity: .45; cursor: wait !important; pointer-events: none; }

/* ======== TOAST ======== */
.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--olive-dark);
  border: 1px solid var(--amber);
  color: var(--paper);
  font-family: var(--f-ui);
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 12px;
  padding: 10px 20px;
  z-index: 2000;
  opacity: 0;
  transition: all .3s ease;
  pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.6);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ======== MISSION SECTION ======== */
.drop-zone-miz {
  border: 2px dashed var(--khaki);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  color: var(--khaki-light);
  font-family: var(--f-ui);
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.drop-zone-miz:hover, .drop-zone-miz.dragover {
  border-color: var(--amber);
  background: rgba(192,137,42,.07);
  color: var(--amber);
}
.drop-zone-miz.has-file {
  border-style: solid;
  border-color: var(--green-radar);
  color: var(--green-radar);
  padding: 14px 20px;
}
.miz-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-stencil); font-size: 12px;
  letter-spacing: .05em; padding: 9px 14px;
  border: 1px solid var(--khaki); border-radius: 3px;
  background: rgba(0,0,0,.2); color: var(--paper-light);
  cursor: pointer; transition: background .15s;
  text-transform: uppercase;
}
.miz-btn:hover { background: var(--olive); border-color: var(--amber); color: var(--amber); }
.miz-btn.primary { border-color: var(--amber); color: var(--amber); }
.miz-btn.primary:hover { background: var(--amber-dark); color: var(--paper-light); }
.miz-btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* Mission snapshot read-only display */
.snapshot-section {
  margin-top: 14px;
}
.snap-header {
  font-family: var(--f-stencil); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--amber); padding: 8px 0 4px;
  border-bottom: 1px solid var(--khaki);
  margin-bottom: 8px;
}
.snap-meta {
  font-family: var(--f-typewriter); font-size: 11px;
  color: var(--khaki-light); line-height: 1.6;
}
.snap-metar {
  font-family: var(--f-typewriter); font-size: 12px;
  background: rgba(0,0,0,.3); border: 1px solid var(--khaki);
  padding: 10px 12px; color: var(--paper); margin: 8px 0;
  letter-spacing: .5px; word-break: break-all;
}
.snap-flight-list {
  display: flex; flex-direction: column; gap: 6px; margin-top: 8px;
}
.snap-flight {
  border: 1px solid var(--khaki); border-radius: 3px;
  padding: 8px 10px; background: rgba(0,0,0,.15);
}
.snap-flight-header {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: var(--f-stencil); font-size: 12px;
  color: var(--amber); letter-spacing: 1px;
}
.snap-flight-tag {
  font-family: var(--f-ui); font-size: 10px;
  padding: 2px 6px; border-radius: 2px;
  background: var(--olive); color: var(--paper-light);
  text-transform: uppercase; letter-spacing: 1px;
}
.snap-unit-list {
  margin-top: 6px; font-family: var(--f-typewriter);
  font-size: 11px; color: var(--khaki-light);
  display: flex; flex-direction: column; gap: 3px;
}
.snap-unit-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline;
}
.snap-unit-cs { color: var(--paper); font-size: 12px; min-width: 80px; }
.snap-unit-livery { color: var(--khaki-light); font-size: 10px; font-style: italic; }
.snap-unit-radio {
  font-size: 10px; color: var(--paper-dark);
  background: rgba(0,0,0,.2); padding: 1px 5px;
  border-radius: 2px;
}
.snap-fingerprint {
  font-family: var(--f-typewriter); font-size: 9px;
  color: var(--khaki); opacity: .6; margin-top: 8px;
  word-break: break-all;
}

/* ======== COMMANDER GHOST ======== */
.commander-ghost {
  text-align: center;
  padding: 28px 20px;
  opacity: .45;
  pointer-events: none;
  user-select: none;
}
.ghost-icon {
  font-size: 32px;
  margin-bottom: 8px;
  color: var(--khaki-light);
}
.ghost-label {
  font-family: var(--f-stencil);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--khaki-light);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.ghost-sub {
  font-family: var(--f-ui);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--khaki);
  text-transform: uppercase;
}
.dev-ta {
  width: 100%;
  background: rgba(0,0,0,.3);
  border: 1px solid var(--khaki);
  color: var(--paper);
  font-family: var(--f-typewriter);
  font-size: 11px;
  padding: 8px;
  resize: vertical;
  margin-top: 8px;
}
.dev-ta:focus {
  outline: none;
  border-color: var(--amber);
}

/* ======== RESPONSIVE ======== */
@media (max-width: 600px) {
  .ed-field-row { grid-template-columns: 1fr; }
  .wing-actions { flex-direction: column; }
  .wing-action-btn { min-width: unset; }
}
</style>

let CURRENT_LANG = 'fr';

function t(key, fallback) {
  const dict = I18N[CURRENT_LANG] || I18N.fr;
  if (key in dict) return dict[key];
  if (fallback !== undefined) return fallback;
  if (key in I18N.fr) return I18N.fr[key];
  console.warn('[i18n] missing key:', key);
  return key;
}

// ── Keys ───────────────────────────────────────────────────────
const KEY_WING  = 'wing_config_v1';
const KEY_THEME = 'theme_v1';
const KEY_LANG  = 'hq_lang_v1';

let wingConfig = null;

// ── LOGO compression (256×256 PNG, alpha conservé) ────────────
const LOGO_MAX_SIZE = 256;

function compressLogoFile(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error(t('toast.fileMustBeImage'))); return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          let { width, height } = img;
          if (width > LOGO_MAX_SIZE || height > LOGO_MAX_SIZE) {
            if (width >= height) {
              height = Math.round(height * LOGO_MAX_SIZE / width);
              width  = LOGO_MAX_SIZE;
            } else {
              width  = Math.round(width * LOGO_MAX_SIZE / height);
              height = LOGO_MAX_SIZE;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve({ dataUrl: canvas.toDataURL('image/png'), width, height });
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('Image illisible.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Lecture du fichier impossible.'));
    reader.readAsDataURL(file);
  });
}

// ── Helpers ─────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => el.classList.remove('show'), 2200);
}

function loadTheme() {
  const saved = localStorage.getItem(KEY_THEME) || 'cw-nato';
  document.body.setAttribute('data-theme', saved);
  const sel = document.getElementById('theme-select');
  if (sel) sel.value = saved;
}

  showToast(t('toast.theme'));
}

function loadLang() {
  const saved = localStorage.getItem(KEY_LANG);
  if (saved === 'fr' || saved === 'en') {
    CURRENT_LANG = saved;
  } else {
    CURRENT_LANG = (navigator.language || 'fr').startsWith('fr') ? 'fr' : 'en';
  }
  applyI18nStatic();
  updateFlagButton();
  document.documentElement.lang = CURRENT_LANG;
}

function setLang(lang) {
  CURRENT_LANG = lang;
  localStorage.setItem(KEY_LANG, lang);
  document.documentElement.lang = lang;
  applyI18nStatic();
  rerenderDynamic();
  updateFlagButton();
  showToast(t('toast.lang'));
}

function updateFlagButton() {
  const btn = document.getElementById('btn-lang');
  if (!btn) return;
  btn.textContent = CURRENT_LANG === 'fr' ? '🇬🇧' : '🇫🇷';
  btn.title = t('toolbar.lang.tooltip');
}

function applyI18nStatic() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
}

function rerenderDynamic() {
  renderWingEditor();
}

// ── Wing config persistence ────────────────────────────────────
function validateWingConfig(obj) {
  const errors = [];
  if (!obj || typeof obj !== 'object') return { ok: false, errors: [t('validate.schemaMissing')] };
  if (obj.configSchemaVersion !== 1) errors.push(t('validate.schemaMissing'));
  if (!obj.wing || typeof obj.wing !== 'object') {
    errors.push(t('validate.wingMissing'));
  } else {
    if (!obj.wing.shortName) errors.push(t('validate.shortNameMissing'));
    if (!obj.wing.logo || !String(obj.wing.logo).startsWith('data:image/'))
      errors.push(t('validate.logoInvalid'));
  }
  if (!Array.isArray(obj.squadrons)) {
    errors.push(t('validate.squadronsNotArray'));
  } else {
    obj.squadrons.forEach((sq, i) => {
      if (!sq.id)                      errors.push('squadrons[' + i + ']' + t('validate.sqIdMissing'));
      if (!sq.callsign)                errors.push('squadrons[' + i + ']' + t('validate.sqCallsignMissing'));
      if (!Array.isArray(sq.aircraft)) errors.push('squadrons[' + i + ']' + t('validate.sqAircraftNotArray'));
    });
  }
  return errors.length === 0 ? { ok: true } : { ok: false, errors };
}

function loadWingConfig() {
  try {
    const raw = localStorage.getItem(KEY_WING);
    if (raw) {
      const parsed = JSON.parse(raw);
      const check = validateWingConfig(parsed);
      if (check.ok) return parsed;
      console.warn('[Wing] Config localStorage invalide — utilisation du défaut :', check.errors);
    }
  } catch(e) { console.warn('[Wing] Lecture localStorage échouée :', e); }
  return structuredClone(DEFAULT_WING_CONFIG);
}

let _wingPersistTimer = null;
function persistWingConfig() {
  if (_wingPersistTimer) clearTimeout(_wingPersistTimer);
  _wingPersistTimer = setTimeout(() => {
    try {
      localStorage.setItem(KEY_WING, JSON.stringify(wingConfig));
    } catch(e) {
      if (e.name === 'QuotaExceededError') {
        showToast(t('toast.wingStorageFull'));
      } else {
        console.warn('[Wing] Erreur persistance :', e);
      }
    }
  }, 200);
}

// ── Wing size counter ──────────────────────────────────────────
function updateWingSizeCounter() {
  const el = document.getElementById('wing-size-counter');
  if (!el) return;
  const kb = Math.round(JSON.stringify(wingConfig).length / 1024);
  el.textContent = t('editor.wing.sizeKo').replace('{n}', kb);
  el.classList.toggle('warn', kb > 3500);
}

// ── Wing main logo zone ────────────────────────────────────────
function refreshWingLogoZone() {
  const zone = document.getElementById('wing-logo-zone');
  if (!zone) return;
  const raw = wingConfig.wing.logo;
  const url  = (raw && raw.startsWith('data:image/')) ? raw : '';
  zone.classList.toggle('has-img', !!url);
  zone.classList.remove('wing-logo-loading');

  if (url) {
    zone.innerHTML = '<input type="file" accept="image/*" id="wing-logo-input">' +
      '<img src="' + escapeAttr(url) + '" alt="Logo wing">' +
      '<button type="button" class="img-rm" aria-label="' + t('editor.wing.resetLogoAria') + '">×</button>' +
      '<span class="img-info">' + t('editor.wing.clickToReplace') + '</span>';
  } else {
    zone.innerHTML = '<input type="file" accept="image/*" id="wing-logo-input">' +
      '<span class="img-text">' + t('editor.imgZone.tapLogo') + '</span>';
  }

  const inp = zone.querySelector('#wing-logo-input');
  inp.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    zone.classList.add('wing-logo-loading');
    showToast(t('toast.logoCompressing'));
    try {
      const { dataUrl } = await compressLogoFile(f);
      wingConfig.wing.logo = dataUrl;
      persistWingConfig();
      refreshWingLogoZone(); updateWingSizeCounter();
      showToast(t('toast.logoWingLoaded'));
    } catch (err) {
      zone.classList.remove('wing-logo-loading');
      showToast('⚠ Logo invalide : ' + err.message);
    }
    e.target.value = '';
  });

  const rm = zone.querySelector('.img-rm');
  if (rm) {
    rm.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      wingConfig.wing.logo = DEFAULT_WING_CONFIG.wing.logo;
      persistWingConfig();
      refreshWingLogoZone(); updateWingSizeCounter();
      showToast(t('toast.logoReset'));
    });
  }
}

// ── Squadron logo zone ─────────────────────────────────────────
function refreshSqLogoZone(zone, sqIdx) {
  if (!zone) return;
  const raw = wingConfig.squadrons[sqIdx] ? wingConfig.squadrons[sqIdx].logo : '';
  const url  = (raw && raw.startsWith('data:image/')) ? raw : '';
  zone.classList.toggle('has-img', !!url);
  zone.classList.remove('wing-logo-loading');

  if (url) {
    zone.innerHTML = '<input type="file" accept="image/*">' +
      '<img src="' + escapeAttr(url) + '" alt="' + t('editor.wing.sqLogo') + '">' +
      '<button type="button" class="img-rm" aria-label="' + t('editor.wing.removeLogoAria') + '">×</button>';
  } else {
    zone.innerHTML = '<input type="file" accept="image/*">' +
      '<span class="img-text">' + t('editor.imgZone.tapLogo') + '</span>';
  }

  const inp = zone.querySelector('input[type=file]');
  inp.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!wingConfig.squadrons[sqIdx]) return;
    zone.classList.add('wing-logo-loading');
    showToast(t('toast.logoCompressing'));
    try {
      const { dataUrl } = await compressLogoFile(f);
      wingConfig.squadrons[sqIdx].logo = dataUrl;
      persistWingConfig();
      refreshSqLogoZone(zone, sqIdx); updateWingSizeCounter();
      showToast(t('toast.logoSqLoaded'));
    } catch (err) {
      zone.classList.remove('wing-logo-loading');
      showToast('⚠ Logo invalide : ' + err.message);
    }
    e.target.value = '';
  });

  const rm = zone.querySelector('.img-rm');
  if (rm) {
    rm.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (!wingConfig.squadrons[sqIdx]) return;
      wingConfig.squadrons[sqIdx].logo = '';
      persistWingConfig();
      refreshSqLogoZone(zone, sqIdx); updateWingSizeCounter();
    });
  }
}

// ── Aircraft tags ──────────────────────────────────────────────
function renderSqAircraftTags(container, sqIdx) {
  if (!container || !wingConfig.squadrons[sqIdx]) return;
  container.innerHTML = '';

  wingConfig.squadrons[sqIdx].aircraft.forEach((_, acIdx) => {
    const tag = document.createElement('span');
    tag.className = 'wing-ac-tag';
    const label = document.createElement('span');
    label.textContent = wingConfig.squadrons[sqIdx].aircraft[acIdx];
    const rmBtn = document.createElement('button');
    rmBtn.type = 'button';
    rmBtn.setAttribute('aria-label', t('editor.radio.delAircraftAriaLabel'));
    rmBtn.textContent = '×';
    rmBtn.addEventListener('click', () => {
      if (!wingConfig.squadrons[sqIdx]) return;
      wingConfig.squadrons[sqIdx].aircraft.splice(acIdx, 1);
      persistWingConfig(); updateWingSizeCounter();
      renderSqAircraftTags(container, sqIdx);
    });
    tag.appendChild(label); tag.appendChild(rmBtn);
    container.appendChild(tag);
  });

  const addRow = document.createElement('div');
  addRow.className = 'wing-ac-add-row';
  const addInp = document.createElement('input');
  addInp.type = 'text'; addInp.placeholder = 'F-4E Phantom II'; addInp.maxLength = 60;
  const addBtn = document.createElement('button');
  addBtn.type = 'button'; addBtn.className = 'ed-btn-add ed-btn-add-sm';
  addBtn.textContent = '+';
  const doAdd = () => {
    const val = addInp.value.trim(); if (!val) return;
    if (!wingConfig.squadrons[sqIdx]) return;
    wingConfig.squadrons[sqIdx].aircraft.push(val);
    addInp.value = '';
    persistWingConfig(); updateWingSizeCounter();
    renderSqAircraftTags(container, sqIdx);
  };
  addBtn.addEventListener('click', doAdd);
  addInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
  addRow.appendChild(addInp); addRow.appendChild(addBtn);
  container.appendChild(addRow);
}

let _wingOpenSqIds = new Set();

function _saveWingOpenState() {
  _wingOpenSqIds = new Set();
  document.querySelectorAll('.wing-sq-card.open').forEach(card => {
    const idx = parseInt(card.dataset.sqIdx, 10);
    if (!isNaN(idx) && wingConfig.squadrons[idx]) {
      _wingOpenSqIds.add(wingConfig.squadrons[idx].id);
    }
  });
}

function renderWingSquadronCard(sqIdx) {
  const sq = wingConfig.squadrons[sqIdx];
  const card = document.createElement('div');
  card.className = 'wing-sq-card'; card.dataset.sqIdx = sqIdx;

  const header = document.createElement('div');
  header.className = 'wing-sq-header';

  const toggle = document.createElement('span');
  toggle.className = 'wing-sq-toggle';
  toggle.textContent = sq.id || '(sans id)';
  toggle.addEventListener('click', () => { card.classList.toggle('open'); });

  const btnUp = document.createElement('button');
  btnUp.type = 'button'; btnUp.className = 'ed-btn-icon'; btnUp.title = t('editor.phases.moveUp');
  btnUp.innerHTML = '↑';
  btnUp.addEventListener('click', () => {
    if (sqIdx === 0) return;
    const sqs = wingConfig.squadrons;
    [sqs[sqIdx - 1], sqs[sqIdx]] = [sqs[sqIdx], sqs[sqIdx - 1]];
    persistWingConfig(); renderWingSquadrons();
  });

  const btnDown = document.createElement('button');
  btnDown.type = 'button'; btnDown.className = 'ed-btn-icon'; btnDown.title = t('editor.phases.moveDown');
  btnDown.innerHTML = '↓';
  btnDown.addEventListener('click', () => {
    const sqs = wingConfig.squadrons;
    if (sqIdx >= sqs.length - 1) return;
    [sqs[sqIdx], sqs[sqIdx + 1]] = [sqs[sqIdx + 1], sqs[sqIdx]];
    persistWingConfig(); renderWingSquadrons();
  });

  const btnDel = document.createElement('button');
  btnDel.type = 'button'; btnDel.className = 'ed-btn-icon danger'; btnDel.title = t('editor.wing.delSquadron');
  btnDel.innerHTML = '×';
  btnDel.addEventListener('click', () => {
    const sqId   = wingConfig.squadrons[sqIdx] ? wingConfig.squadrons[sqIdx].id : '?';
    const isLast = wingConfig.squadrons.length === 1;
    const extra  = isLast ? t('delSquadron.lastWarning') : '';
    if (!confirm(t('editor.wing.delSquadron') + ' "' + escapeHtml(sqId) + '" ?' + extra + t('delSquadron.refWarning'))) return;
    wingConfig.squadrons.splice(sqIdx, 1);
    persistWingConfig(); renderWingSquadrons();
  });

  header.appendChild(toggle); header.appendChild(btnUp);
  header.appendChild(btnDown); header.appendChild(btnDel);
  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'wing-sq-body';

  function makeField(labelText, fieldName, value, placeholder, hint) {
    const wrap = document.createElement('div'); wrap.className = 'ed-field';
    const lbl = document.createElement('label');
    lbl.innerHTML = escapeHtml(labelText) + (hint ? ' <span class="wing-hint">(' + escapeHtml(hint) + ')</span>' : '');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = value || ''; inp.placeholder = placeholder || '';
    inp.addEventListener('input', () => {
      if (!wingConfig.squadrons[sqIdx]) return;
      wingConfig.squadrons[sqIdx][fieldName] = inp.value;
      if (fieldName === 'id') {
        toggle.textContent = inp.value || '(sans id)';
        inp.classList.toggle('wing-id-warning', /[\s/]/.test(inp.value) && inp.value.length > 0);
      }
      persistWingConfig(); updateWingSizeCounter();
    });
    if (fieldName === 'id' && value) {
      inp.classList.toggle('wing-id-warning', /[\s/]/.test(value));
    }
    wrap.appendChild(lbl); wrap.appendChild(inp);
    return wrap;
  }

  const rowIdName = document.createElement('div'); rowIdName.className = 'ed-field-row';
  rowIdName.appendChild(makeField(t('editor.wing.identifier'), 'id', sq.id, 'SQN-01', t('editor.wing.identifierHint')));
  rowIdName.appendChild(makeField(t('editor.roster.callsignPlaceholder'), 'callsign', sq.callsign, 'ALPHA', ''));
  body.appendChild(rowIdName);
  body.appendChild(makeField(t('editor.wing.fullName'), 'name', sq.name, '1st Squadron', ''));

  const rowNick = document.createElement('div'); rowNick.className = 'ed-field-row';
  rowNick.appendChild(makeField(t('editor.wing.nickname'), 'nickname', sq.nickname, 'Demo', ''));
  body.appendChild(rowNick);

  const acWrap = document.createElement('div'); acWrap.className = 'ed-field';
  const acLbl = document.createElement('label'); acLbl.textContent = t('editor.phases.aircraft');
  const acTags = document.createElement('div'); acTags.className = 'wing-aircraft-tags';
  acWrap.appendChild(acLbl); acWrap.appendChild(acTags);
  body.appendChild(acWrap);
  renderSqAircraftTags(acTags, sqIdx);

  const logoWrap = document.createElement('div'); logoWrap.className = 'ed-field';
  const logoLbl = document.createElement('label');
  logoLbl.textContent = t('editor.wing.sqLogo');
  const logoZone = document.createElement('label');
  logoZone.className = 'ed-img-zone wing-logo-zone';
  logoWrap.appendChild(logoLbl); logoWrap.appendChild(logoZone);
  body.appendChild(logoWrap);
  refreshSqLogoZone(logoZone, sqIdx);

  card.appendChild(body);
  return card;
}

function renderWingSquadrons(openLastCard) {
  _saveWingOpenState();
  const list = document.getElementById('wing-squadrons-list');
  if (!list) return;
  list.innerHTML = '';
  wingConfig.squadrons.forEach((_, sqIdx) => {
    const card = renderWingSquadronCard(sqIdx);
    const isLast = openLastCard && (sqIdx === wingConfig.squadrons.length - 1);
    if (isLast || _wingOpenSqIds.has(wingConfig.squadrons[sqIdx].id)) {
      card.classList.add('open');
    }
    list.appendChild(card);
  });
  updateWingSizeCounter();
}

// ── Render wing editor inputs ──────────────────────────────────
function renderWingEditor() {
  const w = wingConfig.wing;
  const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  setVal('wing-shortName', w.shortName);
  setVal('wing-id',        w.id);
  setVal('wing-fullName',  w.fullName);
  setVal('wing-appTitle',  w.appTitle);
  setVal('wing-hqStamp',   w.hqStamp);
  refreshWingLogoZone();
  renderWingSquadrons();
  updateWingSizeCounter();
}

// ── Bind wing editor events (appelé une seule fois à l'init) ───────
function bindWingEditorEvents() {
  [
    ['wing-shortName', 'shortName'],
    ['wing-id',        'id'       ],
    ['wing-fullName',  'fullName' ],
    ['wing-appTitle',  'appTitle' ],
    ['wing-hqStamp',   'hqStamp'  ]
  ].forEach(([elId, field]) => {
    const inp = document.getElementById(elId);
    if (!inp) return;
    inp.addEventListener('input', () => {
      wingConfig.wing[field] = inp.value;
      if (field === 'id') {
        inp.classList.toggle('wing-id-warning', /[\s/]/.test(inp.value) && inp.value.length > 0);
      }
      persistWingConfig(); updateWingSizeCounter();
    });
    if (field === 'id') {
      inp.classList.toggle('wing-id-warning', /[\s/]/.test(inp.value) && inp.value.length > 0);
    }
  });

  refreshWingLogoZone();

  const btnAddSq = document.getElementById('wing-sq-add');
  if (btnAddSq) {
    btnAddSq.addEventListener('click', () => {
      wingConfig.squadrons.push({ id: '', name: '', nickname: '', callsign: '', aircraft: [], logo: '' });
      persistWingConfig();
      renderWingSquadrons(true);
      showToast(t('editor.wing.addedSquadron'));
    });
  }

  const importInp = document.getElementById('wing-import-input');
  if (importInp) {
    importInp.addEventListener('change', e => {
      if (e.target.files[0]) importWingConfig(e.target.files[0]);
      e.target.value = '';
    });
  }

  const btnExport = document.getElementById('wing-export-btn');
  if (btnExport) btnExport.addEventListener('click', exportWingConfig);

  const btnReset = document.getElementById('wing-reset-btn');
  if (btnReset) btnReset.addEventListener('click', resetWingConfig);
}

// ── Wing actions ───────────────────────────────────────────────
function exportWingConfig() {
  const blob = new Blob([JSON.stringify(wingConfig, null, 2)], { type: 'application/json' });
  const wid  = (wingConfig.wing.id || 'wing').toLowerCase().replace(/[\s/]+/g, '_');
  const fname = 'wing_config_' + wid + '_' + Date.now() + '.json';
  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], fname, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Config ' + wingConfig.wing.shortName, text: fname })
          .catch(() => fallbackDownload(blob, fname));
        return;
      }
    } catch (e) {}
  }
  fallbackDownload(blob, fname);
}

function fallbackDownload(blob, fname) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(t('toast.wingLoaded').replace(' — ', '') + ' ✓');
}

function importWingConfig(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const check  = validateWingConfig(parsed);
      if (!check.ok) {
        showToast(t('toast.wingInvalid') + check.errors.slice(0, 2).join(' · ') +
          (check.errors.length > 2 ? ' (+' + (check.errors.length - 2) + ')' : ''));
        return;
      }
      wingConfig = parsed;
      persistWingConfig();
      renderWingEditor();
      showToast(t('toast.wingLoaded') + escapeHtml(wingConfig.wing.shortName));
    } catch (e) {
      showToast(t('toast.wingJsonInvalid') + e.message);
    }
  };
  reader.onerror = () => showToast(t('toast.wingFileError'));
  reader.readAsText(file);
}

function resetWingConfig() {
  if (!confirm(t('editor.wing.resetConfirm'))) return;
  wingConfig = structuredClone(DEFAULT_WING_CONFIG);
  localStorage.removeItem(KEY_WING);
  renderWingEditor();
  showToast(t('toast.wingReset'));
}

// ── Toolbar events ─────────────────────────────────────────────
function initToolbarEvents() {
  document.getElementById('theme-select').addEventListener('change', e => {
    applyTheme(e.target.value);
  });
  document.getElementById('btn-lang').addEventListener('click', () => {
    setLang(CURRENT_LANG === 'fr' ? 'en' : 'fr');
  });
}


// =============================================================
//  P2 — DCS ENGINE (copié verbatim depuis Comm Plan Editor)
// =============================================================
const DCS_TOKENIZER = (() => {
  const T = { IDENT:'IDENT',LBRACE:'LBRACE',RBRACE:'RBRACE',LBRACKET:'LBRACKET',RBRACKET:'RBRACKET',EQ:'EQ',COMMA:'COMMA',SEMICOLON:'SEMICOLON',NUMBER:'NUMBER',STRING:'STRING',BOOL:'BOOL',NIL:'NIL',COMMENT:'COMMENT',EOF:'EOF' };
  function tokenize(src) {
    const tokens=[],errors=[];let offset=0,line=0,col=0;const len=src.length;
    function advance(){if(offset<len){if(src[offset]==='\n'){line++;col=0;}else{col++;}offset++;}}
    function skipWS(){while(offset<len&&' \t\r\n'.includes(src[offset]))advance();}
    function pos(){return{offset,line,col};}
    function readComment(s){let v='--';while(offset<len&&src[offset]!=='\n'){v+=src[offset];advance();}tokens.push({type:T.COMMENT,value:v,start:s,end:pos()});}
    function readNumber(s,f){let r=f;while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}if(offset<len&&src[offset]==='.'){r+='.';advance();while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}if(offset<len&&(src[offset]==='e'||src[offset]==='E')){r+=src[offset];advance();if(offset<len&&(src[offset]==='+'||src[offset]==='-')){r+=src[offset];advance();}while(offset<len&&/[0-9]/.test(src[offset])){r+=src[offset];advance();}}tokens.push({type:T.NUMBER,value:parseFloat(r),raw:r,start:s,end:pos()});}
    function readString(s,q){let v='';while(offset<len){const c=src[offset];if(c===q){advance();break;}if(c==='\\'){advance();const e=src[offset];if(e==='"')v+='"';else if(e==="'")v+="'";else if(e==='\\')v+='\\';else if(e==='n')v+='\n';else if(e==='t')v+='\t';else if(e==='r')v+='\r';else v+=e;advance();}else{v+=c;advance();}}tokens.push({type:T.STRING,value:v,start:s,end:pos()});}
    function readIdent(s,f){let r=f;while(offset<len&&/[a-zA-Z0-9_]/.test(src[offset])){r+=src[offset];advance();}if(r==='true')tokens.push({type:T.BOOL,value:true,raw:r,start:s,end:pos()});else if(r==='false')tokens.push({type:T.BOOL,value:false,raw:r,start:s,end:pos()});else if(r==='nil')tokens.push({type:T.NIL,value:null,raw:r,start:s,end:pos()});else tokens.push({type:T.IDENT,value:r,start:s,end:pos()});}
    while(offset<len){skipWS();if(offset>=len)break;const s=pos(),ch=src[offset];if(ch==='-'&&offset+1<len&&src[offset+1]==='-'){advance();advance();readComment(s);continue;}if(/[0-9]/.test(ch)){advance();readNumber(s,ch);continue;}if(ch==='-'&&offset+1<len&&/[0-9]/.test(src[offset+1])){advance();readNumber(s,'-');continue;}if(ch==='"'||ch==="'"){advance();readString(s,ch);continue;}if(/[a-zA-Z_]/.test(ch)){advance();readIdent(s,ch);continue;}switch(ch){case'{':advance();tokens.push({type:T.LBRACE,value:'{',start:s,end:pos()});break;case'}':advance();tokens.push({type:T.RBRACE,value:'}',start:s,end:pos()});break;case'[':advance();tokens.push({type:T.LBRACKET,value:'[',start:s,end:pos()});break;case']':advance();tokens.push({type:T.RBRACKET,value:']',start:s,end:pos()});break;case'=':advance();tokens.push({type:T.EQ,value:'=',start:s,end:pos()});break;case',':advance();tokens.push({type:T.COMMA,value:',',start:s,end:pos()});break;case';':advance();tokens.push({type:T.SEMICOLON,value:';',start:s,end:pos()});break;default:errors.push({message:'Token inattendu: '+JSON.stringify(ch),line:s.line,col:s.col,offset:s.offset});advance();tokens.push({type:'ERROR',value:ch,start:s,end:pos()});}}
    tokens.push({type:T.EOF,value:null,start:pos(),end:pos()});
    return{tokens,errors};
  }
  return{tokenize,T};
})();

// ═══════════════════════════════════════════════════════════════
// DCS_PARSER — Étape C : AST avec positions sources
//
// Chaque nœud porte pos = { start:{line,col,offset}, end:{line,col,offset} }
// (tous 0-based, end exclusif).
//
// Feuilles (number, string, bool, nil, ident) :
//   pos encadre la valeur brute — GUILLEMETS INCLUS pour les strings.
//   → lua.substring(pos.start.offset, pos.end.offset) redonne la valeur brute.
//
// Tables :
//   pos.start → '{', pos.end → après '}'.
//
// Paires (entries) :
//   entry.keyPos   → de '[' jusqu'après ']' (ou identifiant nu)
//   entry.valuePos → délégué à node.pos de la valeur
//
// Assignation racine :
//   pos couvre depuis 'mission' jusqu'après '}'.
// ═══════════════════════════════════════════════════════════════
const DCS_PARSER = (() => {

  class ParseError extends Error {
    constructor(msg, token) {
      super(msg);
      this.tokenLine   = token ? token.start.line + 1 : '?';
      this.tokenCol    = token ? token.start.col      : '?';
      this.tokenOffset = token ? token.start.offset   : '?';
    }
    toString() { return `ParseError L${this.tokenLine}:${this.tokenCol} — ${this.message}`; }
  }

  function parse(tokens) {
    const tks = tokens.filter(t => t.type !== 'COMMENT');
    let p = 0;

    function peek()    { return tks[p]; }
    function consume() { return tks[p++]; }

    function expect(type) {
      const tk = peek();
      if (!tk || tk.type !== type)
        throw new ParseError(
          `Attendu ${type}, obtenu ${tk ? tk.type + '(' + JSON.stringify(tk.value) + ')' : 'EOF'}`,
          tk
        );
      return consume();
    }

    function skipSep() {
      while (peek() && (peek().type === 'COMMA' || peek().type === 'SEMICOLON')) consume();
    }

    // Construire un objet pos à partir de deux tokens de borne
    function makePos(startTk, endTk) {
      return {
        start: { line: startTk.start.line, col: startTk.start.col, offset: startTk.start.offset },
        end:   { line: endTk.end.line,     col: endTk.end.col,     offset: endTk.end.offset     }
      };
    }

    function parseValue() {
      const tk = peek();
      if (!tk || tk.type === 'EOF') throw new ParseError('Valeur attendue, EOF atteint', tk);

      if (tk.type === 'NUMBER') { consume(); return { kind:'number', value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'STRING') { consume(); return { kind:'string', value:tk.value,                pos:makePos(tk,tk) }; }
      if (tk.type === 'BOOL')   { consume(); return { kind:'bool',   value:tk.value, raw:tk.raw,   pos:makePos(tk,tk) }; }
      if (tk.type === 'NIL')    { consume(); return { kind:'nil',                                   pos:makePos(tk,tk) }; }
      if (tk.type === 'LBRACE') { return parseTable(); }
      if (tk.type === 'IDENT')  { consume(); return { kind:'ident',  value:tk.value,               pos:makePos(tk,tk) }; }

      throw new ParseError(`Token inattendu comme valeur: ${tk.type}(${JSON.stringify(tk.value)})`, tk);
    }

    function parseTable() {
      const lbrace = expect('LBRACE');
      const entries = [];
      while (true) {
        skipSep();
        const tk = peek();
        if (!tk || tk.type === 'RBRACE' || tk.type === 'EOF') break;
        entries.push(parseEntry());
        skipSep();
      }
      const rbrace = expect('RBRACE');
      return { kind:'table', entries, pos: makePos(lbrace, rbrace) };
    }

    function parseEntry() {
      const tk = peek();

      // [N] = v  ou  ["clé"] = v
      if (tk.type === 'LBRACKET') {
        const lbrack = consume();
        const kt = peek();
        let key;
        if      (kt.type === 'NUMBER') { consume(); key = { kind:'int',    value:kt.value }; }
        else if (kt.type === 'STRING') { consume(); key = { kind:'string', value:kt.value }; }
        else throw new ParseError(`Clé invalide dans []: attendu NUMBER ou STRING, obtenu ${kt.type}`, kt);
        const rbrack = expect('RBRACKET');
        const keyPos = makePos(lbrack, rbrack);
        expect('EQ');
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // ident = v  (racine ou clé nue rare)
      if (tk.type === 'IDENT' && tks[p + 1] && tks[p + 1].type === 'EQ') {
        const it = consume();
        const key    = { kind:'ident', value:it.value };
        const keyPos = makePos(it, it);
        consume(); // EQ
        const value = parseValue();
        return { key, keyPos, value, valuePos: value.pos };
      }

      // Valeur sans clé (liste ordonnée)
      const value = parseValue();
      return { key:null, keyPos:null, value, valuePos: value.pos };
    }

    // Point d'entrée : "mission = { … }"
    const first = peek();
    let root;
    if (first.type === 'IDENT') {
      const nt = consume();
      expect('EQ');
      const value = parseValue();
      root = {
        kind: 'assignment', name: nt.value, value,
        pos:  { start: { line:nt.start.line, col:nt.start.col, offset:nt.start.offset },
                end:   value.pos.end }
      };
    } else if (first.type === 'LBRACE') {
      root = parseValue();
    } else {
      throw new ParseError(`Structure racine inattendue: ${first.type}`, first);
    }

    const eof = peek();
    if (eof.type !== 'EOF')
      throw new ParseError(`Contenu inattendu après table racine: ${eof.type}`, eof);

    return root;
  }

  return { parse, ParseError };
})();

const DCS_EXTRACTOR = (() => {

  // ── Utilitaires AST ──────────────────────────────────────────────────────
  function scalarVal(node) {
    if (!node) return undefined;
    if (node.kind==='number'||node.kind==='string'||node.kind==='bool'||node.kind==='ident') return node.value;
    if (node.kind==='nil') return null;
  }

  function get(tableNode, key) {
    if (!tableNode || tableNode.kind !== 'table') return undefined;
    for (const e of tableNode.entries) {
      if (!e.key) continue;
      if (typeof key === 'string' && (e.key.kind==='ident'||e.key.kind==='string') && e.key.value===key) return e.value;
      if (typeof key === 'number' && e.key.kind==='int' && e.key.value===key) return e.value;
    }
  }

  function posStr(pos) {
    if (!pos) return 'null';
    return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
  }

  // Normaliser une signature pour comparaison : tableau trié de {radioIndex,channelNumber}
  function sigKey(syncPositions) {
    return JSON.stringify(
      syncPositions
        .map(s => ({ r: s.radioIndex, c: s.channelNumber }))
        .sort((a,b) => a.r !== b.r ? a.r - b.r : a.c - b.c)
    );
  }

  // ── Extraction Radio[N] ──────────────────────────────────────────────────
  function extractRadio(radioIndexEntry) {
    const idx   = radioIndexEntry.key ? radioIndexEntry.key.value : null;
    const rNode = radioIndexEntry.value;
    if (!rNode || rNode.kind !== 'table') return null;

    const chansNode = get(rNode, 'channels');
    const modsNode  = get(rNode, 'modulations');
    const namesNode = get(rNode, 'channelsNames');

    const channels = {};
    if (chansNode && chansNode.kind==='table' && chansNode.entries.length > 0) {
      for (const ce of chansNode.entries) {
        if (!ce.key || ce.key.kind !== 'int') continue;
        const num = ce.key.value;
        channels[num] = { number: num, frequency: ce.value.value, frequencyPos: ce.value.pos };
      }
    }

    let modulations = null;
    if (modsNode && modsNode.kind==='table' && modsNode.entries.length > 0) {
      modulations = {};
      for (const me of modsNode.entries) {
        if (!me.key || me.key.kind !== 'int') continue;
        modulations[me.key.value] = { value: me.value.value, pos: me.value.pos };
      }
    }

    let channelsNames = null;
    if (namesNode && namesNode.kind==='table' && namesNode.entries.length > 0) {
      channelsNames = {};
      for (const ne of namesNode.entries) {
        if (!ne.key || ne.key.kind !== 'int') continue;
        channelsNames[ne.key.value] = { value: ne.value.value, pos: ne.value.pos };
      }
    }

    return {
      index: idx,
      channels,
      channelsNames,
      modulations,
      blockPos:             rNode.pos,
      channelsBlockPos:     chansNode ? chansNode.pos : null,
      channelsNamesBlockPos:namesNode ? namesNode.pos : null,
      modulationsBlockPos:  modsNode  ? modsNode.pos  : null,
    };
  }

  // ── Calcul des positions de synchronisation pour un slot ─────────────────
  // Retourne [{ radioIndex, channelNumber, frequency, modulation, frequencyPos, modulationPos }]
  function computeSyncPositions(radios, groupFrequency) {
    if (!radios || groupFrequency === null || groupFrequency === undefined) return [];
    const gfreq = groupFrequency;
    const result = [];
    for (const radio of radios) {
      for (const [numStr, ch] of Object.entries(radio.channels)) {
        if (Math.abs(ch.frequency - gfreq) < 1e-9) {
          const chnum = Number(numStr);
          const modEntry = radio.modulations ? radio.modulations[chnum] : null;
          result.push({
            radioIndex:     radio.index,
            channelNumber:  chnum,
            frequency:      ch.frequency,
            frequencyPos:   ch.frequencyPos,
            modulation:     modEntry ? modEntry.value : null,
            modulationPos:  modEntry ? modEntry.pos   : null,
          });
        }
      }
    }
    // Tri canonique : par (radioIndex ASC, channelNumber ASC)
    result.sort((a,b) => a.radioIndex !== b.radioIndex ? a.radioIndex - b.radioIndex : a.channelNumber - b.channelNumber);
    return result;
  }

  // ── Extraction unité ─────────────────────────────────────────────────────
  function extractUnit(unitNode) {
    const radioTableNode = get(unitNode, 'Radio');
    let radios       = null;
    let radioBlockPos= null;

    if (radioTableNode && radioTableNode.kind==='table') {
      radioBlockPos = radioTableNode.pos;
      radios = [];
      for (const re of radioTableNode.entries) {
        const r = extractRadio(re);
        if (r) radios.push(r);
      }
      radios.sort((a,b) => a.index - b.index);
    }

    const callsignNode = get(unitNode, 'callsign');
    let callsign = null;
    if (callsignNode) {
      if (callsignNode.kind === 'table') {
        callsign = {};
        for (const ce of callsignNode.entries) {
          if (!ce.key) continue;
          callsign[ce.key.value] = scalarVal(ce.value);
        }
      } else { callsign = scalarVal(callsignNode); }
    }

    const liveryNode = get(unitNode, 'livery_id');
    return {
      unitId:       scalarVal(get(unitNode,'unitId')),
      name:         scalarVal(get(unitNode,'name')),
      type:         scalarVal(get(unitNode,'type')),
      skill:        scalarVal(get(unitNode,'skill')),
      callsign,
      livery_id:    liveryNode ? liveryNode.value : undefined,
      liveryPos:    liveryNode ? liveryNode.pos   : null,   // P3 — patch livrée
      payloadPos:   (() => { const pn = get(unitNode, 'payload'); return pn ? pn.pos : null; })(),  // P4 — patch payload
      radios,
      radioBlockPos,
      syncPositions: null, // calculé en second passage
    };
  }

  // ── Extraction groupe ─────────────────────────────────────────────────────
  
function extractGroup(groupNode, coalition, category) {
  const g = extractGroup_ORIG(groupNode, coalition, category);
  if (!g) return g;
  // P4.2 — pointsPos : position du nœud route.points pour patch de remplacement
  const routeNode = get(groupNode, 'route');
  const pointsNode = routeNode ? get(routeNode, 'points') : null;
  g.pointsPos = pointsNode ? pointsNode.pos : null;
  return g;
}

function extractGroup_ORIG(groupNode, coalitionKey, category) {
    const freqNode = get(groupNode,'frequency');
    const modNode  = get(groupNode,'modulation');
    const frequency = freqNode ? {
      value:         freqNode.value,
      modulation:    modNode ? modNode.value : null,
      valuePos:      freqNode.pos,
      modulationPos: modNode ? modNode.pos : null,
    } : null;

    const group = {
      groupId:                 scalarVal(get(groupNode,'groupId')),
      name:                    scalarVal(get(groupNode,'name')),
      task:                    scalarVal(get(groupNode,'task')),
      coalition:               coalitionKey,
      category,
      frequency,
      hasFrequencyAtGroupLevel: !!freqNode,
      groupBlockPos:           groupNode.pos,
    };

    const unitsNode = get(groupNode,'units');
    const clientUnits = [];
    if (unitsNode && unitsNode.kind==='table') {
      for (const ue of unitsNode.entries) {
        const skillNode = get(ue.value,'skill');
        if (skillNode && skillNode.value==='Client') clientUnits.push(extractUnit(ue.value));
      }
    }
    return { group, clientUnits };
  }

  // ── Second passage : calcul syncPositions + typeConventions ──────────────
  function computeSyncAndConventions(clientGroups) {
    // 1. Calcul syncPositions par slot
    for (const slot of clientGroups) {
      const gfreq = slot.group.frequency ? slot.group.frequency.value : null;
      slot.unit.syncPositions = slot.unit.radios
        ? computeSyncPositions(slot.unit.radios, gfreq)
        : null;
    }

    // 2. typeConventions : regrouper les slots avec Radio par type
    //    Slots sans Radio exclus du calcul
    const typeMap = {}; // type → [ sigKey, ... ]
    for (const slot of clientGroups) {
      if (!slot.unit.radios) continue; // sans Radio : exclure
      const tp = slot.unit.type;
      const sk = sigKey(slot.unit.syncPositions || []);
      if (!typeMap[tp]) typeMap[tp] = [];
      typeMap[tp].push({ sk, sig: slot.unit.syncPositions || [] });
    }

    const typeConventions = {};
    for (const [tp, entries] of Object.entries(typeMap)) {
      const keys = entries.map(e => e.sk);
      const distinct = [...new Set(keys)];
      const isUniform = distinct.length === 1;

      if (isUniform) {
        // Signature canonique : la liste de {radioIndex,channelNumber} du premier slot
        const canonical = entries[0].sig.map(s => ({
          radioIndex:    s.radioIndex,
          channelNumber: s.channelNumber,
        }));
        typeConventions[tp] = {
          syncSignature: canonical,
          isUniform: true,
          slotCount: entries.length,
        };
      } else {
        // Non uniforme : lister les variants
        const variantMap = {};
        for (const e of entries) {
          if (!variantMap[e.sk]) {
            variantMap[e.sk] = {
              count: 0,
              signature: e.sig.map(s => ({ radioIndex:s.radioIndex, channelNumber:s.channelNumber })),
            };
          }
          variantMap[e.sk].count++;
        }
        typeConventions[tp] = {
          syncSignature: null,
          isUniform: false,
          slotCount: entries.length,
          variants: Object.values(variantMap),
        };
      }
    }

    return typeConventions;
  }

  // ── Diagnostics ───────────────────────────────────────────────────────────
  function buildDiagnostics(clientGroups) {
    const diagnostics = [];

    for (const slot of clientGroups) {
      const { group, unit } = slot;

      // GROUP_FREQ_MISSING
      if (!group.hasFrequencyAtGroupLevel) {
        diagnostics.push({
          severity: 'warning',
          code:     'GROUP_FREQ_MISSING',
          message:  `Groupe "${group.name}" (groupId ${group.groupId}) — pas de ["frequency"] au niveau groupe.`,
        });
        continue;
      }

      // RADIO_BLOCK_MISSING
      if (!unit.radios) {
        diagnostics.push({
          severity: 'info',
          code:     'RADIO_BLOCK_MISSING',
          message:  `Unité "${unit.name}" (${unit.type}, groupId ${group.groupId}) — pas de bloc ["Radio"].`,
        });
        continue;
      }

      // EMPTY_RADIO_CHANNELS
      for (const r of unit.radios) {
        if (Object.keys(r.channels).length === 0) {
          diagnostics.push({
            severity: 'info',
            code:     'EMPTY_RADIO_CHANNELS',
            message:  `Unité "${unit.name}" (${unit.type}) — Radio[${r.index}].channels vide.`,
          });
        }
      }

      const sync  = unit.syncPositions || [];
      const gfreq = group.frequency.value;
      const modVal = group.frequency.modulation;
      const modStr = modVal === 0 ? 'AM' : modVal === 1 ? 'FM' : String(modVal);

      if (sync.length > 0) {
        // GROUP_FREQ_SYNC_DETECTED
        const lines = [
          `Groupe "${group.name}" (groupId ${group.groupId}), unité "${unit.name}" (${unit.type}) :`,
          `  group.frequency  @ ${posStr(group.frequency.valuePos)} = ${gfreq}`,
          `  group.modulation @ ${posStr(group.frequency.modulationPos)} = ${modVal} (${modStr})`,
        ];
        for (const sp of sync) {
          lines.push(`  ↔ Radio[${sp.radioIndex}].channels[${sp.channelNumber}] @ ${posStr(sp.frequencyPos)} = ${sp.frequency}`);
        }
        lines.push(`  (${sync.length} canal${sync.length > 1 ? 'x' : ''} synchronisé${sync.length > 1 ? 's' : ''})`);
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_SYNC_DETECTED',
          message:  lines.join('\n'),
        });
      } else {
        // GROUP_FREQ_NOT_IN_CHANNELS
        const radioSummary = unit.radios
          .map(r => `Radio[${r.index}] (${Object.keys(r.channels).length} canaux)`)
          .join(', ');
        diagnostics.push({
          severity: 'info',
          code:     'GROUP_FREQ_NOT_IN_CHANNELS',
          message:  [
            `Groupe "${group.name}", unité "${unit.name}" (${unit.type}) :`,
            `  group.frequency = ${gfreq} (n'est présente dans aucun canal radio)`,
            `  ${radioSummary} — aucun match`,
          ].join('\n'),
        });
      }
    }

    return diagnostics;
  }

  // ── Point d'entrée principal ──────────────────────────────────────────────
  function extract(ast, src, mizFilename, otherFilesMap, precomputedLines) {
    const missionTable = ast.kind==='assignment' ? ast.value : ast;
    const lines        = precomputedLines || src.split('\n');
    const clientGroups = [];

    const coalNode = get(missionTable,'coalition');
    if (coalNode) {
      for (const coalKey of ['blue','red','neutrals']) {
        const coalSide   = get(coalNode, coalKey);     if (!coalSide)   continue;
        const countryTbl = get(coalSide, 'country');   if (!countryTbl || countryTbl.kind!=='table') continue;

        for (const ce of countryTbl.entries) {
          for (const category of ['helicopter','plane']) {
            const catNode   = get(ce.value, category); if (!catNode)   continue;
            const groupList = get(catNode,  'group');  if (!groupList || groupList.kind!=='table') continue;

            for (const ge of groupList.entries) {
              const { group, clientUnits } = extractGroup(ge.value, coalKey, category);
              for (const unit of clientUnits) {
                clientGroups.push({ coalition: coalKey, category, group, unit });
              }
            }
          }
        }
      }
    }

    // Second passage : sync positions + type conventions
    const typeConventions = computeSyncAndConventions(clientGroups);

    // Diagnostics
    const diagnostics = buildDiagnostics(clientGroups);

    // otherFiles : map filename → { size, data:Uint8Array }
    // Les données brutes sont dans otherFilesMap (passé depuis le harness)
    const otherFilesSummary = otherFilesMap
      ? Object.fromEntries(
          Object.entries(otherFilesMap).map(([name, data]) => [name, { size: data.length }])
        )
      : null;

    return {
      source: {
        _text:  src,    // usage interne — non sérialisé
        _lines: lines,
        summary: { textLength: src.length, lineCount: lines.length },
        miz: {
          filename:   mizFilename,
          otherFiles: otherFilesSummary, // { filename: { size } }
          _otherFilesData: otherFilesMap, // Uint8Arrays bruts pour v1.0.0
        },
      },
      clientGroups,
      typeConventions,
      diagnostics,
    };
  }

  // ── Sérialisation display (omit champs _, tronquer pos) ──────────────────
  function serialize(model, limit) {
    const slots = limit != null ? model.clientGroups.slice(0, limit) : model.clientGroups;
    function shortenPos(pos) {
      if (!pos) return null;
      return `L${pos.start.line+1}:${pos.start.col}-${pos.end.col}@${pos.start.offset}`;
    }
    function process(obj, depth) {
      if (depth > 12 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return shortenPos(obj);
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) {
        if (k.startsWith('_')) continue;
        out[k] = process(v, depth+1);
      }
      return out;
    }
    return JSON.stringify(slots.map(s => process(s, 0)), null, 2);
  }

  function serializeTypeConventions(model) {
    function process(obj, depth) {
      if (depth > 6 || obj === null || obj === undefined) return obj;
      if (typeof obj !== 'object') return obj;
      if (obj.start && obj.end && 'offset' in obj.start) return `L${obj.start.line+1}:${obj.start.col}@${obj.start.offset}`;
      if (Array.isArray(obj)) return obj.map(v => process(v, depth+1));
      const out = {};
      for (const [k,v] of Object.entries(obj)) { if (!k.startsWith('_')) out[k] = process(v, depth+1); }
      return out;
    }
    return JSON.stringify(process(model.typeConventions, 0), null, 2);
  }

  return { extract, serialize, serializeTypeConventions, posStr };
})();
