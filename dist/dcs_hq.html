//  P2 — ÉTAT MISSION
// =============================================================
const KEY_SNAPSHOT = 'mission_snapshot_v1';
let HQ_SNAPSHOT = null;   // Mission JSON courant
let _mizFilename = null;

// =============================================================
//  P2.2 — FINGERPRINT (sha256 avec repli cyrb53)
// =============================================================
async function computeFingerprint(text) {
  const enc = new TextEncoder();
  const data = enc.encode(text);
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', data);
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
      return 'sha256:' + hex;
    } catch(e) { /* repli cyrb53 */ }
  }
  // Repli cyrb53 — déterministe, non-crypto, préfixe distinct
  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  return 'cyrb53:' + cyrb53(text).toString(16);
}

// =============================================================
//  P2.3 — TABLE PRESETS NUAGES DCS
// =============================================================
const DCS_CLOUD_PRESETS = {
  'Preset1':  'FEW070',   'Preset2':  'FEW080',   'Preset3':  'SCT080',
  'Preset4':  'SCT100',   'Preset5':  'SCT120',   'Preset6':  'SCT140',
  'Preset7':  'BKN070',   'Preset8':  'BKN080',   'Preset9':  'BKN100',
  'Preset10': 'BKN120',   'Preset11': 'OVC070',   'Preset12': 'OVC100',
  'Preset13': 'OVC120',   'Preset14': 'OVC140',
  'RainyPreset1': 'OVC010',
  'RainyPreset2': 'OVC010',
  'RainyPreset3': 'OVC010',
};

// =============================================================
//  P2.3 — CONVERSION MÉTÉO → METAR
// =============================================================
function mizWeatherToMetar(wx, dateObj, startTime, theatre) {
  const month  = String(dateObj.Month  || 1).padStart(2,'0');
  const day    = String(dateObj.Day    || 1).padStart(2,'0');
  const hh     = String(Math.floor((startTime || 0) / 3600)).padStart(2,'0');
  const mm     = String(Math.floor(((startTime || 0) % 3600) / 60)).padStart(2,'0');
  const dtg    = day + hh + mm + 'Z';
  const icao   = (theatre === 'Syria' ? 'OS' : 'ZZZZ') + 'XX';  // placeholder
  // Vent — DCS stocke la direction "vers où ça souffle", METAR veut "venant de"
  const windSpeed  = wx.wind && wx.wind.atGround ? (wx.wind.atGround.speed || 0) : 0;
  const windDirDCS = wx.wind && wx.wind.atGround ? (wx.wind.atGround.dir   || 0) : 0;
  const windDir    = Math.round(((windDirDCS + 180) % 360) / 10) * 10;
  const windKt     = Math.round(windSpeed * 1.944);
  let windPart;
  if (windKt < 1) {
    windPart = '00000KT';
  } else {
    windPart = String(windDir).padStart(3,'0') + String(windKt).padStart(2,'0') + 'KT';
  }
  // Visibilité
  const vis = wx.visibility ? (wx.visibility.distance || 9999) : 9999;
  const cavok = vis >= 9999 && !(wx.enable_fog) && !(wx.clouds && wx.clouds.preset);
  let visPart = cavok ? 'CAVOK' : (vis >= 9999 ? '9999' : String(Math.round(vis / 100) * 100).padStart(4,'0'));
  // Nuages
  let cloudPart = '';
  if (!cavok) {
    const preset = wx.clouds && wx.clouds.preset;
    if (preset && DCS_CLOUD_PRESETS[preset]) {
      cloudPart = DCS_CLOUD_PRESETS[preset];
    } else if (wx.clouds && wx.clouds.density > 0) {
      const baseFt = Math.round((wx.clouds.base || 0) / 0.3048 / 100) * 100;
      const baseStr = String(Math.round(baseFt / 100)).padStart(3,'0');
      const cover = wx.clouds.density >= 8 ? 'OVC' : wx.clouds.density >= 5 ? 'BKN' : wx.clouds.density >= 3 ? 'SCT' : 'FEW';
      cloudPart = cover + baseStr;
    } else {
      cloudPart = 'NSC';
    }
  }
  // Fog
  let fogPart = '';
  if (wx.enable_fog && wx.fog && wx.fog.visibility > 0) {
    fogPart = wx.fog.visibility < 1000 ? 'FG' : 'BR';
    visPart = String(wx.fog.visibility).padStart(4,'0');
  }
  // Dust
  let dustPart = '';
  if (wx.enable_dust && wx.dust_density > 0) {
    dustPart = wx.dust_density > 2000 ? 'SS' : 'DU';
  }
  // Temp
  const temp = Math.round(wx.season && wx.season.temperature !== undefined ? wx.season.temperature : 15);
  const tempStr = (temp < 0 ? 'M' + String(-temp).padStart(2,'0') : String(temp).padStart(2,'0')) + '/XX';
  // QNH
  const qnh = Math.round((wx.qnh || 760) * 1.333);
  const qnhStr = 'Q' + String(qnh).padStart(4,'0');
  // Assemblage
  const parts = [icao, dtg, windPart];
  if (!cavok) {
    parts.push(visPart);
    if (fogPart) parts.push(fogPart);
    if (dustPart) parts.push(dustPart);
    if (cloudPart) parts.push(cloudPart);
  } else {
    parts.push('CAVOK');
  }
  parts.push(tempStr, qnhStr);
  return parts.join(' ');
}

// =============================================================
//  P2.1 — PIPELINE DE CHARGEMENT .MIZ
// =============================================================
function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith('.miz')) {
    showToast(t('toast.mizNotMiz'));
    return;
  }
  loadMiz(file);
}

async function loadMiz(file) {
  showToast(t('toast.mizLoading'));
  _mizFilename = file.name;
  try {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const missionEntry = zip.file('mission');
    if (!missionEntry) throw new Error('Fichier "mission" introuvable dans le .miz');
    const missionText = await missionEntry.async('string');
    // Lire theatre
    const theatreEntry = zip.file('theatre');
    const theatre = theatreEntry ? (await theatreEntry.async('string')).trim() : 'Unknown';
    // P3 — charger otherFiles (rezip sans corruption)
    const otherFilesMap = {};
    for (const name of Object.keys(zip.files)) {
      if (!zip.files[name].dir && name !== 'mission') {
        otherFilesMap[name] = await zip.file(name).async('uint8array');
      }
    }
    // Parse
    const { tokens } = DCS_TOKENIZER.tokenize(missionText);
    const ast          = DCS_PARSER.parse(tokens);
    // Extraction via DCS_EXTRACTOR HQ (avec liveryPos P3)
    const model = DCS_EXTRACTOR.extract(ast, missionText, file.name, otherFilesMap, missionText.split('\n'));
    // P3 — stocker contexte complet pour le pipeline de patch
    _HQ_MIZ_CONTEXT = { missionText, ast, model, otherFilesMap, theatre };
    // Construire le Mission JSON
    const snapshot = await buildMissionSnapshot(ast, model, missionText, file.name, theatre);
    HQ_SNAPSHOT = snapshot;
    persistSnapshot();
    renderSnapshot(snapshot);
    showToast(t('toast.mizLoaded'));
    console.log('[HQ P3] Snapshot:', snapshot);
  } catch(err) {
    showToast(t('toast.mizError') + err.message);
    console.error('[HQ P3] loadMiz error:', err);
  }
}

// =============================================================
//  P4.2 — HELPERS EXTRACTION ROUTE + PAYLOAD DEPUIS AST
// =============================================================

// _astGetKey : accès à une clé dans un nœud table AST
function _astGetKey(node, key) {
  if (!node || node.kind !== 'table') return null;
  const e = node.entries.find(e => e.key && String(e.key.value) === String(key));
  return e ? e.value : null;
}

// _extractFromAst : extrait route.pointsPos, payload par groupId + unitId depuis l'AST
// Retourne: { pointsNode, pointsPos, unitPayloads: {unitId: {payloadNode, payloadPos}} }
function _extractRouteAndPayloads(ast, targetGroupId) {
  const missionTable = ast.kind === 'assignment' ? ast.value : ast;
  const coalition = _astGetKey(missionTable, 'coalition');
  if (!coalition) return null;
  for (const coalEntry of coalition.entries) {
    const coalNode = coalEntry.value;
    const country = _astGetKey(coalNode, 'country');
    if (!country) continue;
    for (const countryEntry of country.entries) {
      const c = countryEntry.value;
      if (!c) continue;
      for (const catKey of ['helicopter', 'plane']) {
        const cat = _astGetKey(c, catKey);
        const grpList = cat ? _astGetKey(cat, 'group') : null;
        if (!grpList) continue;
        for (const ge of grpList.entries) {
          const g = ge.value;
          const gidNode = _astGetKey(g, 'groupId');
          if (!gidNode || gidNode.value !== targetGroupId) continue;
          // Trouvé
          const route = _astGetKey(g, 'route');
          const pointsNode = route ? _astGetKey(route, 'points') : null;
          const unitPayloads = {};
          const units = _astGetKey(g, 'units');
          if (units) {
            for (const ue of units.entries) {
              const u = ue.value;
              const uid = _astGetKey(u, 'unitId');
              const payloadNode = _astGetKey(u, 'payload');
              if (uid && payloadNode) {
                unitPayloads[uid.value] = { payloadNode, payloadPos: payloadNode.pos };
              }
            }
          }
          return {
            pointsNode,
            pointsPos: pointsNode ? pointsNode.pos : null,
            unitPayloads,
          };
        }
      }
    }
  }
  return null;
}

// =============================================================
//  P2.2 — CONSTRUCTION DU MISSION JSON
// =============================================================
async function buildMissionSnapshot(ast, model, missionText, filename, theatre) {
  // Helper AST pour lire au top level
  function getMissionValue(keyPath) {
    const missionTable = ast.kind === 'assignment' ? ast.value : ast;
    let node = missionTable;
    for (const k of keyPath) {
      if (!node || node.kind !== 'table') return undefined;
      const entry = node.entries.find(e => e.key && e.key.value === k);
      if (!entry) return undefined;
      node = entry.value;
    }
    return node;
  }
  function scalarOf(node) {
    if (!node) return undefined;
    if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident') return node.value;
    return undefined;
  }
  function tableToObj(node) {
    if (!node || node.kind !== 'table') return {};
    const obj = {};
    for (const e of node.entries) {
      if (e.key) obj[e.key.value] = e.value && (e.value.kind === 'table') ? tableToObj(e.value) : scalarOf(e.value);
    }
    return obj;
  }
  // Date et start_time
  const dateNode = getMissionValue(['date']);
  const dateObj  = dateNode ? tableToObj(dateNode) : { Year:2020, Month:1, Day:1 };
  const startTimeNode = getMissionValue(['start_time']);
  const startTime = startTimeNode ? scalarOf(startTimeNode) : 0;
  const missionDate = (dateObj.Year || 2020) + '-' +
    String(dateObj.Month || 1).padStart(2,'0') + '-' +
    String(dateObj.Day   || 1).padStart(2,'0');
  // Fingerprint
  const fingerprint = await computeFingerprint(missionText);
  // Weather
  const wxNode = getMissionValue(['weather']);
  const wxRaw  = wxNode ? tableToObj(wxNode) : {};
  const metar  = mizWeatherToMetar(wxRaw, dateObj, startTime, theatre);
  const weather = {
    raw:  wxRaw,
    metar: metar,
    windDir:   wxRaw.wind && wxRaw.wind.atGround ? Math.round(((wxRaw.wind.atGround.dir + 180) % 360)) : 0,
    windKt:    wxRaw.wind && wxRaw.wind.atGround ? Math.round(wxRaw.wind.atGround.speed * 1.944) : 0,
    qnhHpa:    Math.round((wxRaw.qnh || 760) * 1.333),
    tempC:     wxRaw.season ? (wxRaw.season.temperature || 15) : 15,
    visM:      wxRaw.visibility ? (wxRaw.visibility.distance || 9999) : 9999,
  };
  // Vols clients — regroupement par groupId (FIX 3 : contrat slot.unit)
  // Helper : lire la valeur d'une clé dans un nœud AST table
  function _astGet(node, key) {
    if (!node || node.kind !== 'table') return null;
    const entry = node.entries.find(e => e.key && String(e.key.value) === String(key));
    return entry ? entry.value : null;
  }
  function _astScalar(node) {
    if (!node) return undefined;
    if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident') return node.value;
    return undefined;
  }
  // Parcours AST léger pour compter les waypoints par groupId
  function _routeCounts(ast) {
    const counts = {};
    const missionNode = ast.kind === 'assignment' ? ast.value : ast;
    const coalitionNode = _astGet(missionNode, 'coalition');
    if (!coalitionNode) return counts;
    for (const coalEntry of coalitionNode.entries) {
      const coalNode = coalEntry.value;
      if (!coalNode || coalNode.kind !== 'table') continue;
      for (const countryEntry of ((_astGet(coalNode, 'country') || {}).entries || [])) {
        const countryNode = countryEntry.value;
        if (!countryNode || countryNode.kind !== 'table') continue;
        for (const catKey of ['helicopter', 'plane']) {
          const catNode = _astGet(countryNode, catKey);
          const groupListNode = catNode ? _astGet(catNode, 'group') : null;
          if (!groupListNode || groupListNode.kind !== 'table') continue;
          for (const grpEntry of groupListNode.entries) {
            const grpNode = grpEntry.value;
            if (!grpNode || grpNode.kind !== 'table') continue;
            const gidNode = _astGet(grpNode, 'groupId');
            const routeNode = _astGet(grpNode, 'route');
            const pointsNode = routeNode ? _astGet(routeNode, 'points') : null;
            const gid = _astScalar(gidNode);
            if (gid !== undefined) counts[gid] = pointsNode ? pointsNode.entries.length : 0;
          }
        }
      }
    }
    return counts;
  }
  const routeCounts = _routeCounts(ast);

  // Regroupement des slots par groupId (1 slot = 1 unité cliente)
  const groupMap = {};
  for (const slot of (model.clientGroups || [])) {
    const g = slot.group;
    const u = slot.unit;
    if (!u) continue;
    const gid = g.groupId;
    if (!groupMap[gid]) {
      groupMap[gid] = {
        group: g,
        units: [],
      };
    }
    // Callsign lisible
    let cs = '';
    if (typeof u.callsign === 'object' && u.callsign) {
      cs = u.callsign.name || u.callsign[1] || u.name || '';
    } else {
      cs = u.callsign || u.name || '';
    }
    // Radios — canaux {num: freq}
    const radios = (u.radios || []).map(r => ({
      radioIndex: r.index,
      channels:   r.channels ? Object.fromEntries(
        Object.entries(r.channels).map(([k, ch]) => [k, typeof ch === 'object' ? ch.frequency : ch])
      ) : {},
    }));
    groupMap[gid].units.push({
      unitId:   u.unitId,
      name:     u.name || '',
      type:     u.type || '',
      callsign: cs,
      liveryId: u.livery_id || '',
      radios:   radios,
      payload:  { summary: '' },
    });
  }

  const flights = Object.values(groupMap).map(gd => {
    const g = gd.group;
    const units = gd.units;
    // P4.2 — Extraire route.points et payloads complets depuis l'AST
    const rpData = _extractRouteAndPayloads(ast, g.groupId);
    const routePoints = (rpData && rpData.pointsNode) ? astToValue(rpData.pointsNode) : null;
    const unitsFull = units.map(u => {
      const payData = rpData && rpData.unitPayloads && rpData.unitPayloads[u.unitId];
      const payloadFull = payData ? astToValue(payData.payloadNode) : null;
      return Object.assign({}, u, {
        payload: payloadFull || { summary: '' },
      });
    });
    return {
      groupId:        g.groupId,
      groupName:      g.name || '',
      coalition:      g.coalition || '',
      category:       g.category || '',
      aircraftType:   units.length ? (units[0].type || units[0].name || '') : '',
      groupFrequency: g.frequency ? { value: g.frequency.value, modulation: g.frequency.modulation } : null,
      route:          { pointCount: routeCounts[g.groupId] || 0, points: routePoints },
      units:          unitsFull,
    };
  });
  return {
    schema: 'dcs-mission-snapshot-v1',
    sourceMission: {
      filename:    filename,
      theatre:     theatre,
      missionDate: missionDate,
      startTime:   startTime,
      fingerprint: fingerprint,
    },
    weather: weather,
    flights: flights,
  };
}

//  P2.3 — PERSISTANCE SNAPSHOT
// =============================================================
function persistSnapshot() {
  if (!HQ_SNAPSHOT) return;
  try {
    localStorage.setItem(KEY_SNAPSHOT, JSON.stringify(HQ_SNAPSHOT));
  } catch(e) { console.warn('[HQ] Snapshot persist error:', e); }
}

function loadPersistedSnapshot() {
  try {
    const raw = localStorage.getItem(KEY_SNAPSHOT);
    if (raw) {
      HQ_SNAPSHOT = JSON.parse(raw);
      renderSnapshot(HQ_SNAPSHOT);
    }
  } catch(e) { console.warn('[HQ] Snapshot restore error:', e); }
}

// =============================================================
//  P2.3 — EXPORT SNAPSHOT JSON
// =============================================================
function exportSnapshot() {
  if (!HQ_SNAPSHOT) return;
  const fname = (_mizFilename || 'mission').replace(/\.miz$/i,'') + '_snapshot.json';
  const blob = new Blob([JSON.stringify(HQ_SNAPSHOT, null, 2)], { type: 'application/json' });
  if (navigator.share && navigator.canShare) {
    try {
      const f = new File([blob], fname, { type: 'application/json' });
      if (navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: fname, text: fname })
          .catch(() => fallbackDownloadSnap(blob, fname));
        return;
      }
    } catch(e) {}
  }
  fallbackDownloadSnap(blob, fname);
}

function fallbackDownloadSnap(blob, fname) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(t('toast.snapshotExported'));
}

  const el = document.getElementById('snapshot-display');

  const sm = snap.sourceMission;
  const wx = snap.weather;
  const h = escapeHtml;

  html += ' &nbsp;·&nbsp; ' + h(t('snap.date')) + ': ' + h(sm.missionDate || '');
  const startHH = Math.floor((sm.startTime || 0) / 3600);
  const startMM = Math.floor(((sm.startTime || 0) % 3600) / 60);
  html += ' &nbsp;·&nbsp; ' + h(t('snap.startTime')) + ': ' + String(startHH).padStart(2,'0') + 'h' + String(startMM).padStart(2,'0');
  html += '</div>';
  // Météo
  html += '<div class="snap-header">' + h(t('snap.weather')) + '</div>';
  html += '<div class="snap-metar">' + h(wx.metar || '') + '</div>';
  html += '<div class="snap-meta">';
  html += 'Vent: ' + wx.windDir + '° · ' + wx.windKt + 'kt';
  html += ' &nbsp;·&nbsp; QNH: ' + wx.qnhHpa + ' hPa';
  html += ' &nbsp;·&nbsp; T°: ' + wx.tempC + '°C';
  html += ' &nbsp;·&nbsp; Vis: ' + (wx.visM >= 9999 ? 'CAVOK' : wx.visM + 'm');
  html += '</div>';
  // Vols
  html += '<div class="snap-header">' + h(t('snap.flights')) + ' (' + snap.flights.length + ')</div>';
  html += '<div class="snap-flight-list">';
  for (const fl of snap.flights) {
    html += '<div class="snap-flight">';
    html += '<div class="snap-flight-header">';
    html += h(fl.groupName || '—');
    html += ' <span class="snap-flight-tag">' + h(fl.aircraftType || fl.category || '') + '</span>';
    html += ' <span class="snap-flight-tag">' + h(fl.coalition || '') + '</span>';
    if (fl.groupFrequency && fl.groupFrequency.value) {
      html += ' <span class="snap-flight-tag">' + h(String(fl.groupFrequency.value)) + ' MHz</span>';
    }
    html += ' <span class="snap-flight-tag">' + h(String(fl.units.length)) + ' ' + h(t('snap.units')) + '</span>';
    html += '</div>';
    html += '<div class="snap-unit-list">';
    for (const u of fl.units) {
      html += '<div class="snap-unit-row">';
      html += '<span class="snap-unit-cs">' + h(u.callsign || u.name || '—') + '</span>';
      if (u.liveryId) html += ' <span class="snap-unit-livery">' + h(u.liveryId) + '</span>';
      for (const r of (u.radios || [])) {
        const ch1 = r.channels && r.channels[1] ? r.channels[1] : null;
        const ch2 = r.channels && r.channels[2] ? r.channels[2] : null;
        const fmtCh = (v) => (typeof v === 'number' && v >= 1e6) ? (Math.round(v/1e3)/1e3 + ' MHz') : String(v);
        if (ch1) html += ' <span class="snap-unit-radio">R' + h(String(r.radioIndex)) + ' CH1:' + h(fmtCh(ch1)) + '</span>';
        if (ch2) html += ' <span class="snap-unit-radio">CH2:' + h(fmtCh(ch2)) + '</span>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  // Fingerprint
  html += '<div class="snap-fingerprint">' + h(t('snap.fingerprint')) + ': ' + h(sm.fingerprint || '') + '</div>';
  el.innerHTML = html;
  el.style.display = 'block';
  // Afficher boutons actions
  const actionsEl = document.getElementById('miz-actions');
  if (actionsEl) actionsEl.style.display = 'flex';
  // Mettre à jour drop-zone
  const dz = document.getElementById('miz-drop-zone');
  if (dz) {
    dz.classList.add('has-file');
    document.getElementById('miz-drop-text').textContent = _mizFilename || '';
  }
}

// =============================================================
//  P2.1 — ÉVÉNEMENTS SECTION MISSION
// =============================================================
function initMissionEvents() {
  const dropZone = document.getElementById('miz-drop-zone');
  const fileInput = document.getElementById('miz-file-input');
  if (dropZone) {
    dropZone.addEventListener('click', () => fileInput && fileInput.click());
    dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput && fileInput.click(); } });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('dragover');
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files[0]) handleFile(files[0]);
    });
  }
  if (fileInput) {
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
      e.target.value = '';
    });
  }
  const exportBtn = document.getElementById('miz-export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportSnapshot);
  const reloadBtn = document.getElementById('miz-reload-btn');
  if (reloadBtn) {
    reloadBtn.addEventListener('click', () => {
      HQ_SNAPSHOT = null; _mizFilename = null;
      const dz = document.getElementById('miz-drop-zone');
      if (dz) { dz.classList.remove('has-file'); }
      const dropText = document.getElementById('miz-drop-text');
      if (dropText) { dropText.textContent = t('editor.mission.drop'); }
      const actEl = document.getElementById('miz-actions');
      if (actEl) actEl.style.display = 'none';
      const snapEl = document.getElementById('snapshot-display');
      if (snapEl) { snapEl.style.display = 'none'; snapEl.innerHTML = ''; }
    });
  }
}

// =============================================================
//  P4.1 — SÉRIALISEUR LUA + astToValue
// =============================================================

// astToValue : nœud AST → valeur JS pure (P4)
function astToValue(node) {
  if (!node) return undefined;
  if (node.kind === 'number' || node.kind === 'string' || node.kind === 'bool' || node.kind === 'ident')
    return node.value;
  if (node.kind === 'nil') return null;
  if (node.kind === 'table') {
    const obj = {};
    for (const e of node.entries) {
      if (!e.key) continue;
      const v = astToValue(e.value);
      if (v !== undefined) obj[e.key.value] = v;
    }
    return obj;
  }
  return undefined;
}

// formatLuaNumber : nombre → chaîne décimale sans notation exponentielle (P4)
function formatLuaNumber(n) {
  if (!isFinite(n)) return String(n);
  if (Number.isInteger(n)) return String(n);
  // toPrecision(17) pour précision double complète
  let s = n.toPrecision(17);
  if (s.includes('e') || s.includes('E')) {
    // Reformater en décimal plein
    s = n.toFixed(15).replace(/\.?0+$/, '');
    if (!s.includes('.')) s = s + '.0';
  } else {
    // Supprimer les zéros trailing
    s = s.replace(/\.?0+$/, '');
    if (s.endsWith('.')) s = s.slice(0, -1);
  }
  return s;
}

// serializeLua : valeur JS → texte Lua DCS-valide (P4)
function serializeLua(val, indent) {
  indent = (indent === undefined) ? 0 : indent;
  const tab  = '	'.repeat(indent);
  const tab1 = '	'.repeat(indent + 1);
  if (val === null || val === undefined) return null;
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (typeof val === 'number') return formatLuaNumber(val);
  if (typeof val === 'string') {
    const esc = val.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
    return '"' + esc + '"';
  }
  if (typeof val !== 'object') return null;
  const entries = Object.entries(val);
  if (entries.length === 0) return '{}';
  let out = '{\n';
  for (const [k, v] of entries) {
    const vs = serializeLua(v, indent + 1);
    if (vs === null) continue;
    const ks = (/^\d+$/.test(String(k))) ? '[' + k + ']' : '["' + k + '"]';
    out += tab1 + ks + ' = ' + vs + ', -- end of ' + ks + '\n';
  }
  out += tab + '}';
  return out;
}

// deepEqValues : comparaison structurelle de valeurs (P4 round-trip + verifyPatch)
function deepEqValues(a, b) {
  if (a === null && b === null) return true;
  if (typeof a !== typeof b) return false;
  if (typeof a === 'number') return Math.abs(a - b) / (Math.abs(a) + 1e-10) < 1e-9;
  if (typeof a !== 'object') return a === b;
  if (a === null || b === null) return a === b;
  const ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
  if (JSON.stringify(ka) !== JSON.stringify(kb)) return false;
  return ka.every(k => deepEqValues(a[k], b[k]));
}

// =============================================================
//  P3 — PATCH PIPELINE (applyPatches verbatim CPE + pipeline HQ)
// =============================================================

// État .miz courant (peuplé par loadMiz P3)
let _HQ_MIZ_CONTEXT = null;  // { missionText, ast, model, otherFilesMap, theatre }

// P3.1 — Fonctions verbatim CPE (injectées via placeholders)
function applyPatches(srcText, patches) {
  let result = srcText;
  for (const p of patches) {
    result = result.substring(0, p.pos.start.offset) + p.newValueStr + result.substring(p.pos.end.offset);
  }
  return result;
}
function retokenizeSafety(patchedSrc) {
  const t0 = performance.now();
  const { tokens, errors } = DCS_TOKENIZER.tokenize(patchedSrc);
  const elapsed = Math.round(performance.now() - t0);
  if (errors.length > 0) {
    throw new Error('Retokenize failed: ' + errors[0].message + ' L' + (errors[0].line+1) + ':C' + (errors[0].col+1));
  }
  console.log('[Save] Retokenize OK : 0 erreurs, ' + tokens.length.toLocaleString() + ' tokens, ' + elapsed + ' ms');
}
async function rebuildMiz(patchedSrc, model) {
  const newZip = new JSZip();
  newZip.file('mission', patchedSrc);
  const otherFiles = model.source.miz._otherFilesData;
  if (otherFiles) {
    Object.entries(otherFiles).forEach(function([name, data]) { newZip.file(name, data); });
  }
  return newZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

// Adapter rebuildMiz pour HQ (otherFiles vient de _HQ_MIZ_CONTEXT)
async function rebuildMizHQ(patchedSrc) {
  if (!_HQ_MIZ_CONTEXT) throw new Error('Pas de contexte .miz chargé');
  const newZip = new JSZip();
  newZip.file('mission', patchedSrc);
  const otherFiles = _HQ_MIZ_CONTEXT.otherFilesMap;
  if (otherFiles) {
    Object.entries(otherFiles).forEach(function([name, data]) { newZip.file(name, data); });
  }
  return newZip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

// P3.2 — Helper de recherche dans le modèle
function findGroupById(groupId) {
  if (!_HQ_MIZ_CONTEXT) return null;
  const cg = _HQ_MIZ_CONTEXT.model.clientGroups || [];
  return cg.find(slot => slot.group.groupId === groupId) || null;
}

function findUnitById(unitId) {
  if (!_HQ_MIZ_CONTEXT) return null;
  const cg = _HQ_MIZ_CONTEXT.model.clientGroups || [];
  for (const slot of cg) {
    if (slot.unit && slot.unit.unitId === unitId) return { unit: slot.unit, group: slot.group };
  }
  return null;
}

// P3.3 — Construire les patches depuis un Flight Package
function buildPatchesFromPackage(pkg) {
  if (!_HQ_MIZ_CONTEXT) throw new Error('Aucun .miz chargé');
  const src = _HQ_MIZ_CONTEXT.missionText;
  const warnings = [];
  const patches = [];
  const seenOffsets = new Set();

  const fl = pkg.flight;
  const ov = pkg.overrides || {};

  // Fingerprint check (§6) — avertir si mismatch, ne pas bloquer
  const loadedFp = HQ_SNAPSHOT && HQ_SNAPSHOT.sourceMission && HQ_SNAPSHOT.sourceMission.fingerprint;
  const pkgFp = pkg.sourceMission && pkg.sourceMission.fingerprint;
  if (pkgFp && loadedFp && pkgFp !== loadedFp) {
    warnings.push('Fingerprint mismatch: package=' + pkgFp.slice(0,20) + '… loaded=' + loadedFp.slice(0,20) + '…');
  }

  // Matching groupe
  const slot = findGroupById(fl.groupId);
  if (!slot) {
    warnings.push('Groupe groupId=' + fl.groupId + ' introuvable dans le modèle');
    return { patches: [], warnings };
  }
  if (slot.group.name !== fl.groupName) {
    warnings.push('groupName mismatch: package="' + fl.groupName + '" modèle="' + slot.group.name + '" — patch continué');
  }

  // overrides.groupFrequency
  if (ov.groupFrequency && ov.groupFrequency.value !== undefined) {
    const gfPos = slot.group.frequency && slot.group.frequency.valuePos;
    if (gfPos) {
      if (seenOffsets.has(gfPos.start.offset)) {
        warnings.push('Conflit doublon groupFrequency offset=' + gfPos.start.offset);
      } else {
        seenOffsets.add(gfPos.start.offset);
        patches.push({ pos: gfPos, newValueStr: String(ov.groupFrequency.value) });
      }
    } else {
      warnings.push('groupFrequency.valuePos absent pour le groupe');
    }
  }

  // overrides.radios[]
  for (const rOv of (ov.radios || [])) {
    const found = findUnitById(rOv.unitId);
    if (!found) { warnings.push('unitId=' + rOv.unitId + ' introuvable'); continue; }
    const u = found.unit;
    const radio = (u.radios || []).find(r => r.index === rOv.radioIndex);
    if (!radio) { warnings.push('Radio index=' + rOv.radioIndex + ' introuvable pour unitId=' + rOv.unitId); continue; }
    const ch = radio.channels && radio.channels[rOv.channel];
    if (!ch) { warnings.push('Canal ' + rOv.channel + ' introuvable pour radio ' + rOv.radioIndex + ' unitId=' + rOv.unitId); continue; }
    const fPos = ch.frequencyPos;
    if (!fPos) { warnings.push('frequencyPos absent canal ' + rOv.channel + ' radio ' + rOv.radioIndex); continue; }
    if (seenOffsets.has(fPos.start.offset)) {
      warnings.push('Conflit doublon fréquence offset=' + fPos.start.offset);
      continue;
    }
    seenOffsets.add(fPos.start.offset);
    patches.push({ pos: fPos, newValueStr: String(rOv.frequency) });
  }

  // overrides.liveries[]
  for (const lOv of (ov.liveries || [])) {
    const found = findUnitById(lOv.unitId);
    if (!found) { warnings.push('unitId=' + lOv.unitId + ' introuvable (livrée)'); continue; }
    const u = found.unit;
    if (!u.liveryPos) { warnings.push('liveryPos absent pour unitId=' + lOv.unitId + ' (livrée vide dans .miz ?)'); continue; }
    const lPos = u.liveryPos;
    if (seenOffsets.has(lPos.start.offset)) {
      warnings.push('Conflit doublon livrée offset=' + lPos.start.offset);
      continue;
    }
    seenOffsets.add(lPos.start.offset);
    // Livrée = string Lua → newValueStr inclut les guillemets
    const escaped = lOv.liveryId.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    patches.push({ pos: lPos, newValueStr: '"' + escaped + '"' });
  }

  // P4.3 — replacements.route et replacements.payloads[]
  const repl = pkg.replacements || {};

  // replacements.route → remplacer source[pointsPos] par serializeLua(route.points)
  if (repl.route && repl.route.points !== undefined) {
    const pPos = slot.group.pointsPos;
    if (!pPos) {
      warnings.push('pointsPos absent pour groupe ' + fl.groupId + ' — route non patchable');
    } else {
      // Conflit logique : un override radio sur le même groupe tomberait dans la tranche remplacée
      const conflictingOverride = patches.find(p => p._groupId === fl.groupId);
      if (conflictingOverride) {
        warnings.push('Conflit replacements.route + override scalaire sur groupe ' + fl.groupId + ' — override ignoré');
        // Retirer les patches conflictuels
        for (let i = patches.length - 1; i >= 0; i--) {
          if (patches[i]._groupId === fl.groupId) patches.splice(i, 1);
        }
        seenOffsets.delete(conflictingOverride.pos.start.offset);
      }
      if (seenOffsets.has(pPos.start.offset)) {
        warnings.push('Conflit doublon route offset=' + pPos.start.offset);
      } else {
        const lua = serializeLua(repl.route.points);
        if (lua === null) {
          warnings.push('serializeLua route.points retourne null — route ignorée');
        } else {
          seenOffsets.add(pPos.start.offset);
          patches.push({ pos: pPos, newValueStr: lua, _groupId: fl.groupId });
        }
      }
    }
  }

  // replacements.payloads[] → par unité
  for (const pOv of (repl.payloads || [])) {
    const found = findUnitById(pOv.unitId);
    if (!found) { warnings.push('unitId=' + pOv.unitId + ' introuvable (payload replacement)'); continue; }
    const u = found.unit;
    if (!u.payloadPos) { warnings.push('payloadPos absent pour unitId=' + pOv.unitId); continue; }
    const pp = u.payloadPos;
    if (seenOffsets.has(pp.start.offset)) {
      warnings.push('Conflit doublon payload offset=' + pp.start.offset);
      continue;
    }
    const lua = serializeLua(pOv.payload);
    if (lua === null) { warnings.push('serializeLua payload retourne null — payload ignoré'); continue; }
    seenOffsets.add(pp.start.offset);
    patches.push({ pos: pp, newValueStr: lua, _unitId: pOv.unitId });
  }

  // Tri offset décroissant (obligatoire pour splice sans décalage)
  patches.sort(function(a, b) { return b.pos.start.offset - a.pos.start.offset; });

  return { patches, warnings };
}

// P3.3 — Auto-vérif post-patch (§ mémoire #21 : re-extraction → assert valeurs)
function verifyPatch(patchedSrc, pkg) {
  const ov = pkg.overrides || {};
  try {
    const { tokens: vTk } = DCS_TOKENIZER.tokenize(patchedSrc);
    const vAst = DCS_PARSER.parse(vTk);
    const vModel = DCS_EXTRACTOR.extract(vAst, patchedSrc, _mizFilename || '', {}, patchedSrc.split('\n'));
    const errors = [];

    // Vérifier chaque radio patchée
    for (const rOv of (ov.radios || [])) {
      const slot = (vModel.clientGroups || []).find(s => s.unit && s.unit.unitId === rOv.unitId);
      if (!slot) { errors.push('unitId=' + rOv.unitId + ' absent post-patch'); continue; }
      const u = slot.unit;
      const radio = (u.radios || []).find(r => r.index === rOv.radioIndex);
      const ch = radio && radio.channels && radio.channels[rOv.channel];
      if (!ch) { errors.push('Canal ' + rOv.channel + ' absent post-patch'); continue; }
      if (Math.abs(Number(ch.frequency) - Number(rOv.frequency)) > 0.01) {
        errors.push('Fréquence attendue ' + rOv.frequency + ' obtenu ' + ch.frequency + ' canal ' + rOv.channel);
      }
    }

    // Vérifier chaque livrée patchée
    for (const lOv of (ov.liveries || [])) {
      const slot = (vModel.clientGroups || []).find(s => s.unit && s.unit.unitId === lOv.unitId);
      if (!slot) { errors.push('unitId=' + lOv.unitId + ' absent post-patch (livrée)'); continue; }
      const u = slot.unit;
      if (u.livery_id !== lOv.liveryId) {
        errors.push('Livrée attendue "' + lOv.liveryId + '" obtenu "' + (u.livery_id||'') + '"');
      }
    }

    // P4.3 — Vérifier replacements.route + replacements.payloads
    const repl = pkg.replacements || {};
    if (repl.route && repl.route.points !== undefined) {
      // Re-extraire le groupe patché
      const rpCheck = _extractRouteAndPayloads(vAst, pkg.flight.groupId);
      if (rpCheck && rpCheck.pointsNode) {
        const newVal = astToValue(rpCheck.pointsNode);
        if (!deepEqValues(repl.route.points, newVal)) {
          errors.push('route.points post-patch diverge du package');
        }
      } else {
        errors.push('pointsNode introuvable après patch route');
      }
    }
    for (const pOv of (repl.payloads || [])) {
      const rpCheck = _extractRouteAndPayloads(vAst, pkg.flight.groupId);
      if (!rpCheck || !rpCheck.unitPayloads[pOv.unitId]) {
        errors.push('payload introuvable après patch pour unitId=' + pOv.unitId);
        continue;
      }
      const newVal = astToValue(rpCheck.unitPayloads[pOv.unitId].payloadNode);
      if (!deepEqValues(pOv.payload, newVal)) {
        errors.push('payload post-patch diverge du package pour unitId=' + pOv.unitId);
      }
    }

    const totalChecked = (ov.radios||[]).length + (ov.liveries||[]).length +
      (repl.route ? 1 : 0) + (repl.payloads||[]).length;
    if (errors.length > 0) throw new Error('Auto-vérif post-patch échouée: ' + errors.join('; '));
    console.log('[HQ P4] Auto-vérif OK — ' + totalChecked + ' champ(s) validé(s)');
  } catch(e) {
    throw new Error('Vérif post-patch: ' + e.message);
  }
}

// P3.1 — Pipeline complet : package → _patched.miz
async function applyPackageAndDownload(pkg) {
  if (!_HQ_MIZ_CONTEXT) { showToast(t('toast.mizNotLoaded')); return; }
  try {
    showToast(t('toast.patchApplying'));
    const { patches, warnings } = buildPatchesFromPackage(pkg);
    if (warnings.length) console.warn('[HQ P3] Warnings:', warnings);

    if (patches.length === 0) {
      showToast(t('toast.patchNoChange'));
      return;
    }

    const patchedSrc = applyPatches(_HQ_MIZ_CONTEXT.missionText, patches);
    console.log('[HQ P3] ' + patches.length + ' patch(es), Δ=' + (patchedSrc.length - _HQ_MIZ_CONTEXT.missionText.length) + ' chars');

    // Retokenize de sécurité (abort si échec)
    retokenizeSafety(patchedSrc);

    // Auto-vérif post-patch
    verifyPatch(patchedSrc, pkg);

    // Rezip
    const blob = await rebuildMizHQ(patchedSrc);
    const ts = Date.now();
    const outName = (_mizFilename || 'mission').replace(/\.miz$/i, '') + '_patched_' + ts + '.miz';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = outName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    const warnMsg = warnings.length ? ' (' + warnings.length + ' avertissement(s))' : '';
    showToast(t('toast.patchDone') + warnMsg);
    if (warnings.length) console.warn('[HQ P3] Warnings détaillés:', warnings.join('\n'));

    // Recharger le contexte depuis le texte patché
    const { tokens: rTk } = DCS_TOKENIZER.tokenize(patchedSrc);
    const rAst = DCS_PARSER.parse(rTk);
    const rModel = DCS_EXTRACTOR.extract(rAst, patchedSrc, _mizFilename || '', _HQ_MIZ_CONTEXT.otherFilesMap, patchedSrc.split('\n'));
    _HQ_MIZ_CONTEXT.missionText = patchedSrc;
    _HQ_MIZ_CONTEXT.ast = rAst;
    _HQ_MIZ_CONTEXT.model = rModel;
    _mizFilename = outName;
    console.log('[HQ P3] Contexte mis à jour avec le texte patché');

  } catch(err) {
    showToast(t('toast.patchError') + err.message);
    console.error('[HQ P3] Patch error:', err);
  }
}

// P3.4 — Chemin dev/test (masqué derrière ?dev=1)
const _IS_DEV = window.location.search.includes('dev=1');

function initCommanderUI() {
  const cmdSection = document.getElementById('commander-section');
  if (!cmdSection) return;

  if (_IS_DEV) {
    // Mode dev : textarea pour coller un Flight Package JSON
    const devArea = document.getElementById('commander-dev-area');
    if (devArea) devArea.style.display = 'block';
    const btnApply = document.getElementById('commander-dev-apply');
    if (btnApply) {
      btnApply.addEventListener('click', () => {
        const ta = document.getElementById('commander-dev-ta');
        if (!ta || !ta.value.trim()) return;
        try {
          const pkg = JSON.parse(ta.value.trim());
          applyPackageAndDownload(pkg);
        } catch(e) {
          showToast(t('toast.packageJsonInvalid') + e.message);
        }
      });
    }
  }
}

/* ============= LISTES DE LA BARRE — thème de l'interface (lot mp-ui-listes) =============
   Le <select> reste dans la page (id, options, écouteurs) : il garde la valeur, mais il est masqué.
   Un <button> de mêmes classes prend sa place et porte le libellé de l'option choisie ; la liste ouverte
   est un <ul role="listbox"> posé en fin de <body> (la barre défile et couperait ce qui déborde).
   Le libellé suit toujours le <select> : mutations du DOM (options reconstruites, traduites, désactivées,
   title) et affectations par le code (value, selectedIndex) interceptées sur l'instance. */
const TBM = { cur: null, bound: false, swallow: false };

function initToolbarMenus(specs) {
  specs.forEach(sp => tbmAttach(document.getElementById(sp[0]), sp[1]));
  if (TBM.bound) return;
  TBM.bound = true;
  document.addEventListener('pointerdown', tbmOutside, true);
  window.addEventListener('click', tbmSwallowClick, true);
  window.addEventListener('resize', () => tbmClose(false));
  window.addEventListener('blur', () => tbmClose(false));
  window.addEventListener('scroll', tbmScrolled, true);
}

function tbmAttach(sel, labelFn) {
  if (!sel || !sel.parentNode || sel.hasAttribute('data-tbm-src')) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = sel.className + ' tbm-trigger';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'tbm-list-' + sel.id);
  const lbl = document.createElement('span');
  lbl.className = 'tbm-lbl';
  btn.appendChild(lbl);
  const m = { sel: sel, btn: btn, lbl: lbl, labelFn: labelFn, panel: null, active: -1, type: '', typeTimer: 0, x0: 0, y0: 0 };
  sel.parentNode.insertBefore(btn, sel);
  sel.setAttribute('data-tbm-src', '');
  ['value', 'selectedIndex'].forEach(k => {
    const d = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, k);
    if (!d || !d.set) return;
    Object.defineProperty(sel, k, {
      configurable: true, enumerable: true,
      get() { return d.get.call(this); },
      set(v) { d.set.call(this, v); tbmSync(m); }
    });
  });
  new MutationObserver(() => tbmSync(m)).observe(sel, {
    childList: true, subtree: true, characterData: true, attributes: true,
    attributeFilter: ['title', 'aria-label', 'disabled', 'label', 'selected', 'value']
  });
  sel.addEventListener('change', () => tbmSync(m));
  ['focus', 'mouseover'].forEach(ev => btn.addEventListener(ev, () => tbmSync(m)));   /* filet : option.selected posé par le code */
  btn.addEventListener('click', () => { if (m.panel) tbmClose(true); else tbmOpen(m); });
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!m.panel) tbmOpen(m);
    }
  });
  tbmSync(m);
}

/* Le libellé affiché = l'option choisie ; la largeur = l'option la plus large (comme le <select>) */
function tbmSync(m) {
  const sel = m.sel, o = sel.options, i = sel.selectedIndex;
  const txt = i >= 0 && o[i] ? o[i].label : '';
  if (m.lbl.textContent !== txt) m.lbl.textContent = txt;
  const all = [];
  for (let k = 0; k < o.length; k++) all.push(o[k].label);
  const w = all.join(String.fromCharCode(10));
  if (m.lbl.getAttribute('data-w') !== w) m.lbl.setAttribute('data-w', w);
  let name = '';
  try { name = m.labelFn(); } catch (e) { name = ''; }
  m.btn.setAttribute('aria-label', name);
  if (sel.hasAttribute('title')) m.btn.title = sel.title; else m.btn.removeAttribute('title');
  m.btn.disabled = sel.disabled;
}

function tbmOpen(m) {
  if (TBM.cur) tbmClose(false);
  if (m.sel.disabled) return;
  tbmSync(m);
  const sel = m.sel, opts = sel.options, name = m.labelFn();
  const ul = document.createElement('ul');
  ul.className = 'tbm-panel';
  ul.id = 'tbm-list-' + sel.id;
  ul.setAttribute('role', 'listbox');
  ul.setAttribute('aria-label', name);
  ul.tabIndex = -1;
  const head = document.createElement('li');
  head.className = 'tbm-head';
  head.setAttribute('role', 'presentation');
  head.textContent = name;
  ul.appendChild(head);
  for (let k = 0; k < opts.length; k++) {
    const o = opts[k], li = document.createElement('li');
    li.className = 'tbm-opt';
    li.id = 'tbm-' + sel.id + '-' + k;
    li.setAttribute('role', 'option');
    li.setAttribute('aria-selected', k === sel.selectedIndex ? 'true' : 'false');
    li.setAttribute('data-i', String(k));
    const mark = document.createElement('span');
    mark.className = 'tbm-mark';
    const txt = document.createElement('span');
    txt.className = 'tbm-txt';
    let label = o.label, note = '';
    if (o.disabled) {
      li.setAttribute('aria-disabled', 'true');
      const j = label.indexOf(' — ');
      if (j >= 0) { note = label.slice(j + 3); label = label.slice(0, j); }
    }
    txt.textContent = label;
    li.appendChild(mark);
    li.appendChild(txt);
    if (note) {
      const n = document.createElement('span');
      n.className = 'tbm-note';
      n.textContent = note;
      li.appendChild(n);
    }
    ul.appendChild(li);
  }
  ul.addEventListener('keydown', e => tbmKey(m, e));
  ul.addEventListener('click', e => {
    const li = e.target.closest ? e.target.closest('.tbm-opt') : null;
    if (!li || li.getAttribute('aria-disabled') === 'true') return;
    tbmChoose(m, Number(li.getAttribute('data-i')));
  });
  ul.addEventListener('mousemove', e => {
    const li = e.target.closest ? e.target.closest('.tbm-opt') : null;
    if (!li || li.getAttribute('aria-disabled') === 'true') return;
    const k = Number(li.getAttribute('data-i'));
    if (k !== m.active) tbmSetActive(m, k, false);
  });
  document.body.appendChild(ul);
  m.panel = ul;
  TBM.cur = m;
  m.btn.classList.add('tbm-trigger-open');
  m.btn.setAttribute('aria-expanded', 'true');
  tbmPlace(m);
  let k0 = sel.selectedIndex;
  if (k0 < 0 || (opts[k0] && opts[k0].disabled)) k0 = tbmFirst(m, 1);
  tbmSetActive(m, k0, 'center');
  ul.focus({ preventScroll: true });
}

/* Sous le bouton (4 px), bord gauche aligné, au moins aussi large, à 8 px au moins des bords de la fenêtre */
function tbmPlace(m) {
  const r = m.btn.getBoundingClientRect(), p = m.panel;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const top = r.bottom + 4;
  m.x0 = r.left; m.y0 = r.top;
  p.style.minWidth = Math.max(180, r.width) + 'px';
  p.style.top = top + 'px';
  p.style.left = r.left + 'px';
  p.style.maxHeight = Math.max(60, Math.min(0.62 * vh, 440, vh - top - 12)) + 'px';
  const w = p.getBoundingClientRect().width;
  let left = r.left;
  if (left + w > vw - 8) left = vw - 8 - w;
  if (left < 8) left = 8;
  p.style.left = left + 'px';
}

function tbmFirst(m, d) {
  const o = m.sel.options;
  let k = d > 0 ? 0 : o.length - 1;
  for (; k >= 0 && k < o.length; k += d) if (!o[k].disabled) return k;
  return -1;
}

function tbmSetActive(m, k, reveal) {
  const p = m.panel;
  if (!p) return;
  const prev = p.querySelector('.tbm-opt.active');
  if (prev) prev.classList.remove('active');
  m.active = k;
  const li = k >= 0 ? p.querySelector('.tbm-opt[data-i="' + k + '"]') : null;
  if (!li) { p.removeAttribute('aria-activedescendant'); return; }
  li.classList.add('active');
  p.setAttribute('aria-activedescendant', li.id);
  if (!reveal) return;
  const t = li.offsetTop, h = li.offsetHeight;
  if (k === tbmFirst(m, 1)) p.scrollTop = 0;
  else if (t < p.scrollTop) p.scrollTop = t;
  else if (t + h > p.scrollTop + p.clientHeight) p.scrollTop = reveal === 'center' ? Math.max(0, t - (p.clientHeight - h) / 2) : t + h - p.clientHeight;
}

function tbmStep(m, d) {
  const o = m.sel.options;
  for (let k = m.active + d; k >= 0 && k < o.length; k += d) {
    if (!o[k].disabled) { tbmSetActive(m, k, true); return; }
  }
}

/* Saisie de lettres : première option qui commence par elles, remise à zéro après 0,7 s */
function tbmType(m, ch) {
  clearTimeout(m.typeTimer);
  m.type += ch.toLowerCase();
  m.typeTimer = setTimeout(() => { m.type = ''; }, 700);
  const o = m.sel.options;
  for (let k = 0; k < o.length; k++) {
    if (!o[k].disabled && o[k].label.toLowerCase().indexOf(m.type) === 0) { tbmSetActive(m, k, true); return; }
  }
}

function tbmKey(m, e) {
  const k = e.key;
  if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); tbmStep(m, k === 'ArrowDown' ? 1 : -1); }
  else if (k === 'Home') { e.preventDefault(); tbmSetActive(m, tbmFirst(m, 1), true); }
  else if (k === 'End') { e.preventDefault(); tbmSetActive(m, tbmFirst(m, -1), true); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (m.active >= 0) tbmChoose(m, m.active); }
  else if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); tbmClose(true); }
  else if (k === 'Tab') { tbmClose(true); }   /* sans preventDefault : le focus part du bouton vers le contrôle suivant */
  else if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); tbmType(m, k); }
}

/* Choisir : si la valeur change, le <select> la prend et reçoit un évènement change (qui bouillonne) */
function tbmChoose(m, k) {
  const sel = m.sel, o = sel.options[k];
  if (!o || o.disabled) return;
  const changed = k !== sel.selectedIndex;
  tbmClose(true);
  if (!changed) return;
  sel.selectedIndex = k;
  sel.dispatchEvent(new Event('change', { bubbles: true }));
}

function tbmClose(refocus) {
  const m = TBM.cur;
  if (!m) return;
  TBM.cur = null;
  clearTimeout(m.typeTimer);
  m.type = '';
  if (m.panel) m.panel.remove();
  m.panel = null;
  m.active = -1;
  m.btn.classList.remove('tbm-trigger-open');
  m.btn.setAttribute('aria-expanded', 'false');
  if (refocus) m.btn.focus({ preventScroll: true });
}

/* Un toucher ou un clic hors de la liste et du bouton la ferme, sans agir ailleurs (le clic qui suit est avalé) ;
   le bouton d'une autre liste ferme celle-ci et s'ouvre ensuite par son propre clic. */
function tbmOutside(e) {
  const m = TBM.cur;
  if (!m) return;
  const t = e.target;
  if (m.panel.contains(t) || m.btn.contains(t)) return;
  const other = t && t.closest ? t.closest('.tbm-trigger') : null;
  tbmClose(false);
  if (other) return;
  TBM.swallow = true;
  const rel = () => { document.removeEventListener('pointerup', rel, true); document.removeEventListener('pointercancel', rel, true); setTimeout(() => { TBM.swallow = false; }, 350); };
  document.addEventListener('pointerup', rel, true);
  document.addEventListener('pointercancel', rel, true);
}

function tbmSwallowClick(e) {
  if (!TBM.swallow) return;
  TBM.swallow = false;
  e.stopPropagation();
  e.preventDefault();
}

/* Le défilement de la barre (ou de la page) déplace le bouton : la liste se ferme */
function tbmScrolled(e) {
  const m = TBM.cur;
  if (!m || !m.panel) return;
  if (e.target === m.panel || (e.target.nodeType && m.panel.contains(e.target))) return;
  const r = m.btn.getBoundingClientRect();
  if (Math.abs(r.left - m.x0) > 0.5 || Math.abs(r.top - m.y0) > 0.5) tbmClose(false);
}

// ── Init ───────────────────────────────────────────────────────
function init() {
  loadTheme();
  loadLang();
  initToolbarMenus([['theme-select', () => t('toolbar.theme.tooltip')]]);   // les listes de la barre au thème de l'interface
  wingConfig = loadWingConfig();
  renderWingEditor();
  bindWingEditorEvents();
  initToolbarEvents();
  initMissionEvents();
  loadPersistedSnapshot();  // P2 — restaurer snapshot au rechargement
  initCommanderUI();        // P3 — chemin dev/test + ghost Commander
}

init();
